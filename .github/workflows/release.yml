name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag de versión (ej. v3.2.2)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          npm install
          pip install jsonschema pydantic python-dotenv
          npm --prefix apps/web-pwa install

      - name: Run tests
        run: npm test

      - name: Build banks and PWA
        run: |
          python3 cli/bin/build_banks.py
          npm --prefix apps/web-pwa run build

      - name: Package dist artifact
        run: |
          (cd apps/web-pwa/dist && zip -r "$GITHUB_WORKSPACE/plegueviation-exam-dist.zip" .)

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" plegueviation-exam-dist.zip --clobber
            gh release edit "$TAG" --generate-notes
          else
            gh release create "$TAG" plegueviation-exam-dist.zip --generate-notes --title "$TAG"
          fi
