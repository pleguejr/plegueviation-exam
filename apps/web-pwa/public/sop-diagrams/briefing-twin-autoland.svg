<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1150" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c16"/>
      <stop offset="50%" stop-color="#0c1626"/>
      <stop offset="100%" stop-color="#050810"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#152238"/>
      <stop offset="100%" stop-color="#0f192b"/>
    </linearGradient>
    <linearGradient id="binterGreenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="binterBlueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1600" height="1150" fill="url(#bgGrad)"/>

  <!-- Header Banner -->
  <g transform="translate(40, 25)">
    <rect width="1520" height="85" rx="12" fill="#132035" stroke="#253856" stroke-width="2" filter="url(#shadow)"/>
    <rect width="12" height="85" fill="url(#binterGreenGrad)" rx="3"/>
    
    <text x="35" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#f8fafc" letter-spacing="0.5">
      BRIEFING TWIN — CAT II / CAT III &amp; AUTOLAND
    </text>
    <text x="35" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#38bdf8">
      Aproximaciones de Precisión ILS • Binter MOA 8.4 &amp; MOB 2.0.6.2 • Embraer 195-E2
    </text>

    <rect x="1330" y="24" width="160" height="38" rx="8" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1.5"/>
    <text x="1410" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#34d399" text-anchor="middle">
      AUTOLAND 1 / APPR 2
    </text>
  </g>

  <!-- ILS Autoland Descent Profile Diagram with Binter E195-E2 -->
  <g transform="translate(40, 130)">
    <rect width="1520" height="175" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)"/>
    
    <!-- Senda de Descenso 3° (Glide Path) -->
    <line x1="80" y1="30" x2="1420" y2="135" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="6,4"/>
    
    <!-- Runway Touchdown Zone -->
    <rect x="1360" y="130" width="120" height="15" fill="#334155" stroke="#64748b"/>
    <line x1="1380" y1="130" x2="1380" y2="145" stroke="#fef08a" stroke-width="3"/>
    <text x="1420" y="165" font-family="sans-serif" font-size="12" font-weight="700" fill="#94a3b8" text-anchor="middle">TOUCHDOWN</text>

    <!-- Aircraft on Senda (Binter E195-E2) -->
    <g transform="translate(560, 68) rotate(3) scale(0.65)">
<g id="realistic-e195-lateral">
  <!-- Fuselage Profile (Side View) -->
  <path d="M -170,4 C -170,0 -140,-8 -90,-9 L 110,-9 C 145,-9 175,-5 195,1 C 205,4 205,7 195,9 C 175,13 145,15 110,15 L -90,15 C -135,15 -160,11 -170,4 Z" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/>
  <!-- Nose Radome Cone -->
  <path d="M 185,-3 C 198,1 204,4 204,5 C 204,6 198,9 185,12 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <!-- Cockpit Windshield (4-panel E2 cockpit) -->
  <path d="M 160,-6 L 180,-4 L 183,1 L 162,0 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <!-- Passenger Windows (2-by-2 E-Jets cabin) -->
  <g fill="#1e293b" opacity="0.85">
    <rect x="-65" y="-3" width="3.5" height="5" rx="1.2"/>
    <rect x="-55" y="-3" width="3.5" height="5" rx="1.2"/>
    <rect x="-45" y="-3" width="3.5" height="5" rx="1.2"/>
    <rect x="-35" y="-3" width="3.5" height="5" rx="1.2"/>
    <rect x="-25" y="-3" width="3.5" height="5" rx="1.2"/>
    <rect x="-15" y="-3" width="3.5" height="5" rx="1.2"/>
    <rect x="-5" y="-3" width="3.5" height="5" rx="1.2"/>
    <rect x="5" y="-3" width="3.5" height="5" rx="1.2"/>
    <rect x="15" y="-3" width="3.5" height="5" rx="1.2"/>
    <rect x="25" y="-3" width="3.5" height="5" rx="1.2"/>
    <rect x="35" y="-3" width="3.5" height="5" rx="1.2"/>
    <rect x="45" y="-3" width="3.5" height="5" rx="1.2"/>
    <rect x="55" y="-3" width="3.5" height="5" rx="1.2"/>
    <rect x="65" y="-3" width="3.5" height="5" rx="1.2"/>
    <rect x="75" y="-3" width="3.5" height="5" rx="1.2"/>
    <rect x="85" y="-3" width="3.5" height="5" rx="1.2"/>
    <rect x="95" y="-3" width="3.5" height="5" rx="1.2"/>
    <rect x="105" y="-3" width="3.5" height="5" rx="1.2"/>
    <rect x="115" y="-3" width="3.5" height="5" rx="1.2"/>
    <rect x="125" y="-3" width="3.5" height="5" rx="1.2"/>
  </g>
  <!-- Passenger Doors -->
  <rect x="142" y="-4" width="7" height="15" rx="1.5" fill="none" stroke="#94a3b8" stroke-width="1"/>
  <rect x="-85" y="-4" width="7" height="15" rx="1.5" fill="none" stroke="#94a3b8" stroke-width="1"/>
  <!-- Binter Livery Dynamic Swoosh (Green & Blue) -->
  <path d="M -80,4 C -10,4 60,6 150,2 L 155,7 C 65,11 -5,9 -75,9 Z" fill="#059669"/>
  <path d="M -70,9 C 0,9 70,11 160,7 L 163,12 C 73,15 5,14 -65,14 Z" fill="#0284c7"/>
  <!-- Binter Green Tailfin (Vertical Stabilizer) -->
  <path d="M -115,-8 L -175,-72 L -140,-72 L -80,-8 Z" fill="#059669" stroke="#047857" stroke-width="1.2"/>
  <path d="M -155,-72 L -140,-72 L -85,-8 L -100,-8 Z" fill="#10b981"/>
  <path d="M -145,-72 L -140,-72 L -90,-8 L -95,-8 Z" fill="#0284c7"/>
  <!-- Horizontal Stabilizer Side Profile -->
  <path d="M -155,-60 L -185,-60 L -180,-55 L -150,-55 Z" fill="#cbd5e1"/>
  <!-- Main Wing Low Profile & Flap Fairings -->
  <path d="M 0,10 L 40,28 L 50,28 L 25,10 Z" fill="#cbd5e1" stroke="#64748b" stroke-width="1"/>
  <!-- PW1900G Geared Turbofan Engine (Side View) -->
  <!-- Pylon -->
  <path d="M 35,4 L 45,4 L 40,12 L 30,12 Z" fill="#64748b"/>
  <!-- Nacelle -->
  <path d="M 15,10 L 65,10 C 72,10 75,15 75,22 C 75,29 72,34 65,34 L 15,34 C 10,34 8,29 8,22 C 8,15 10,10 15,10 Z" fill="#f8fafc" stroke="#475569" stroke-width="1.2"/>
  <!-- Engine Intake Lip (Silver) -->
  <path d="M 62,10 C 68,10 72,14 72,22 C 72,30 68,34 62,34 Z" fill="#334155" stroke="#94a3b8" stroke-width="1"/>
  <!-- Exhaust Cone -->
  <path d="M 8,17 L 0,22 L 8,27 Z" fill="#1e293b"/>
  <!-- Binter Green Accent on Nacelle -->
  <path d="M 30,12 L 52,12 L 52,32 L 30,32 Z" fill="#059669"/>
  <!-- Nose & Main Landing Gear (optional / retracted or extended) -->
</g>
    </g>

    <!-- Milestone 1: 1500ft -->
    <g transform="translate(180, 25)">
      <circle cx="0" cy="18" r="6" fill="#38bdf8"/>
      <text x="0" y="0" font-family="sans-serif" font-size="12" font-weight="800" fill="#38bdf8" text-anchor="middle">1.500 FT RA</text>
      <text x="0" y="38" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#cbd5e1" text-anchor="middle">"AUTOLAND 1"</text>
    </g>

    <!-- Milestone 2: 500ft -->
    <g transform="translate(680, 70)">
      <circle cx="0" cy="15" r="6" fill="#38bdf8"/>
      <text x="0" y="0" font-family="sans-serif" font-size="12" font-weight="800" fill="#38bdf8" text-anchor="middle">500 FT RA</text>
      <text x="0" y="34" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#cbd5e1" text-anchor="middle">"FIVE HUNDRED"</text>
    </g>

    <!-- Milestone 3: 150ft ALIGN -->
    <g transform="translate(980, 95)">
      <circle cx="0" cy="15" r="6" fill="#f59e0b"/>
      <text x="0" y="0" font-family="sans-serif" font-size="12" font-weight="800" fill="#fbbf24" text-anchor="middle">150 FT RA</text>
      <text x="0" y="34" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#fbbf24" text-anchor="middle">"ALIGN"</text>
    </g>

    <!-- Milestone 4: 50ft FLARE -->
    <g transform="translate(1160, 110)">
      <circle cx="0" cy="15" r="6" fill="#10b981"/>
      <text x="0" y="0" font-family="sans-serif" font-size="12" font-weight="800" fill="#34d399" text-anchor="middle">50 FT RA</text>
      <text x="0" y="34" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#34d399" text-anchor="middle">"FLARE"</text>
    </g>

    <!-- Milestone 5: 30ft RETARD -->
    <g transform="translate(1280, 120)">
      <circle cx="0" cy="15" r="6" fill="#38bdf8"/>
      <text x="0" y="0" font-family="sans-serif" font-size="12" font-weight="800" fill="#38bdf8" text-anchor="middle">30 FT RA</text>
      <text x="0" y="34" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#38bdf8" text-anchor="middle">"RETARD"</text>
    </g>
  </g>

  <!-- 3 Main Columns: Procedures and Limits -->
  <g transform="translate(40, 325)">
    
    <!-- Col 1: Mínimos CAT II vs CAT III -->
    <g transform="translate(0, 0)">
      <rect width="485" height="560" rx="12" fill="url(#cardGrad)" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
      <rect width="485" height="42" rx="12" fill="url(#binterGreenGrad)"/>
      <text x="242" y="27" font-family="sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">
        1. MÍNIMOS CAT II vs CAT III
      </text>

      <g transform="translate(20, 60)" font-family="sans-serif">
        <!-- CAT II Box -->
        <rect width="445" height="150" rx="8" fill="#18263e" stroke="#334155" stroke-width="1"/>
        <text x="20" y="28" font-size="15" font-weight="800" fill="#34d399">ILS CAT II (DH Típica 100 FT RA)</text>
        <text x="20" y="52" font-size="13.5" font-weight="500" fill="#e2e8f0">• RVR Mínimo: <tspan font-weight="800" fill="#38bdf8">300 m</tspan> (TDZ) / 125 m (Mid/Stop).</text>
        <text x="20" y="76" font-size="13.5" font-weight="700" fill="#fbbf24">Referencias Visuales Requeridas en DH:</text>
        <text x="20" y="98" font-size="13" font-weight="500" fill="#cbd5e1">• Segmento de al menos <tspan font-weight="700" fill="#ffffff">3 luces consecutivas</tspan> de</text>
        <text x="20" y="118" font-size="13" font-weight="500" fill="#cbd5e1">eje o aproximación + <tspan font-weight="700" fill="#ffffff">1 barra transversal</tspan>.</text>
        <text x="20" y="138" font-size="12" font-weight="500" fill="#94a3b8">(Crossbar / barra de luces de aproximación).</text>

        <!-- CAT III Box -->
        <g transform="translate(0, 165)">
          <rect width="445" height="140" rx="8" fill="#18263e" stroke="#334155" stroke-width="1"/>
          <text x="20" y="28" font-size="15" font-weight="800" fill="#38bdf8">ILS CAT III (AH Típica 50 FT RA)</text>
          <text x="20" y="52" font-size="13.5" font-weight="500" fill="#e2e8f0">• RVR Mínimo: <tspan font-weight="800" fill="#38bdf8">200 m</tspan> (TDZ) / 125 m (Mid/Stop).</text>
          <text x="20" y="76" font-size="13.5" font-weight="700" fill="#fbbf24">Referencias Visuales Requeridas en AH:</text>
          <text x="20" y="98" font-size="13" font-weight="500" fill="#cbd5e1">• Segmento de al menos <tspan font-weight="700" fill="#ffffff">3 luces consecutivas</tspan></text>
          <text x="20" y="118" font-size="13" font-weight="500" fill="#cbd5e1">del eje de pista (Centerline Lights).</text>
        </g>

        <!-- RVR Determinante -->
        <g transform="translate(0, 320)">
          <rect width="445" height="95" rx="8" fill="#132035" stroke="#253856" stroke-width="1"/>
          <text x="20" y="26" font-size="14" font-weight="800" fill="#f59e0b">RVR DETERMINANTE:</text>
          <text x="20" y="48" font-size="13" font-weight="500" fill="#cbd5e1">El RVR de la zona de toma de contacto (TDZ)</text>
          <text x="20" y="68" font-size="13" font-weight="500" fill="#cbd5e1">es siempre el determinante para la aproximación.</text>
        </g>
      </g>
    </g>

    <!-- Col 2: Configuración MCDU & Cabina -->
    <g transform="translate(515, 0)">
      <rect width="485" height="560" rx="12" fill="url(#cardGrad)" stroke="#0284c7" stroke-width="2" filter="url(#shadow)"/>
      <rect width="485" height="42" rx="12" fill="url(#binterBlueGrad)"/>
      <text x="242" y="27" font-family="sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">
        2. VERIFICACIÓN MCDU &amp; CABINA
      </text>

      <g transform="translate(20, 60)" font-family="sans-serif">
        <rect width="445" height="130" rx="8" fill="#18263e" stroke="#334155" stroke-width="1"/>
        <text x="20" y="28" font-size="15" font-weight="800" fill="#38bdf8">Chequeo de Estado en MCDU</text>
        <text x="20" y="52" font-size="13.5" font-weight="500" fill="#e2e8f0">Navegar a la ruta de verificación:</text>
        <text x="20" y="74" font-size="13.5" font-weight="700" fill="#34d399">MENU &gt; MISC &gt; OPR CONFIG &gt; AUTOLAND</text>
        <text x="20" y="98" font-size="13" font-weight="500" fill="#cbd5e1">• Confirmar capacidad: <tspan font-weight="800" fill="#38bdf8">AUTOLAND 1 / APPR 2</tspan></text>
        <text x="20" y="118" font-size="13" font-weight="500" fill="#cbd5e1">• Verificar ausencia de degradaciones.</text>

        <g transform="translate(0, 145)">
          <rect width="445" height="120" rx="8" fill="#18263e" stroke="#334155" stroke-width="1"/>
          <text x="20" y="28" font-size="15" font-weight="800" fill="#38bdf8">Alineación Visual de Asiento</text>
          <text x="20" y="52" font-size="13.5" font-weight="500" fill="#e2e8f0">• Alinear ojos con las <tspan font-weight="700" fill="#facc15">bolas de referencia</tspan></text>
          <text x="20" y="72" font-size="13.5" font-weight="500" fill="#e2e8f0">del montante central del parabrisas.</text>
          <text x="20" y="94" font-size="13" font-weight="500" fill="#cbd5e1">• Garantiza ángulo visual óptimo para contacto</text>
          <text x="20" y="114" font-size="13" font-weight="500" fill="#cbd5e1">con luces de pista en la DH.</text>
        </g>

        <g transform="translate(0, 280)">
          <rect width="445" height="120" rx="8" fill="#18263e" stroke="#334155" stroke-width="1"/>
          <text x="20" y="28" font-size="15" font-weight="800" fill="#38bdf8">Iluminación de Cabina (Cockpit)</text>
          <text x="20" y="52" font-size="13.5" font-weight="500" fill="#cbd5e1">• Luces de cabina atenuadas al mínimo.</text>
          <text x="20" y="74" font-size="13.5" font-weight="500" fill="#cbd5e1">• Luces Strobe en <tspan font-weight="700" fill="#ffffff">OFF</tspan> al entrar en nubes</text>
          <text x="20" y="94" font-size="13.5" font-weight="500" fill="#cbd5e1">para evitar deslumbramiento o reflejos.</text>
        </g>
      </g>
    </g>

    <!-- Col 3: Secuencia de Callouts & Frustrada -->
    <g transform="translate(1030, 0)">
      <rect width="490" height="560" rx="12" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
      <rect width="490" height="42" rx="12" fill="url(#goldGrad)"/>
      <text x="245" y="27" font-family="sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">
        3. CALLOUTS &amp; PUERTAS GO-AROUND
      </text>

      <g transform="translate(20, 60)" font-family="sans-serif">
        <rect width="450" height="90" rx="8" fill="#18263e" stroke="#334155" stroke-width="1"/>
        <text x="18" y="24" font-size="14.5" font-weight="800" fill="#38bdf8">150 FT RA ➔ PM: "ALIGN"</text>
        <text x="18" y="46" font-size="13" font-weight="500" fill="#cbd5e1">ALIGN engaged (verde) y RLOUT/RETD armados.</text>
        <text x="18" y="68" font-size="13" font-weight="700" fill="#f87171">Si no engancha: "NO ALIGN" ➔ ¡GO-AROUND!</text>

        <g transform="translate(0, 100)">
          <rect width="450" height="90" rx="8" fill="#18263e" stroke="#334155" stroke-width="1"/>
          <text x="18" y="24" font-size="14.5" font-weight="800" fill="#34d399">50 FT RA ➔ PM: "FLARE"</text>
          <text x="18" y="46" font-size="13" font-weight="500" fill="#cbd5e1">FLARE engaged y D-ROT armado.</text>
          <text x="18" y="68" font-size="13" font-weight="700" fill="#f87171">Si no engancha: "NO FLARE" ➔ ¡GO-AROUND!</text>
        </g>

        <g transform="translate(0, 200)">
          <rect width="450" height="85" rx="8" fill="#18263e" stroke="#334155" stroke-width="1"/>
          <text x="18" y="24" font-size="14.5" font-weight="800" fill="#38bdf8">30 FT RA ➔ PM: "RETARD"</text>
          <text x="18" y="46" font-size="13" font-weight="500" fill="#cbd5e1">RETD engaged, reducción de empuje a IDLE.</text>
          <text x="18" y="68" font-size="13" font-weight="500" fill="#cbd5e1">Toma ➔ "ROLLOUT" (Guiado de eje pista).</text>
        </g>

        <g transform="translate(0, 298)">
          <rect width="450" height="115" rx="8" fill="rgba(220, 38, 38, 0.2)" stroke="#ef4444" stroke-width="1.5"/>
          <text x="18" y="24" font-size="14" font-weight="800" fill="#f87171">CONDICIONES DE FRUSTRADA OBLIGATORIA:</text>
          <text x="18" y="46" font-size="12.5" font-weight="600" fill="#fecaca">• Fallo o pérdida de modo AUTOLAND por debajo de 800 ft</text>
          <text x="18" y="66" font-size="12.5" font-weight="600" fill="#fecaca">• Desvío &gt; 1 punto senda o &gt; 1/3 punto LOC</text>
          <text x="18" y="86" font-size="12.5" font-weight="600" fill="#fecaca">• Sin referencias visuales exigidas al alcanzar DH/AH</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Bottom Bar -->
  <g transform="translate(40, 1010)">
    <rect width="1520" height="110" rx="12" fill="#132035" stroke="#253856" stroke-width="2" filter="url(#shadow)"/>
    <text x="30" y="36" font-family="sans-serif" font-size="16" font-weight="800" fill="#38bdf8">
      DESCONEXIÓN DEL PILOTO AUTOMÁTICO EN AUTOLAND:
    </text>
    <text x="30" y="65" font-family="sans-serif" font-size="14" font-weight="500" fill="#cbd5e1">
      • En el Embraer 195-E2, el Piloto Automático se desconecta automáticamente a los 5 segundos de la carrera de deceleración o al intervenir en mandos.
    </text>
    <text x="30" y="90" font-family="sans-serif" font-size="14" font-weight="500" fill="#cbd5e1">
      • El Comandante asume el control direccional sobre el timón de dirección y pedales de freno en carrera de parada.
    </text>
  </g>
</svg>
