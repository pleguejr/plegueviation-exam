<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradBrief" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1a" />
      <stop offset="100%" stop-color="#121b2d" />
    </linearGradient>
    <linearGradient id="cardGradB" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#182338" />
      <stop offset="100%" stop-color="#0e1726" />
    </linearGradient>
    <linearGradient id="skyGradB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="emeraldGradB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="roseGradB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGradBrief)" />

  <!-- Grid -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="370" x2="1200" y2="370" />
    <line x1="300" y1="0" x2="300" y2="675" />
    <line x1="600" y1="0" x2="600" y2="675" />
    <line x1="900" y1="0" x2="900" y2="675" />
  </g>

  <!-- Header Banner -->
  <rect x="30" y="16" width="1140" height="64" rx="10" fill="#111c2e" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5" />
  
  <!-- Embraer 195-E2 Silhouette -->
  <g transform="translate(48, 26) scale(0.6)">
    <path d="M 0 25 Q 35 15 70 18 L 85 5 L 92 6 L 82 19 L 140 22 L 185 0 L 195 2 L 165 24 L 205 25 Q 215 25 220 28 L 200 31 L 165 31 L 145 42 L 138 41 L 148 31 L 80 30 L 70 42 L 62 41 L 68 29 Q 30 30 0 25 Z" fill="#38bdf8" fill-opacity="0.8" />
    <rect x="90" y="27" width="28" height="10" rx="4" fill="#0284c7" />
    <polygon points="185,2 193,3 175,20 168,20" fill="#10b981" />
  </g>

  <text x="185" y="44" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" letter-spacing="1">PREPARACIÓN DE VUELO &amp; BRIEFING DE TRIPULACIÓN (TELSI)</text>
  <text x="185" y="66" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Manuales Binter MOA Caps 1.4, 8.1, 8.3 &amp; MOB 2.0.6 · Flota Embraer 195-E2</text>
  
  <rect x="980" y="26" width="175" height="42" rx="6" fill="#0369a1" fill-opacity="0.4" stroke="#38bdf8" stroke-width="1" />
  <text x="1067" y="52" fill="#e0f2fe" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">SOP BINTER CANARIAS</text>

  <!-- 4 BLOCKS GRID -->
  <g transform="translate(30, 95)">
    
    <!-- BLOCK 1: SALA DELIVERY & IPAD -->
    <g transform="translate(0, 0)">
      <rect width="270" height="555" rx="12" fill="url(#cardGradB)" stroke="#38bdf8" stroke-width="1.5" />
      <rect x="14" y="14" width="28" height="28" rx="6" fill="url(#skyGradB)" />
      <text x="28" y="33" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="800" text-anchor="middle">1</text>
      
      <text x="50" y="28" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="14" font-weight="800">SALA DELIVERY / IPAD</text>
      <text x="50" y="42" fill="#94a3b8" font-size="10">Actualización y Dispositivos</text>

      <rect x="14" y="56" width="242" height="105" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="24" y="76" fill="#38bdf8" font-size="11" font-weight="800">MPO (Manuales Operativos)</text>
      <text x="24" y="92" fill="#cbd5e1" font-size="10">• Actualizar vuelo y documentación.</text>
      <text x="24" y="106" fill="#cbd5e1" font-size="10">• Revisiones vigentes de MOA/MOB.</text>
      <text x="24" y="120" fill="#cbd5e1" font-size="10">• Avisos operacionales de flota.</text>
      <text x="24" y="134" fill="#94a3b8" font-size="9.5">• Chequeo de NOTAMs / circulares.</text>

      <rect x="14" y="171" width="242" height="100" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="24" y="191" fill="#38bdf8" font-size="11" font-weight="800">ePerf (Cálculo Rendimiento)</text>
      <text x="24" y="207" fill="#cbd5e1" font-size="10">• Base de datos aeródromos activa.</text>
      <text x="24" y="221" fill="#cbd5e1" font-size="10">• Pesos estructurales E195-E2.</text>
      <text x="24" y="235" fill="#cbd5e1" font-size="10">• Comprobar estado de pistas.</text>
      <text x="24" y="249" fill="#94a3b8" font-size="9.5">• Sincronizar antes de salir.</text>

      <rect x="14" y="281" width="242" height="115" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="24" y="301" fill="#38bdf8" font-size="11" font-weight="800">LIDO mPilot &amp; Taillog</text>
      <text x="24" y="317" fill="#cbd5e1" font-size="10">• Ciclo AIRAC activo descargado.</text>
      <text x="24" y="331" fill="#cbd5e1" font-size="10">• Cartas de salida/llegada/ruta.</text>
      <text x="24" y="345" fill="#cbd5e1" font-size="10">• Descargar PVOs del día.</text>
      <text x="24" y="359" fill="#cbd5e1" font-size="10">• Estado técnico matrícula avión.</text>
      <text x="24" y="373" fill="#fca5a5" font-size="9.5">• Comprobar diferidos MEL en Taillog.</text>

      <rect x="14" y="406" width="242" height="135" rx="6" fill="#1e293b" fill-opacity="0.5" stroke="#38bdf8" stroke-width="1" />
      <text x="24" y="426" fill="#7dd3fc" font-size="11" font-weight="800">REGLA DE CARGA / EFBs:</text>
      <text x="24" y="444" fill="#cbd5e1" font-size="10">• Batería mínima EFB &gt; 50%.</text>
      <text x="24" y="458" fill="#cbd5e1" font-size="10">• iPad de reserva disponible.</text>
      <text x="24" y="472" fill="#cbd5e1" font-size="10">• Powerbanks según BOE 2026</text>
      <text x="24" y="486" fill="#cbd5e1" font-size="10">  (límite ≤ 100 Wh, en cabina).</text>
    </g>

    <!-- BLOCK 2: SOBRE DE VUELO (PVO / OFP) -->
    <g transform="translate(285, 0)">
      <rect width="280" height="555" rx="12" fill="url(#cardGradB)" stroke="#818cf8" stroke-width="1.5" />
      <rect x="14" y="14" width="28" height="28" rx="6" fill="#6366f1" />
      <text x="28" y="33" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="800" text-anchor="middle">2</text>
      
      <text x="50" y="28" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="14" font-weight="800">SOBRE DE VUELO (PVO)</text>
      <text x="50" y="42" fill="#94a3b8" font-size="10">Despacho y Plan Operacional</text>

      <rect x="14" y="56" width="252" height="95" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="24" y="76" fill="#a5b4fc" font-size="11" font-weight="800">Comprobación Inicial PVO</text>
      <text x="24" y="92" fill="#cbd5e1" font-size="10">• 1 copia manifiesto en despacho.</text>
      <text x="24" y="106" fill="#cbd5e1" font-size="10">• Matrícula, pasajeros previstos.</text>
      <text x="24" y="120" fill="#cbd5e1" font-size="10">• Tiempo de vuelo programado.</text>
      <text x="24" y="134" fill="#cbd5e1" font-size="10">• Niveles de crucero / FL.</text>

      <rect x="14" y="161" width="252" height="150" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2" />
      <text x="24" y="181" fill="#fbbf24" font-size="11" font-weight="800">Gestión de Combustible</text>
      <text x="24" y="197" fill="#cbd5e1" font-size="10">• Analizar Tankering vs Re-fuel.</text>
      <text x="24" y="211" fill="#cbd5e1" font-size="10">• ¿Combustible extra / discrecional?</text>
      <rect x="22" y="222" width="236" height="52" rx="4" fill="#78350f" fill-opacity="0.4" stroke="#f59e0b" stroke-width="1" />
      <text x="30" y="238" fill="#fde68a" font-size="10" font-weight="800">DISCRECIONAL &gt; 500 KG:</text>
      <text x="30" y="252" fill="#fef3c7" font-size="9.5">➔ Requiere recálculo obligatorio</text>
      <text x="30" y="264" fill="#fef3c7" font-size="9.5">➔ Solicitar New PVO a CCO.</text>
      <text x="24" y="294" fill="#94a3b8" font-size="9.5">• Reserva final inviolable (30 min).</text>

      <rect x="14" y="321" width="252" height="135" rx="6" fill="#0f172a" stroke="#ef4444" stroke-width="1.2" />
      <text x="24" y="341" fill="#f87171" font-size="11" font-weight="800">Requisitos Especiales LVTO</text>
      <text x="24" y="357" fill="#cbd5e1" font-size="10">• Alternativo de despegue en PVO.</text>
      <text x="24" y="371" fill="#cbd5e1" font-size="10">• Distancia máx: 1h monomotor.</text>
      <text x="24" y="385" fill="#fca5a5" font-size="10" font-weight="700">• Peso Estimado Aterrizaje (ELM):</text>
      <text x="34" y="400" fill="#fca5a5" font-size="11" font-weight="800">ELM &lt; MLM (54.000 kg)</text>
      <text x="24" y="418" fill="#cbd5e1" font-size="10">• NOTOC: Mercancías Peligrosas.</text>
      <text x="24" y="432" fill="#cbd5e1" font-size="10">• Diferidos MEL de cabina/pasaje.</text>

      <rect x="14" y="466" width="252" height="75" rx="6" fill="#1e1b4b" stroke="#818cf8" stroke-width="1" />
      <text x="24" y="486" fill="#c7d2fe" font-size="10" font-weight="800">FIRMA Y ARCHIVO:</text>
      <text x="24" y="502" fill="#e0e7ff" font-size="9.5">Firma de Comandante en PVO.</text>
      <text x="24" y="516" fill="#94a3b8" font-size="9">Copia física o digital transmitida.</text>
    </g>

    <!-- BLOCK 3: BRIEFING TRIPULACIÓN (TELSI) -->
    <g transform="translate(580, 0)">
      <rect width="280" height="555" rx="12" fill="url(#cardGradB)" stroke="#10b981" stroke-width="1.5" />
      <rect x="14" y="14" width="28" height="28" rx="6" fill="url(#emeraldGradB)" />
      <text x="28" y="33" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="800" text-anchor="middle">3</text>
      
      <text x="50" y="28" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="14" font-weight="800">BRIEFING TELSI (CABINA)</text>
      <text x="50" y="42" fill="#ef4444" font-size="10" font-weight="700">¡NUNCA NITS! Formato Oficial Binter</text>

      <rect x="14" y="56" width="252" height="385" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1" />
      
      <text x="24" y="78" fill="#34d399" font-size="11.5" font-weight="800">T - TIPO DE EMERGENCIA</text>
      <text x="24" y="94" fill="#cbd5e1" font-size="10">• Prevista (tiempo para preparar)</text>
      <text x="24" y="108" fill="#cbd5e1" font-size="10">• Imprevista / Aterrizaje Inseguro</text>

      <text x="24" y="132" fill="#34d399" font-size="11.5" font-weight="800">E - ESTIMATED TIME (ETA)</text>
      <text x="24" y="148" fill="#cbd5e1" font-size="10">• Tiempo disponible hasta la toma</text>
      <text x="24" y="162" fill="#cbd5e1" font-size="10">• Sincronizar relojes con Sobrecargo</text>

      <text x="24" y="186" fill="#34d399" font-size="11.5" font-weight="800">L - LUGAR DE ATERRIZAJE</text>
      <text x="24" y="202" fill="#cbd5e1" font-size="10">• Pista en aeródromo previsto</text>
      <text x="24" y="216" fill="#cbd5e1" font-size="10">• Tierra fuera de aeródromo</text>
      <text x="24" y="230" fill="#cbd5e1" font-size="10">• Agua (Amerizaje / Ditching)</text>

      <text x="24" y="254" fill="#34d399" font-size="11.5" font-weight="800">S - SEÑALES CONVENIDAS</text>
      <text x="24" y="270" fill="#fca5a5" font-size="10" font-weight="700">• A 5 min: "FINALIZAR PREPARACIÓN"</text>
      <text x="24" y="284" fill="#f87171" font-size="10" font-weight="800">• A 30 s: "PROTECCIÓN x3"</text>

      <text x="24" y="308" fill="#34d399" font-size="11.5" font-weight="800">I - INSTRUCCIONES ESPECIALES</text>
      <text x="24" y="324" fill="#cbd5e1" font-size="10">• Evacuación prevista sí / no</text>
      <text x="24" y="338" fill="#cbd5e1" font-size="10">• Puertas y salidas operativas</text>
      <text x="24" y="352" fill="#cbd5e1" font-size="10">• Pasajeros especiales (PRM, UM)</text>
      <text x="24" y="366" fill="#cbd5e1" font-size="10">• Repostaje con pasaje (2 salidas)</text>

      <rect x="14" y="451" width="252" height="90" rx="6" fill="#064e3b" fill-opacity="0.4" stroke="#10b981" stroke-width="1" />
      <text x="24" y="471" fill="#34d399" font-size="10.5" font-weight="800">TEM &amp; SEGURIDAD (AVSEC):</text>
      <text x="24" y="487" fill="#cbd5e1" font-size="9.5">• Palabra clave interferencia ilícita.</text>
      <text x="24" y="501" fill="#cbd5e1" font-size="9.5">• Puerta blindada cerrada y bloqueada.</text>
      <text x="24" y="515" fill="#cbd5e1" font-size="9.5">• Gestión de pasajeros conflictivos.</text>
    </g>

    <!-- BLOCK 4: CALLOUTS MANDATORIOS PA -->
    <g transform="translate(875, 0)">
      <rect width="265" height="555" rx="12" fill="url(#cardGradB)" stroke="#f43f5e" stroke-width="1.5" />
      <rect x="14" y="14" width="28" height="28" rx="6" fill="url(#roseGradB)" />
      <text x="28" y="33" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="800" text-anchor="middle">4</text>
      
      <text x="50" y="28" fill="#fda4af" font-family="system-ui, sans-serif" font-size="14" font-weight="800">AVISOS PA EN CABINA</text>
      <text x="50" y="42" fill="#94a3b8" font-size="10">Fraseología Oficial Binter</text>

      <!-- Step items PA -->
      <rect x="14" y="56" width="237" height="68" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="22" y="74" fill="#fbbf24" font-size="10" font-weight="800">INICIO DE EMERGENCIA:</text>
      <text x="22" y="90" fill="#fde68a" font-size="10" font-weight="800">"SOBRECARGO A CABINA"</text>
      <text x="22" y="106" fill="#94a3b8" font-size="9">Llamada para briefing TELSI cara a cara.</text>

      <rect x="14" y="134" width="237" height="74" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="22" y="152" fill="#38bdf8" font-size="10" font-weight="800">A 5 MINUTOS DE LA TOMA:</text>
      <text x="22" y="168" fill="#bae6fd" font-size="9.5" font-weight="800">"TRIPULACIÓN DE CABINA,</text>
      <text x="22" y="180" fill="#bae6fd" font-size="9.5" font-weight="800">FINALIZAR PREPARACIÓN"</text>
      <text x="22" y="196" fill="#94a3b8" font-size="9">Sentarse y asegurarse en sus puestos.</text>

      <rect x="14" y="218" width="237" height="74" rx="6" fill="#450a0a" fill-opacity="0.4" stroke="#ef4444" stroke-width="1.2" />
      <text x="22" y="236" fill="#f87171" font-size="10" font-weight="800">A 30 SEGUNDOS DEL IMPACTO:</text>
      <text x="22" y="254" fill="#fecaca" font-size="11" font-weight="900">"PROTECCIÓN,</text>
      <text x="22" y="268" fill="#fecaca" font-size="11" font-weight="900">PROTECCIÓN, PROTECCIÓN"</text>
      <text x="22" y="282" fill="#fca5a5" font-size="9">Adopción posición de impacto (Brace).</text>

      <rect x="14" y="302" width="237" height="74" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1" />
      <text x="22" y="320" fill="#fbbf24" font-size="10" font-weight="800">TRAS DETENER EL AVIÓN:</text>
      <text x="22" y="338" fill="#fef3c7" font-size="9.5" font-weight="800">"TRIPULACIÓN DE CABINA,</text>
      <text x="22" y="350" fill="#fef3c7" font-size="9.5" font-weight="800">ESPEREN INSTRUCCIONES"</text>
      <text x="22" y="366" fill="#94a3b8" font-size="9">Evaluación de la situación en tierra.</text>

      <rect x="14" y="386" width="237" height="68" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1" />
      <text x="22" y="404" fill="#34d399" font-size="10" font-weight="800">SITUACIÓN CONTROLADA:</text>
      <text x="22" y="420" fill="#a7f3d0" font-size="9.5" font-weight="800">"TRIPULACIÓN DE CABINA,</text>
      <text x="22" y="432" fill="#a7f3d0" font-size="9.5" font-weight="800">PERMANEZCAN SENTADAS"</text>
      <text x="22" y="446" fill="#94a3b8" font-size="9">No se evacúa (desalojo normal).</text>

      <rect x="14" y="464" width="237" height="78" rx="6" fill="#881337" stroke="#f43f5e" stroke-width="1.5" />
      <text x="22" y="482" fill="#fda4af" font-size="10" font-weight="800">ORDEN DE EVACUACIÓN:</text>
      <text x="22" y="502" fill="#ffffff" font-size="12" font-weight="900">"EVACUACIÓN,</text>
      <text x="22" y="518" fill="#ffffff" font-size="12" font-weight="900">EVACUACIÓN, EVACUACIÓN"</text>
      <text x="22" y="534" fill="#fecdd3" font-size="9">Apertura inmediata de salidas.</text>
    </g>

  </g>
</svg>
