<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1150" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c16"/>
      <stop offset="50%" stop-color="#0c1626"/>
      <stop offset="100%" stop-color="#050810"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#152238"/>
      <stop offset="100%" stop-color="#0f192b"/>
    </linearGradient>
    <linearGradient id="binterGreenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="binterBlueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="1150" fill="url(#bgGrad)"/>

  <!-- Tech Grid Background -->
  <g stroke="rgba(56, 189, 248, 0.04)" stroke-width="1.5">
    <line x1="0" y1="120" x2="1600" y2="120"/>
    <line x1="0" y1="260" x2="1600" y2="260"/>
    <line x1="0" y1="720" x2="1600" y2="720"/>
    <line x1="530" y1="120" x2="530" y2="1150"/>
    <line x1="1060" y1="120" x2="1060" y2="1150"/>
  </g>

  <!-- Header Banner -->
  <g transform="translate(40, 25)">
    <rect width="1520" height="85" rx="12" fill="#132035" stroke="#253856" stroke-width="2" filter="url(#shadow)"/>
    <rect width="12" height="85" fill="url(#binterBlueGrad)" rx="3"/>
    
    <text x="35" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#f8fafc" letter-spacing="0.5">
      PREPARACIÓN DE VUELO &amp; BRIEFING DE TRIPULACIÓN
    </text>
    <text x="35" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#38bdf8">
      Procedimiento Estándar de Prevuelo • Binter MOA Caps 1.4, 8.1, 8.3 &amp; MOB 2.0.6 • Estructura TELSI
    </text>

    <rect x="1330" y="24" width="160" height="38" rx="8" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="1410" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#38bdf8" text-anchor="middle">
      MOA 8.1 &amp; TELSI
    </text>
  </g>

  <!-- Golden Rules & Aircraft Box -->
  <g transform="translate(40, 130)">
    <!-- Rules Box -->
    <rect width="980" height="110" rx="12" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
    <rect width="980" height="32" rx="12" fill="url(#goldGrad)"/>
    <text x="20" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="900" fill="#ffffff" letter-spacing="0.5">
      ★ REGLAS DE ORO DE PREVUELO Y BRIEFING
    </text>
    
    <g transform="translate(20, 48)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#f1f5f9">
      <text x="0" y="18" font-weight="700" fill="#fbbf24">• Combustible Discrecional:</text>
      <text x="200" y="18" font-weight="500" fill="#cbd5e1">Si se añade combustible discrecional &gt; 500 kg, solicitar nuevo PVO recalculado.</text>
      
      <text x="0" y="44" font-weight="700" fill="#fbbf24">• Despegue LVTO:</text>
      <text x="200" y="44" font-weight="500" fill="#cbd5e1">Verificar alternativo de despegue (1h monomotor) y que ELW &lt; MLM (54.000 kg).</text>
    </g>

    <!-- Aircraft Box -->
    <g transform="translate(1005, 0)">
      <rect width="515" height="110" rx="12" fill="url(#cardGrad)" stroke="#253856" stroke-width="2" filter="url(#shadow)"/>
      <!-- Small Binter E195-E2 Profile -->
      <g transform="translate(30, 60) scale(0.85)">
        <path d="M 0,-5 Q 40,-10 180,-10 L 320,-8 Q 380,-5 420,0 Q 380,5 320,8 L 180,10 Q 40,10 0,5 Z" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
        <path d="M 100,-9 Q 180,0 260,-9 L 300,-8 Q 220,1 140,-8 Z" fill="#059669"/>
        <path d="M 120,-8 Q 200,3 280,-6 L 320,-5 Q 240,4 160,-5 Z" fill="#0284c7"/>
        <path d="M 390,-3 L 410,-1 L 400,1 L 385,-1 Z" fill="#1e293b"/>
        <path d="M 170,0 L 220,48 L 240,48 L 205,0 Z" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5"/>
        <path d="M 240,48 L 250,60 L 236,60 L 228,48 Z" fill="#059669"/>
        <rect x="180" y="15" width="48" height="15" rx="6" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
        <path d="M 20,-6 L -35,-48 L -10,-48 L 45,-6 Z" fill="#059669"/>
        <path d="M 5,-6 L -25,-48 L -10,-48 L 25,-6 Z" fill="#0284c7"/>
      </g>
      <text x="500" y="30" font-family="sans-serif" font-size="13" font-weight="800" fill="#10b981" text-anchor="end">EMBRAER 195-E2</text>
      <text x="500" y="50" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#94a3b8" text-anchor="end">Binter Canarias</text>
    </g>
  </g>

  <!-- 4 Main Workflow Cards -->
  <g transform="translate(40, 260)">
    
    <!-- 1. Sala Delivery -->
    <g transform="translate(0, 0)">
      <rect width="360" height="520" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)"/>
      <rect width="360" height="42" rx="12" fill="url(#binterBlueGrad)"/>
      <text x="180" y="27" font-family="sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">
        1. SALA DELIVERY (iPAD)
      </text>

      <g transform="translate(20, 58)" font-family="sans-serif">
        <rect width="320" height="98" rx="8" fill="#18263e" stroke="#334155" stroke-width="1"/>
        <text x="18" y="24" font-size="14.5" font-weight="800" fill="#38bdf8">App MPO (Manuales)</text>
        <text x="18" y="46" font-size="13" font-weight="500" fill="#e2e8f0">Actualizar vuelos asignados.</text>
        <text x="18" y="68" font-size="13" font-weight="500" fill="#cbd5e1">Verificar revisiones y avisos</text>
        <text x="18" y="88" font-size="13" font-weight="500" fill="#cbd5e1">operacionales de flota (OEB/FOL).</text>

        <g transform="translate(0, 110)">
          <rect width="320" height="98" rx="8" fill="#18263e" stroke="#334155" stroke-width="1"/>
          <text x="18" y="24" font-size="14.5" font-weight="800" fill="#38bdf8">App ePerf E195-E2</text>
          <text x="18" y="46" font-size="13" font-weight="500" fill="#e2e8f0">Actualizar bases de datos de</text>
          <text x="18" y="68" font-size="13" font-weight="500" fill="#cbd5e1">aeródromos, pistas, pesos y</text>
          <text x="18" y="88" font-size="13" font-weight="500" fill="#cbd5e1">limitaciones de despegue/toma.</text>
        </g>

        <g transform="translate(0, 220)">
          <rect width="320" height="98" rx="8" fill="#18263e" stroke="#334155" stroke-width="1"/>
          <text x="18" y="24" font-size="14.5" font-weight="800" fill="#38bdf8">App Lido mPilot</text>
          <text x="18" y="46" font-size="13" font-weight="500" fill="#e2e8f0">Descargar ciclo AIRAC activo,</text>
          <text x="18" y="68" font-size="13" font-weight="500" fill="#cbd5e1">cartas de salida, ruta, llegada</text>
          <text x="18" y="88" font-size="13" font-weight="500" fill="#cbd5e1">y aeródromos alternativos.</text>
        </g>

        <g transform="translate(0, 330)">
          <rect width="320" height="105" rx="8" fill="#18263e" stroke="#334155" stroke-width="1"/>
          <text x="18" y="24" font-size="14.5" font-weight="800" fill="#38bdf8">Taillog &amp; MEL Diferidos</text>
          <text x="18" y="46" font-size="13" font-weight="500" fill="#e2e8f0">Descargar PVOs del día.</text>
          <text x="18" y="68" font-size="13" font-weight="500" fill="#cbd5e1">Comprobar estado técnico del</text>
          <text x="18" y="88" font-size="13" font-weight="700" fill="#fbbf24">avión asignado y registros MEL.</text>
        </g>
      </g>
    </g>

    <!-- 2. Sobre de Vuelo (PVO) -->
    <g transform="translate(385, 0)">
      <rect width="365" height="520" rx="12" fill="url(#cardGrad)" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
      <rect width="365" height="42" rx="12" fill="url(#binterGreenGrad)"/>
      <text x="182" y="27" font-family="sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">
        2. SOBRE DE VUELO (PVO / OFP)
      </text>

      <g transform="translate(20, 58)" font-family="sans-serif">
        <rect width="325" height="98" rx="8" fill="#18263e" stroke="#334155" stroke-width="1"/>
        <text x="18" y="24" font-size="14.5" font-weight="800" fill="#34d399">Manifiesto de Despacho</text>
        <text x="18" y="46" font-size="13" font-weight="500" fill="#e2e8f0">Dejar 1 copia firmada en sala.</text>
        <text x="18" y="68" font-size="13" font-weight="500" fill="#cbd5e1">Verificar matrícula, número de</text>
        <text x="18" y="88" font-size="13" font-weight="500" fill="#cbd5e1">pasajeros y tiempos de vuelo.</text>

        <g transform="translate(0, 110)">
          <rect width="325" height="110" rx="8" fill="#18263e" stroke="#334155" stroke-width="1"/>
          <text x="18" y="24" font-size="14.5" font-weight="800" fill="#34d399">Análisis de Combustible</text>
          <text x="18" y="46" font-size="13" font-weight="500" fill="#e2e8f0">Trip + Contingency + Alternate</text>
          <text x="18" y="68" font-size="13" font-weight="500" fill="#e2e8f0">+ Final Reserve (30 min).</text>
          <text x="18" y="90" font-size="13" font-weight="700" fill="#fbbf24">Evaluar Tankering vs Refuel local.</text>
        </g>

        <g transform="translate(0, 232)">
          <rect width="325" height="100" rx="8" fill="#18263e" stroke="#334155" stroke-width="1"/>
          <text x="18" y="24" font-size="14.5" font-weight="800" fill="#34d399">Información de Ruta &amp; NOTAMs</text>
          <text x="18" y="46" font-size="13" font-weight="500" fill="#cbd5e1">Pistas activas (AeroWeather),</text>
          <text x="18" y="68" font-size="13" font-weight="500" fill="#cbd5e1">SID/STAR, nivel de crucero y</text>
          <text x="18" y="88" font-size="13" font-weight="500" fill="#cbd5e1">mercancías peligrosas (NOTOC).</text>
        </g>

        <g transform="translate(0, 344)">
          <rect width="325" height="95" rx="8" fill="rgba(239, 68, 68, 0.15)" stroke="#ef4444" stroke-width="1.5"/>
          <text x="18" y="24" font-size="14" font-weight="800" fill="#f87171">ALERTA EN SALIDA LVTO:</text>
          <text x="18" y="46" font-size="12.5" font-weight="600" fill="#fecaca">• Alternativo despegue requerido</text>
          <text x="18" y="66" font-size="12.5" font-weight="600" fill="#fecaca">• Distancia máx: 1 hora monomotor</text>
          <text x="18" y="86" font-size="12.5" font-weight="600" fill="#fecaca">• ELW &lt; MLM (54.000 kg)</text>
        </g>
      </g>
    </g>

    <!-- 3. Briefing Tripulación TELSI -->
    <g transform="translate(770, 0)">
      <rect width="370" height="520" rx="12" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="2" filter="url(#shadow)"/>
      <rect width="370" height="42" rx="12" fill="url(#purpleGrad)"/>
      <text x="185" y="27" font-family="sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">
        3. ESTRUCTURA TELSI (¡NO NITS!)
      </text>

      <g transform="translate(20, 58)" font-family="sans-serif">
        <rect width="330" height="85" rx="8" fill="#18263e" stroke="#334155" stroke-width="1"/>
        <text x="18" y="24" font-size="14.5" font-weight="800" fill="#c084fc">T • Tipo de Emergencia</text>
        <text x="18" y="46" font-size="13" font-weight="500" fill="#cbd5e1">Naturaleza de la anomalía o</text>
        <text x="18" y="68" font-size="13" font-weight="500" fill="#cbd5e1">situación técnica a bordo.</text>

        <g transform="translate(0, 95)">
          <rect width="330" height="85" rx="8" fill="#18263e" stroke="#334155" stroke-width="1"/>
          <text x="18" y="24" font-size="14.5" font-weight="800" fill="#c084fc">E • Evacuación Prevista</text>
          <text x="18" y="46" font-size="13" font-weight="500" fill="#cbd5e1">¿Probable o improbable? Pre-aviso</text>
          <text x="18" y="68" font-size="13" font-weight="500" fill="#cbd5e1">de preparación de cabina y salidas.</text>
        </g>

        <g transform="translate(0, 190)">
          <rect width="330" height="85" rx="8" fill="#18263e" stroke="#334155" stroke-width="1"/>
          <text x="18" y="24" font-size="14.5" font-weight="800" fill="#c084fc">L • Lado / Salidas Seguras</text>
          <text x="18" y="46" font-size="13" font-weight="500" fill="#cbd5e1">Puertas operativas (lado izq / dcho),</text>
          <text x="18" y="68" font-size="13" font-weight="500" fill="#cbd5e1">aislando zonas con fuego o daño.</text>
        </g>

        <g transform="translate(0, 285)">
          <rect width="330" height="75" rx="8" fill="#18263e" stroke="#334155" stroke-width="1"/>
          <text x="18" y="24" font-size="14.5" font-weight="800" fill="#c084fc">S • Señal de Impacto / Prep.</text>
          <text x="18" y="46" font-size="13" font-weight="500" fill="#cbd5e1">Cantadas estándar por megafonía.</text>
          <text x="18" y="66" font-size="13" font-weight="700" fill="#facc15">"PROTECCIÓN, PROTECCIÓN, PROTECCIÓN"</text>
        </g>

        <g transform="translate(0, 370)">
          <rect width="330" height="70" rx="8" fill="#18263e" stroke="#334155" stroke-width="1"/>
          <text x="18" y="24" font-size="14.5" font-weight="800" fill="#c084fc">I • Información Adicional</text>
          <text x="18" y="46" font-size="13" font-weight="500" fill="#cbd5e1">Tiempos disponibles y coordinación.</text>
        </g>
      </g>
    </g>

    <!-- 4. Llamadas Megafonía PA -->
    <g transform="translate(1160, 0)">
      <rect width="360" height="520" rx="12" fill="url(#cardGrad)" stroke="#ef4444" stroke-width="2" filter="url(#shadow)"/>
      <rect width="360" height="42" rx="12" fill="url(#redGrad)"/>
      <text x="180" y="27" font-family="sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">
        4. LLAMADAS PA DE CABINA
      </text>

      <g transform="translate(20, 58)" font-family="sans-serif">
        <rect width="320" height="70" rx="8" fill="#18263e" stroke="#334155" stroke-width="1"/>
        <text x="16" y="22" font-size="13" font-weight="800" fill="#38bdf8">"SOBRECARGO A CABINA"</text>
        <text x="16" y="42" font-size="12" font-weight="500" fill="#cbd5e1">Briefing cara a cara en cockpit.</text>
        <text x="16" y="60" font-size="11.5" font-weight="700" fill="#94a3b8">Llamada inicial de coordinación.</text>

        <g transform="translate(0, 78)">
          <rect width="320" height="70" rx="8" fill="#18263e" stroke="#334155" stroke-width="1"/>
          <text x="16" y="22" font-size="12" font-weight="800" fill="#38bdf8">"TRIPULACIÓN CABINA, FINALIZAR PREP."</text>
          <text x="16" y="42" font-size="12" font-weight="500" fill="#cbd5e1">Aviso a 5 minutos del aterrizaje.</text>
          <text x="16" y="60" font-size="11.5" font-weight="700" fill="#94a3b8">Cabina asegurada en emergencia.</text>
        </g>

        <g transform="translate(0, 156)">
          <rect width="320" height="70" rx="8" fill="#18263e" stroke="#334155" stroke-width="1"/>
          <text x="16" y="22" font-size="12" font-weight="800" fill="#fbbf24">"PROTECCIÓN, PROTECCIÓN, PROTECCIÓN"</text>
          <text x="16" y="42" font-size="12" font-weight="500" fill="#cbd5e1">Aviso a 30 segundos del impacto.</text>
          <text x="16" y="60" font-size="11.5" font-weight="700" fill="#facc15">Posición de impacto (Brace).</text>
        </g>

        <g transform="translate(0, 234)">
          <rect width="320" height="70" rx="8" fill="#18263e" stroke="#334155" stroke-width="1"/>
          <text x="16" y="22" font-size="12" font-weight="800" fill="#34d399">"TRIP. CABINA, ESPEREN INSTRUCCIONES"</text>
          <text x="16" y="42" font-size="12" font-weight="500" fill="#cbd5e1">Tras parar: Evaluación en cabina.</text>
          <text x="16" y="60" font-size="11.5" font-weight="700" fill="#94a3b8">Evitar evacuación descontrolada.</text>
        </g>

        <g transform="translate(0, 312)">
          <rect width="320" height="70" rx="8" fill="#18263e" stroke="#334155" stroke-width="1"/>
          <text x="16" y="22" font-size="12" font-weight="800" fill="#34d399">"TRIP. CABINA, PERMANEZCAN SENTADAS"</text>
          <text x="16" y="42" font-size="12" font-weight="500" fill="#cbd5e1">Situación controlada: No evacuación.</text>
          <text x="16" y="60" font-size="11.5" font-weight="700" fill="#94a3b8">Desalojo normal o con escaleras.</text>
        </g>

        <g transform="translate(0, 390)">
          <rect width="320" height="70" rx="8" fill="rgba(220, 38, 38, 0.2)" stroke="#ef4444" stroke-width="1.5"/>
          <text x="16" y="22" font-size="12" font-weight="800" fill="#f87171">"EVACUACIÓN, EVACUACIÓN, EVACUACIÓN"</text>
          <text x="16" y="42" font-size="12" font-weight="600" fill="#fecaca">Orden verbal de evacuación inmediata.</text>
          <text x="16" y="60" font-size="11.5" font-weight="700" fill="#ffffff">Apertura de rampas y salidas.</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Bottom Bar -->
  <g transform="translate(40, 1010)">
    <rect width="1520" height="110" rx="12" fill="#132035" stroke="#253856" stroke-width="2" filter="url(#shadow)"/>
    <text x="30" y="36" font-family="sans-serif" font-size="16" font-weight="800" fill="#38bdf8">
      REQUISITOS OPERACIONALES BINTER CANARIAS (MOA CAP. 8):
    </text>
    <text x="30" y="65" font-family="sans-serif" font-size="14" font-weight="500" fill="#cbd5e1">
      • Cross-check de armado de rampas obligatorio antes del rodaje. Repostaje con pasajeros: 2 salidas libres y señalizadas.
    </text>
    <text x="30" y="90" font-family="sans-serif" font-size="14" font-weight="500" fill="#cbd5e1">
      • TEM (Gestión de Amenazas): Briefing específico para vuelos de instrucción, rodajes complejos LVO o pistas cortas.
    </text>
  </g>
</svg>
