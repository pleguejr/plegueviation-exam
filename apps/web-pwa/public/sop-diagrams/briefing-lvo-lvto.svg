<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1150" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c16"/>
      <stop offset="50%" stop-color="#0c1626"/>
      <stop offset="100%" stop-color="#050810"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#152238"/>
      <stop offset="100%" stop-color="#0f192b"/>
    </linearGradient>
    <linearGradient id="binterGreenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="binterBlueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1600" height="1150" fill="url(#bgGrad)"/>

  <!-- Header Banner -->
  <g transform="translate(40, 25)">
    <rect width="1520" height="85" rx="12" fill="#132035" stroke="#253856" stroke-width="2" filter="url(#shadow)"/>
    <rect width="12" height="85" fill="url(#goldGrad)" rx="3"/>
    
    <text x="35" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#f8fafc" letter-spacing="0.5">
      BRIEFING LVO / LVTO &amp; CONDICIONES ENGELANTES
    </text>
    <text x="35" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#38bdf8">
      Despegues con Visibilidad Reducida (RVR 125m) • Binter MOA 8.4 &amp; MOB 2.0.6.1 • Embraer 195-E2
    </text>

    <rect x="1330" y="24" width="160" height="38" rx="8" fill="rgba(245, 158, 11, 0.15)" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="1410" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#fbbf24" text-anchor="middle">
      RVR 125 MÍNIMO
    </text>
  </g>

  <!-- Top Visual: E195-E2 on Foggy Runway with Lights -->
  <g transform="translate(40, 130)">
    <rect width="1520" height="135" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)"/>
    
    <!-- Runway Perspective & Fog -->
    <path d="M 40,110 L 760,20 L 760,20 L 1480,110 Z" fill="#111a2e" stroke="#334155" stroke-width="1"/>
    <!-- Centerline Lights (spaced 15m) -->
    <g fill="#fef08a">
      <circle cx="760" cy="30" r="2.5"/><circle cx="760" cy="45" r="3"/><circle cx="760" cy="62" r="3.5"/>
      <circle cx="760" cy="80" r="4"/><circle cx="760" cy="100" r="4.5"/>
    </g>
    <!-- Runway Edge Lights (spaced 60m) -->
    <g fill="#f8fafc">
      <circle cx="680" cy="40" r="2"/><circle cx="840" cy="40" r="2"/>
      <circle cx="580" cy="65" r="2.5"/><circle cx="940" cy="65" r="2.5"/>
      <circle cx="460" cy="95" r="3"/><circle cx="1060" cy="95" r="3"/>
    </g>

    <!-- Aircraft Silhouette Landing Gear Down Ready for LVTO -->
    <g transform="translate(760, 50) scale(0.65)">
      <!-- Fuselage -->
      <path d="M -160,0 L 160,0 Q 200,0 180,5 L -140,5 Z" fill="#f8fafc" stroke="#94a3b8"/>
      <path d="M 0,0 L -50,-45 L -25,-45 L 30,0 Z" fill="#059669"/>
      <path d="M 0,0 L -50,45 L -25,45 L 30,0 Z" fill="#059669"/>
      <!-- Binter Tail -->
      <path d="M -120,0 L -160,-35 L -140,-35 L -100,0 Z" fill="#0284c7"/>
    </g>

    <!-- Overlay Info Badges -->
    <rect x="60" y="20" width="340" height="95" rx="8" fill="#132035" stroke="#253856" stroke-width="1"/>
    <text x="80" y="45" font-family="sans-serif" font-size="14.5" font-weight="800" fill="#38bdf8">REQUISITOS DE PISTA LVTO:</text>
    <text x="80" y="68" font-family="sans-serif" font-size="13" font-weight="500" fill="#cbd5e1">• Luces eje pista (HIL) ≤ 15 m</text>
    <text x="80" y="90" font-family="sans-serif" font-size="13" font-weight="500" fill="#cbd5e1">• Luces de borde pista ≤ 60 m</text>

    <rect x="1120" y="20" width="340" height="95" rx="8" fill="#132035" stroke="#253856" stroke-width="1"/>
    <text x="1140" y="45" font-family="sans-serif" font-size="14.5" font-weight="800" fill="#f59e0b">COMANDANTE SIEMPRE PF:</text>
    <text x="1140" y="68" font-family="sans-serif" font-size="13" font-weight="500" fill="#cbd5e1">• Ambos pilotos cualificados LVO</text>
    <text x="1140" y="90" font-family="sans-serif" font-size="13" font-weight="700" fill="#10b981">• NO FLEX TAKEOFF (Nominal o Derated)</text>
  </g>

  <!-- 3 Main Columns: Technical Procedures -->
  <g transform="translate(40, 285)">
    
    <!-- Col 1: Limitaciones & Engine Run-Up -->
    <g transform="translate(0, 0)">
      <rect width="485" height="540" rx="12" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
      <rect width="485" height="42" rx="12" fill="url(#goldGrad)"/>
      <text x="242" y="27" font-family="sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">
        1. LIMITACIONES &amp; ENGINE RUN-UP
      </text>

      <g transform="translate(20, 60)" font-family="sans-serif">
        <rect width="445" height="110" rx="8" fill="#18263e" stroke="#334155" stroke-width="1"/>
        <text x="20" y="28" font-size="15" font-weight="800" fill="#fbbf24">Mínimos Absolutos de Despegue</text>
        <text x="20" y="52" font-size="13.5" font-weight="500" fill="#e2e8f0">• RVR Mínimo Binter: <tspan font-weight="800" fill="#38bdf8">125 metros</tspan>.</text>
        <text x="20" y="74" font-size="13.5" font-weight="500" fill="#cbd5e1">• Visibles al menos 6 intervalos o 7 luces de eje.</text>
        <text x="20" y="96" font-size="13.5" font-weight="500" fill="#cbd5e1">• SVS en ON (si INOP: PM sintoniza ILS en curso TO).</text>

        <g transform="translate(0, 125)">
          <rect width="445" height="150" rx="8" fill="#18263e" stroke="#eab308" stroke-width="1.5"/>
          <text x="20" y="28" font-size="15" font-weight="800" fill="#fbbf24">Engine Run-Up (OAT ≤ 3°C Engelamiento)</text>
          <text x="20" y="54" font-size="13.5" font-weight="500" fill="#e2e8f0">• Frecuencia: Cada <tspan font-weight="800" fill="#f59e0b">30 minutos</tspan> de rodaje.</text>
          <text x="20" y="78" font-size="13.5" font-weight="500" fill="#e2e8f0">• Maniobra: Acelerar a <tspan font-weight="800" fill="#38bdf8">60% N1 durante 10 segundos</tspan>.</text>
          <text x="20" y="100" font-size="13.5" font-weight="500" fill="#cbd5e1">• Retorno a ralentí (IDLE) y comprobar parámetros.</text>
          <text x="20" y="124" font-size="13.5" font-weight="700" fill="#34d399">Objetivo: Desprender hielo en álabes de turbofán.</text>
        </g>

        <g transform="translate(0, 290)">
          <rect width="445" height="135" rx="8" fill="#18263e" stroke="#334155" stroke-width="1"/>
          <text x="20" y="28" font-size="15" font-weight="800" fill="#fbbf24">Ajuste Anti-Ice en MCDU (TAKEOFF)</text>
          <text x="20" y="54" font-size="13.5" font-weight="500" fill="#e2e8f0">• <tspan font-weight="700" fill="#38bdf8">OAT &lt; 5°C con humedad visible:</tspan> Seleccionar <tspan font-weight="800" fill="#38bdf8">ALL</tspan>.</text>
          <text x="20" y="78" font-size="13.5" font-weight="500" fill="#e2e8f0">• <tspan font-weight="700" fill="#38bdf8">OAT entre 5°C y 10°C:</tspan> Seleccionar <tspan font-weight="800" fill="#38bdf8">ENG</tspan>.</text>
          <text x="20" y="102" font-size="13.5" font-weight="500" fill="#cbd5e1">• En vuelo: Modo en <tspan font-weight="700" fill="#34d399">AUTO</tspan> gestionado por sensores.</text>
        </g>
      </g>
    </g>

    <!-- Col 2: Estructura TWIN -->
    <g transform="translate(515, 0)">
      <rect width="485" height="540" rx="12" fill="url(#cardGrad)" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
      <rect width="485" height="42" rx="12" fill="url(#binterGreenGrad)"/>
      <text x="242" y="27" font-family="sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">
        2. ESTRUCTURA TWIN APLICADA A LVO
      </text>

      <g transform="translate(20, 60)" font-family="sans-serif">
        <!-- T -->
        <rect width="445" height="95" rx="8" fill="#18263e" stroke="#334155" stroke-width="1"/>
        <text x="20" y="26" font-size="15" font-weight="800" fill="#34d399">T • Threats (Amenazas LVP)</text>
        <text x="20" y="50" font-size="13.5" font-weight="500" fill="#cbd5e1">Procedimientos LVP activos en aeródromo.</text>
        <text x="20" y="72" font-size="13.5" font-weight="500" fill="#cbd5e1">Hot Spots de rodaje y orografía circundante.</text>

        <!-- W -->
        <g transform="translate(0, 108)">
          <rect width="445" height="105" rx="8" fill="#18263e" stroke="#334155" stroke-width="1"/>
          <text x="20" y="26" font-size="15" font-weight="800" fill="#34d399">W • Weather &amp; Pista</text>
          <text x="20" y="50" font-size="13.5" font-weight="500" fill="#cbd5e1">Pista WET / Contaminada, RVR 3 transmisores</text>
          <text x="20" y="72" font-size="13.5" font-weight="500" fill="#cbd5e1">&gt; mínimos (1er segmento evaluable por piloto).</text>
          <text x="20" y="92" font-size="13.5" font-weight="700" fill="#38bdf8">Ajuste riguroso de MCDU Anti-Ice.</text>
        </g>

        <!-- I -->
        <g transform="translate(0, 226)">
          <rect width="445" height="95" rx="8" fill="#18263e" stroke="#334155" stroke-width="1"/>
          <text x="20" y="26" font-size="15" font-weight="800" fill="#34d399">I • Inop Items (MEL)</text>
          <text x="20" y="50" font-size="13.5" font-weight="500" fill="#cbd5e1">Diferidos MEL comprobados que no degraden</text>
          <text x="20" y="72" font-size="13.5" font-weight="500" fill="#cbd5e1">la capacidad LVO / LVTO del avión.</text>
        </g>

        <!-- N -->
        <g transform="translate(0, 334)">
          <rect width="445" height="95" rx="8" fill="#18263e" stroke="#334155" stroke-width="1"/>
          <text x="20" y="26" font-size="15" font-weight="800" fill="#34d399">N • NOTAMs &amp; Balizamiento</text>
          <text x="20" y="50" font-size="13.5" font-weight="500" fill="#cbd5e1">NOTAMs revisados sin fallos de luces de eje,</text>
          <text x="20" y="72" font-size="13.5" font-weight="500" fill="#cbd5e1">barras de parada (Stop Bars) o RVR.</text>
        </g>
      </g>
    </g>

    <!-- Col 3: Rodaje & Briefing de Cabina -->
    <g transform="translate(1030, 0)">
      <rect width="490" height="540" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)"/>
      <rect width="490" height="42" rx="12" fill="url(#binterBlueGrad)"/>
      <text x="245" y="27" font-family="sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">
        3. RODAJE LVP &amp; OPERACIÓN
      </text>

      <g transform="translate(20, 60)" font-family="sans-serif">
        <rect width="450" height="110" rx="8" fill="#18263e" stroke="#334155" stroke-width="1"/>
        <text x="20" y="28" font-size="15" font-weight="800" fill="#38bdf8">Velocidades Máximas de Rodaje LVP</text>
        <text x="20" y="52" font-size="13.5" font-weight="500" fill="#e2e8f0">• <tspan font-weight="800" fill="#34d399">10 kt</tspan> en tramos rectos de calle de rodaje.</text>
        <text x="20" y="76" font-size="13.5" font-weight="500" fill="#e2e8f0">• <tspan font-weight="800" fill="#fbbf24">5 kt</tspan> en curvas e intersecciones.</text>
        <text x="20" y="98" font-size="13.5" font-weight="500" fill="#cbd5e1">• Ambos pilotos mirando fuera activamente.</text>

        <g transform="translate(0, 125)">
          <rect width="450" height="120" rx="8" fill="rgba(220, 38, 38, 0.2)" stroke="#ef4444" stroke-width="1.5"/>
          <text x="20" y="28" font-size="15" font-weight="800" fill="#f87171">REGLA ANTE DUDA DE POSICIÓN:</text>
          <text x="20" y="54" font-size="13.5" font-weight="700" fill="#ffffff">¡DETENER EL AVIÓN INMEDIATAMENTE!</text>
          <text x="20" y="78" font-size="13" font-weight="500" fill="#fecaca">Poner freno de estacionamiento (Park Brake)</text>
          <text x="20" y="98" font-size="13" font-weight="500" fill="#fecaca">y notificar a ATC: "Position uncertain".</text>
        </g>

        <g transform="translate(0, 260)">
          <rect width="450" height="165" rx="8" fill="#18263e" stroke="#334155" stroke-width="1"/>
          <text x="20" y="28" font-size="15" font-weight="800" fill="#38bdf8">Antes de Entrar en Pista</text>
          <text x="20" y="54" font-size="13.5" font-weight="500" fill="#cbd5e1">• Solicitar último RVR de los 3 sectores a Torre.</text>
          <text x="20" y="78" font-size="13.5" font-weight="500" fill="#cbd5e1">• Cruzar Stop Bar solo si está apagada y con</text>
          <text x="20" y="98" font-size="13.5" font-weight="500" fill="#cbd5e1">autorización expresa de control.</text>
          <text x="20" y="122" font-size="13.5" font-weight="700" fill="#34d399">• Comprobar brújula y curso de pista en PFD.</text>
          <text x="20" y="144" font-size="13" font-weight="500" fill="#94a3b8">• Luces estroboscópicas (Strobe) en ON.</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Bottom Bar -->
  <g transform="translate(40, 1010)">
    <rect width="1520" height="110" rx="12" fill="#132035" stroke="#253856" stroke-width="2" filter="url(#shadow)"/>
    <text x="30" y="36" font-family="sans-serif" font-size="16" font-weight="800" fill="#38bdf8">
      OPERACIÓN BINTER CANARIAS EN CONDICIONES LVO:
    </text>
    <text x="30" y="65" font-family="sans-serif" font-size="14" font-weight="500" fill="#cbd5e1">
      • En caso de fallo de motor por debajo de V1 en LVTO, parada inmediata con máxima frenada manual y reversas completas.
    </text>
    <text x="30" y="90" font-family="sans-serif" font-size="14" font-weight="500" fill="#cbd5e1">
      • Alternativo de despegue con RVR y techos comprobados por encima de mínimos de aterrizaje CAT I o CAT II/III.
    </text>
  </g>
</svg>
