<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradLvo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1a" />
      <stop offset="100%" stop-color="#121b2d" />
    </linearGradient>
    <linearGradient id="cardGradL" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#182338" />
      <stop offset="100%" stop-color="#0e1726" />
    </linearGradient>
    <linearGradient id="amberGradL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="iceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGradLvo)" />

  <!-- Grid -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="370" x2="1200" y2="370" />
    <line x1="300" y1="0" x2="300" y2="675" />
    <line x1="600" y1="0" x2="600" y2="675" />
    <line x1="900" y1="0" x2="900" y2="675" />
  </g>

  <!-- Header Banner -->
  <rect x="30" y="16" width="1140" height="64" rx="10" fill="#111c2e" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5" />
  
  <!-- Embraer 195-E2 Silhouette -->
  <g transform="translate(48, 26) scale(0.6)">
    <path d="M 0 25 Q 35 15 70 18 L 85 5 L 92 6 L 82 19 L 140 22 L 185 0 L 195 2 L 165 24 L 205 25 Q 215 25 220 28 L 200 31 L 165 31 L 145 42 L 138 41 L 148 31 L 80 30 L 70 42 L 62 41 L 68 29 Q 30 30 0 25 Z" fill="#38bdf8" fill-opacity="0.8" />
    <rect x="90" y="27" width="28" height="10" rx="4" fill="#0284c7" />
    <polygon points="185,2 193,3 175,20 168,20" fill="#10b981" />
  </g>

  <text x="185" y="44" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" letter-spacing="1">BRIEFING LVO / LVTO &amp; CONDICIONES ENGELANTES</text>
  <text x="185" y="66" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Manuales Binter MOA 8.4, MOB 2.0.6.1 &amp; SOPM Sec 2 · Flota Embraer 195-E2</text>
  
  <rect x="980" y="26" width="175" height="42" rx="6" fill="#0369a1" fill-opacity="0.4" stroke="#38bdf8" stroke-width="1" />
  <text x="1067" y="52" fill="#e0f2fe" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">RVR MÍNIMO 125 M</text>

  <!-- 4 COLUMNS -->
  <g transform="translate(30, 95)">
    
    <!-- CARD 1: LIMITACIONES LVTO -->
    <g transform="translate(0, 0)">
      <rect width="270" height="555" rx="12" fill="url(#cardGradL)" stroke="#38bdf8" stroke-width="1.5" />
      <rect x="14" y="14" width="28" height="28" rx="6" fill="url(#iceGrad)" />
      <text x="28" y="33" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="800" text-anchor="middle">1</text>
      
      <text x="50" y="28" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="14" font-weight="800">PARÁMETROS LVTO</text>
      <text x="50" y="42" fill="#94a3b8" font-size="10">Limitaciones Operacionales</text>

      <rect x="14" y="56" width="242" height="95" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="24" y="76" fill="#38bdf8" font-size="11" font-weight="800">Tripulación y Mando</text>
      <text x="24" y="92" fill="#cbd5e1" font-size="10">• Comandante SIEMPRE PF.</text>
      <text x="24" y="106" fill="#cbd5e1" font-size="10">• Ambos pilotos cualificados LVO.</text>
      <text x="24" y="120" fill="#cbd5e1" font-size="10">• Calificación y verificación en vigor.</text>
      <text x="24" y="134" fill="#94a3b8" font-size="9.5">• Briefing TWIN detallado previo.</text>

      <rect x="14" y="161" width="242" height="100" rx="6" fill="#450a0a" fill-opacity="0.3" stroke="#ef4444" stroke-width="1.2" />
      <text x="24" y="181" fill="#f87171" font-size="11" font-weight="800">Selección de Empuje</text>
      <text x="24" y="198" fill="#fca5a5" font-size="12" font-weight="900">¡NO FLEX TAKEOFF!</text>
      <text x="24" y="214" fill="#cbd5e1" font-size="10">• Prohibida la potencia flexible.</text>
      <text x="24" y="228" fill="#cbd5e1" font-size="10">• Usar empuje NOMINAL (TO-1/TO-2)</text>
      <text x="24" y="242" fill="#cbd5e1" font-size="10">  o DERATED fijo según ePerf.</text>

      <rect x="14" y="271" width="242" height="145" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1" />
      <text x="24" y="291" fill="#34d399" font-size="11" font-weight="800">Requisitos de Pista (125m)</text>
      <text x="24" y="307" fill="#cbd5e1" font-size="10">• Luces eje de alta intensidad (HIL)</text>
      <text x="24" y="321" fill="#a7f3d0" font-size="10" font-weight="700">  espaciadas ≤ 15 m.</text>
      <text x="24" y="335" fill="#cbd5e1" font-size="10">• Luces de borde ≤ 60 m.</text>
      <text x="24" y="349" fill="#cbd5e1" font-size="10">• Visibles al menos:</text>
      <text x="34" y="365" fill="#34d399" font-size="11" font-weight="800">6 intervalos (o 7 luces eje)</text>
      <text x="24" y="381" fill="#94a3b8" font-size="9.5">• 3 transmisómetros RVR requeridos.</text>
      <text x="24" y="395" fill="#94a3b8" font-size="9.5">• 1er segmento evaluable por piloto.</text>

      <rect x="14" y="426" width="242" height="115" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="24" y="446" fill="#38bdf8" font-size="11" font-weight="800">Aviónica y SVS</text>
      <text x="24" y="462" fill="#cbd5e1" font-size="10">• SVS (Synthetic Vision) en ON.</text>
      <text x="24" y="476" fill="#cbd5e1" font-size="10">• Si SVS está INOP:</text>
      <text x="34" y="492" fill="#fbbf24" font-size="9.5" font-weight="700">PM sintoniza ILS de pista</text>
      <text x="34" y="506" fill="#fbbf24" font-size="9.5" font-weight="700">en curso de despegue.</text>
    </g>

    <!-- CARD 2: ENGINE RUN-UP & ANTI-ICE -->
    <g transform="translate(285, 0)">
      <rect width="280" height="555" rx="12" fill="url(#cardGradL)" stroke="#f59e0b" stroke-width="1.5" />
      <rect x="14" y="14" width="28" height="28" rx="6" fill="url(#amberGradL)" />
      <text x="28" y="33" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="800" text-anchor="middle">2</text>
      
      <text x="50" y="28" fill="#fde68a" font-family="system-ui, sans-serif" font-size="14" font-weight="800">ENGINE RUN-UP &amp; ANTI-ICE</text>
      <text x="50" y="42" fill="#94a3b8" font-size="10">Condiciones Engelantes (OAT ≤ 3°C)</text>

      <rect x="14" y="56" width="252" height="175" rx="6" fill="#78350f" fill-opacity="0.3" stroke="#f59e0b" stroke-width="1.2" />
      <text x="24" y="76" fill="#fbbf24" font-size="11.5" font-weight="800">PROTOCOLO ENGINE RUN-UP:</text>
      <text x="24" y="92" fill="#fef3c7" font-size="10" font-weight="700">Si OAT ≤ 3°C con engelamiento:</text>
      
      <rect x="22" y="100" width="236" height="56" rx="4" fill="#0f172a" stroke="#f59e0b" stroke-width="1" />
      <text x="30" y="118" fill="#fbbf24" font-size="10" font-weight="800">CADA 30 MINUTOS EN TIERRA:</text>
      <text x="30" y="134" fill="#ffffff" font-size="12" font-weight="900">Acelerar a 60% N1 durante 10 s</text>
      <text x="30" y="148" fill="#cbd5e1" font-size="9.5">y retornar suavemente a IDLE.</text>

      <text x="24" y="174" fill="#cbd5e1" font-size="10">• Desprende hielo acumulado en álabes.</text>
      <text x="24" y="188" fill="#cbd5e1" font-size="10">• Comprobar área detrás libre de blast.</text>
      <text x="24" y="202" fill="#cbd5e1" font-size="10">• Freno de parking fijado firmemente.</text>
      <text x="24" y="216" fill="#94a3b8" font-size="9.5">• Registrar hora del último Run-Up.</text>

      <rect x="14" y="241" width="252" height="175" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
      <text x="24" y="261" fill="#38bdf8" font-size="11.5" font-weight="800">AJUSTE ANTI-ICE EN MCDU (TO):</text>
      
      <rect x="22" y="271" width="236" height="58" rx="4" fill="#0c4a6e" fill-opacity="0.4" stroke="#0284c7" stroke-width="1" />
      <text x="30" y="289" fill="#7dd3fc" font-size="10.5" font-weight="800">OAT &lt; 5°C (con humedad/niebla):</text>
      <text x="30" y="307" fill="#ffffff" font-size="12" font-weight="900">MCDU: SELECT "ALL"</text>
      <text x="30" y="321" fill="#bae6fd" font-size="9">(Engines &amp; Wings Anti-Ice activos)</text>

      <rect x="22" y="337" width="236" height="58" rx="4" fill="#0c4a6e" fill-opacity="0.4" stroke="#0284c7" stroke-width="1" />
      <text x="30" y="355" fill="#7dd3fc" font-size="10.5" font-weight="800">Entre 5°C y 10°C (con humedad):</text>
      <text x="30" y="373" fill="#ffffff" font-size="12" font-weight="900">MCDU: SELECT "ENG"</text>
      <text x="30" y="387" fill="#bae6fd" font-size="9">(Solo calentamiento de tomas de motor)</text>

      <rect x="14" y="426" width="252" height="115" rx="6" fill="#064e3b" fill-opacity="0.4" stroke="#10b981" stroke-width="1" />
      <text x="24" y="446" fill="#34d399" font-size="11" font-weight="800">FLAPS DE DESPEGUE:</text>
      <text x="24" y="464" fill="#cbd5e1" font-size="10">• Seleccionar según ePerf y ASD.</text>
      <text x="24" y="478" fill="#cbd5e1" font-size="10">• En pista mojada/contaminada valorar</text>
      <text x="24" y="492" fill="#cbd5e1" font-size="10">  mayor deflexión para menor ASD</text>
      <text x="24" y="506" fill="#a7f3d0" font-size="9.5">  y ampliar margen de parada.</text>
    </g>

    <!-- CARD 3: ESTRUCTURA TWIN EN LVO -->
    <g transform="translate(580, 0)">
      <rect width="280" height="555" rx="12" fill="url(#cardGradL)" stroke="#8b5cf6" stroke-width="1.5" />
      <rect x="14" y="14" width="28" height="28" rx="6" fill="#7c3aed" />
      <text x="28" y="33" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="800" text-anchor="middle">3</text>
      
      <text x="50" y="28" fill="#c4b5fd" font-family="system-ui, sans-serif" font-size="14" font-weight="800">ESTRUCTURA TWIN</text>
      <text x="50" y="42" fill="#94a3b8" font-size="10">Briefing Específico para LVO</text>

      <rect x="14" y="56" width="252" height="485" rx="6" fill="#0f172a" stroke="#8b5cf6" stroke-width="1" />
      
      <text x="24" y="80" fill="#a78bfa" font-size="12" font-weight="800">T - THREATS (LVP EN VIGOR)</text>
      <text x="24" y="98" fill="#cbd5e1" font-size="10">• Procedimientos LVP activos en campo.</text>
      <text x="24" y="112" fill="#cbd5e1" font-size="10">• Hot Spots de rodaje y cruce de pistas.</text>
      <text x="24" y="126" fill="#cbd5e1" font-size="10">• Orografía circundante y MSA elevada.</text>
      <text x="24" y="140" fill="#cbd5e1" font-size="10">• Riesgo de desorientación espacial.</text>

      <text x="24" y="174" fill="#a78bfa" font-size="12" font-weight="800">W - WEATHER &amp; PISTA</text>
      <text x="24" y="192" fill="#cbd5e1" font-size="10">• 3 Transmisómetros RVR &gt; 125m.</text>
      <text x="24" y="206" fill="#cbd5e1" font-size="10">• Pista mojada/contaminada (RWYCC).</text>
      <text x="24" y="220" fill="#cbd5e1" font-size="10">• Viento cruzado y ráfagas.</text>
      <text x="24" y="234" fill="#cbd5e1" font-size="10">• Niebla engelante (Freezing Fog).</text>

      <text x="24" y="268" fill="#a78bfa" font-size="12" font-weight="800">I - INOP ITEMS (MEL)</text>
      <text x="24" y="286" fill="#cbd5e1" font-size="10">• Diferidos MEL revisados.</text>
      <text x="24" y="300" fill="#cbd5e1" font-size="10">• Confirmar que no degraden</text>
      <text x="24" y="314" fill="#cbd5e1" font-size="10">  la capacidad LVTO del avión.</text>
      <text x="24" y="328" fill="#cbd5e1" font-size="10">• Luces de rodaje, limpiaparabrisas,</text>
      <text x="24" y="342" fill="#cbd5e1" font-size="10">  calentamiento de sondas / pitots.</text>

      <text x="24" y="376" fill="#a78bfa" font-size="12" font-weight="800">N - NOTAMS</text>
      <text x="24" y="394" fill="#cbd5e1" font-size="10">• Balizamiento de calles y pista.</text>
      <text x="24" y="408" fill="#cbd5e1" font-size="10">• Luces de eje fuera de servicio.</text>
      <text x="24" y="422" fill="#cbd5e1" font-size="10">• Calles de rodaje cerradas por LVP.</text>
      <text x="24" y="436" fill="#cbd5e1" font-size="10">• Barreras de parada (Stop Bars).</text>

      <rect x="20" y="460" width="240" height="68" rx="4" fill="#2e1065" stroke="#8b5cf6" stroke-width="1" />
      <text x="28" y="478" fill="#ddd6fe" font-size="10" font-weight="800">ANTES DE ENTRAR EN PISTA:</text>
      <text x="28" y="494" fill="#f8fafc" font-size="10">Solicitar a la torre el ÚLTIMO RVR</text>
      <text x="28" y="508" fill="#a78bfa" font-size="9.5">de los 3 sectores (TDZ, MID, END).</text>
    </g>

    <!-- CARD 4: TÉCNICA DE RODAJE EN LVP -->
    <g transform="translate(875, 0)">
      <rect width="265" height="555" rx="12" fill="url(#cardGradL)" stroke="#10b981" stroke-width="1.5" />
      <rect x="14" y="14" width="28" height="28" rx="6" fill="#059669" />
      <text x="28" y="33" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="800" text-anchor="middle">4</text>
      
      <text x="50" y="28" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="14" font-weight="800">RODAJE BAJO LVP</text>
      <text x="50" y="42" fill="#94a3b8" font-size="10">Seguridad en Plataforma</text>

      <rect x="14" y="56" width="237" height="135" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1" />
      <text x="24" y="76" fill="#34d399" font-size="11" font-weight="800">Velocidades Máximas:</text>
      
      <rect x="22" y="86" width="220" height="42" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1" />
      <text x="30" y="104" fill="#a7f3d0" font-size="10" font-weight="700">TRAMO RECTO:</text>
      <text x="30" y="120" fill="#ffffff" font-size="13" font-weight="900">MÁXIMO 10 NUDOS (KT)</text>

      <rect x="22" y="136" width="220" height="42" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1" />
      <text x="30" y="154" fill="#a7f3d0" font-size="10" font-weight="700">EN VIRAJES:</text>
      <text x="30" y="170" fill="#ffffff" font-size="13" font-weight="900">MÁXIMO 5 NUDOS (KT)</text>

      <rect x="14" y="201" width="237" height="185" rx="6" fill="#450a0a" fill-opacity="0.35" stroke="#ef4444" stroke-width="1.5" />
      <text x="24" y="221" fill="#f87171" font-size="11" font-weight="800">¡REGLA DE ORO DE PARADA!</text>
      <text x="24" y="241" fill="#fca5a5" font-size="10" font-weight="800">Ante cualquier duda de posición</text>
      <text x="24" y="255" fill="#fca5a5" font-size="10" font-weight="800">o pérdida de referencias:</text>
      
      <rect x="22" y="265" width="220" height="60" rx="4" fill="#7f1d1d" stroke="#ef4444" stroke-width="1" />
      <text x="30" y="285" fill="#ffffff" font-size="11" font-weight="900">1° PARAR EL AVIÓN</text>
      <text x="30" y="299" fill="#ffffff" font-size="11" font-weight="900">   INMEDIATAMENTE</text>
      <text x="30" y="315" fill="#fecaca" font-size="10" font-weight="800">2° PONER PARK BRAKE ON</text>

      <text x="24" y="345" fill="#cbd5e1" font-size="9.5">• Comunicar al control de rodaje (GND).</text>
      <text x="24" y="359" fill="#cbd5e1" font-size="9.5">• Solicitar Follow-Me / asistencia.</text>
      <text x="24" y="373" fill="#cbd5e1" font-size="9.5">• NUNCA continuar a ciegas.</text>

      <rect x="14" y="396" width="237" height="145" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="24" y="416" fill="#38bdf8" font-size="11" font-weight="800">Disciplina de Cabina</text>
      <text x="24" y="432" fill="#cbd5e1" font-size="10">• Ambos pilotos mirando fuera.</text>
      <text x="24" y="446" fill="#cbd5e1" font-size="10">• Excepto chequeo puntual en carta.</text>
      <text x="24" y="460" fill="#cbd5e1" font-size="10">• Cabina estéril estricta.</text>
      <text x="24" y="474" fill="#cbd5e1" font-size="10">• Luces de rodaje en ON.</text>
      <text x="24" y="488" fill="#cbd5e1" font-size="10">• Verificar Stop Bars apagadas</text>
      <text x="24" y="502" fill="#cbd5e1" font-size="10">  antes de cruzar cualquier punto.</text>
    </g>

  </g>
</svg>
