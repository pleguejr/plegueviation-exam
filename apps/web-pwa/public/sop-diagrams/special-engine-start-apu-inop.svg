<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1150" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c16"/>
      <stop offset="50%" stop-color="#0c1626"/>
      <stop offset="100%" stop-color="#050810"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#152238"/>
      <stop offset="100%" stop-color="#0f192b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1600" height="1150" fill="url(#bgGrad)"/>

  <!-- Header Banner -->
  <g transform="translate(40, 25)">
    <rect width="1520" height="85" rx="12" fill="#132035" stroke="#253856" stroke-width="2" filter="url(#shadow)"/>
    <rect width="12" height="85" fill="url(#goldGrad)" rx="3"/>
    
    <text x="35" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#f8fafc" letter-spacing="0.5">
      PROCEDIMIENTO ESPECIAL: PUESTA EN MARCHA CON APU INOP
    </text>
    <text x="35" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#38bdf8">
      Binter MOA 8.2.2.12.3.1 &amp; SOPM • Toma Inferior ASU + Arranque Motor 2 + Crossbleed Motor 1 • E195-E2
    </text>

    <rect x="1330" y="24" width="160" height="38" rx="8" fill="rgba(245, 158, 11, 0.15)" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="1410" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#fbbf24" text-anchor="middle">
      MOA 8.2.2.12
    </text>
  </g>

  <!-- Visual Schematic of Ground Start Architecture with Binter Aircraft -->
  <g transform="translate(40, 130)">
    <rect width="1520" height="175" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)"/>
    
    <!-- Top Down Schematic of E195-E2 in Parking -->
    <g transform="translate(320, 85) scale(0.75)">
      <!-- Fuselage -->
      <path d="M -160,0 L 160,0" stroke="#f8fafc" stroke-width="20" stroke-linecap="round"/>
      <path d="M 150,-10 L 180,0 L 150,10 Z" fill="#0284c7"/>
      <!-- Wings -->
      <path d="M 20,-10 L -40,-90 L -60,-90 L -10,-10 Z" fill="#64748b"/>
      <path d="M 20,10 L -40,90 L -60,90 L -10,10 Z" fill="#64748b"/>
      <!-- Winglets -->
      <path d="M -40,-90 L -35,-100 L -50,-90 Z" fill="#10b981"/>
      <path d="M -40,90 L -35,100 L -50,90 Z" fill="#10b981"/>
      <!-- Tail -->
      <path d="M -130,-7 L -160,-40 L -170,-40 L -145,-7 Z" fill="#0284c7"/>
      <path d="M -130,7 L -160,40 L -170,40 L -145,7 Z" fill="#0284c7"/>
      <!-- Engine 1 (Left) -->
      <rect x="-15" y="-55" width="45" height="20" rx="6" fill="#38bdf8" stroke="#0284c7" stroke-width="1.5"/>
      <text x="8" y="-62" font-family="sans-serif" font-size="12" font-weight="800" fill="#38bdf8" text-anchor="middle">MOTOR 1</text>
      <!-- Engine 2 (Right) -->
      <rect x="-15" y="35" width="45" height="20" rx="6" fill="#10b981" stroke="#059669" stroke-width="1.5"/>
      <text x="8" y="70" font-family="sans-serif" font-size="12" font-weight="800" fill="#34d399" text-anchor="middle">MOTOR 2 (ARRANCA 1°)</text>
    </g>

    <!-- ASU & GPU Ground Equipment Visual Connection -->
    <g transform="translate(680, 45)">
      <!-- ASU Box -->
      <rect x="0" y="0" width="160" height="42" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="80" y="26" font-family="sans-serif" font-size="13" font-weight="800" fill="#fbbf24" text-anchor="middle">ASU (NEUMÁTICO)</text>
      <!-- Pneumatic Hose Line to Lower Fuselage -->
      <path d="M 0,21 L -120,21 L -160,40" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="4,4"/>
      <text x="-80" y="15" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#fbbf24">&gt; 30 PSI DUCT</text>

      <!-- GPU Box -->
      <rect x="0" y="55" width="160" height="42" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="80" y="81" font-family="sans-serif" font-size="13" font-weight="800" fill="#38bdf8" text-anchor="middle">GPU (115V AC / 400Hz)</text>
      <!-- Electric Cable -->
      <path d="M 0,76 L -100,76 L -140,50" fill="none" stroke="#38bdf8" stroke-width="3"/>
    </g>

    <!-- Key Rules Box -->
    <rect x="960" y="20" width="520" height="135" rx="8" fill="#132035" stroke="#10b981" stroke-width="1.5"/>
    <text x="980" y="45" font-family="sans-serif" font-size="14.5" font-weight="900" fill="#34d399">ORDEN OPERACIONAL OBLIGATORIO:</text>
    <text x="980" y="68" font-family="sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">1. Arranque de Motor 2 con unidad neumática ASU en tierra.</text>
    <text x="980" y="90" font-family="sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">2. Desconexión y retirada de ASU y GPU externa.</text>
    <text x="980" y="112" font-family="sans-serif" font-size="13" font-weight="600" fill="#fbbf24">3. Aumento de empuje Motor 2 ➔ Arranque cruzado Motor 1.</text>
    <text x="980" y="134" font-family="sans-serif" font-size="12" font-weight="500" fill="#94a3b8">Beacon ON durante todo el procedimiento desde el inicio.</text>
  </g>

  <!-- 3 Main Columns: Fase 1, Fase 2, Fase 3 -->
  <g transform="translate(40, 325)">
    
    <!-- Col 1: Fase 1 -->
    <g transform="translate(0, 0)">
      <rect width="485" height="560" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)"/>
      <rect width="485" height="42" rx="12" fill="url(#blueGrad)"/>
      <text x="242" y="27" font-family="sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">
        FASE 1: CONEXIÓN &amp; BRIEFING TIERRA
      </text>

      <g transform="translate(20, 60)" font-family="sans-serif">
        <rect width="445" height="120" rx="8" fill="#18263e" stroke="#334155" stroke-width="1"/>
        <text x="20" y="28" font-size="15" font-weight="800" fill="#38bdf8">1. Conexión de Equipos en Tierra</text>
        <text x="20" y="52" font-size="13.5" font-weight="500" fill="#cbd5e1">• Conectar GPU eléctrica (115V AC / 400Hz).</text>
        <text x="20" y="74" font-size="13.5" font-weight="500" fill="#cbd5e1">• Conectar manguera ASU en la toma inferior</text>
        <text x="20" y="94" font-size="13.5" font-weight="500" fill="#cbd5e1">del fuselaje (lado derecho de rampa).</text>
        <text x="20" y="114" font-size="12" font-weight="600" fill="#fbbf24">Finger/Pasarela desconectada antes del arranque.</text>

        <g transform="translate(0, 135)">
          <rect width="445" height="110" rx="8" fill="#18263e" stroke="#0284c7" stroke-width="1.5"/>
          <text x="20" y="28" font-size="15" font-weight="800" fill="#38bdf8">2. Comprobación Presión Neumática</text>
          <text x="20" y="52" font-size="13.5" font-weight="500" fill="#e2e8f0">• Verificar en MFD Synoptic Page:</text>
          <text x="20" y="74" font-size="14.5" font-weight="900" fill="#34d399">DUCT PRESSURE ≥ 30 PSI</text>
          <text x="20" y="96" font-size="13" font-weight="500" fill="#cbd5e1">Solicitar a tierra acelerar ASU si la presión es &lt; 30.</text>
        </g>

        <g transform="translate(0, 260)">
          <rect width="445" height="145" rx="8" fill="#18263e" stroke="#334155" stroke-width="1"/>
          <text x="20" y="28" font-size="15" font-weight="800" fill="#fbbf24">3. Fraseología Tierra-Cabina Inicial</text>
          <text x="20" y="52" font-size="13" font-weight="700" fill="#ffffff">C: "Autorizados puesta en marcha, confirme</text>
          <text x="20" y="70" font-size="13" font-weight="700" fill="#ffffff">walk-around, puertas y registros cerrados"</text>
          <text x="20" y="92" font-size="13" font-weight="500" fill="#38bdf8">T: "Le confirmo walk-around y registros cerrados"</text>
          <text x="20" y="114" font-size="13" font-weight="700" fill="#ffffff">C: "¿Presión de aire lista en 30 PSI?"</text>
          <text x="20" y="134" font-size="13" font-weight="500" fill="#38bdf8">T: "Presión de aire lista y comprobada"</text>
        </g>
      </g>
    </g>

    <!-- Col 2: Fase 2 -->
    <g transform="translate(515, 0)">
      <rect width="485" height="560" rx="12" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
      <rect width="485" height="42" rx="12" fill="url(#goldGrad)"/>
      <text x="242" y="27" font-family="sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">
        FASE 2: ARRANQUE MOTOR 2 CON ASU
      </text>

      <g transform="translate(20, 60)" font-family="sans-serif">
        <rect width="445" height="120" rx="8" fill="#18263e" stroke="#334155" stroke-width="1"/>
        <text x="20" y="28" font-size="15" font-weight="800" fill="#fbbf24">1. Accionar Selector START ENG 2</text>
        <text x="20" y="52" font-size="13.5" font-weight="500" fill="#cbd5e1">• Girar selector START/STOP 2 a posición <tspan font-weight="700" fill="#ffffff">START</tspan></text>
        <text x="20" y="74" font-size="13.5" font-weight="500" fill="#cbd5e1">durante <tspan font-weight="700" fill="#38bdf8">2 segundos</tspan> y soltar.</text>
        <text x="20" y="98" font-size="13.5" font-weight="900" fill="#34d399">Tierra canta: "Cabina, motor 2 girando"</text>
        <text x="20" y="116" font-size="12" font-weight="500" fill="#94a3b8">(confirmación visual indispensable de rotación).</text>

        <g transform="translate(0, 135)">
          <rect width="445" height="120" rx="8" fill="#18263e" stroke="#334155" stroke-width="1"/>
          <text x="20" y="28" font-size="15" font-weight="800" fill="#fbbf24">2. Monitoreo de Parámetros EICAS</text>
          <text x="20" y="52" font-size="13.5" font-weight="500" fill="#cbd5e1">• N2 en ascenso / Presión de aceite normal.</text>
          <text x="20" y="74" font-size="13.5" font-weight="500" fill="#cbd5e1">• Flujo de combustible / Light-off (ITT &lt; límite).</text>
          <text x="20" y="96" font-size="13.5" font-weight="500" fill="#cbd5e1">• N1 acelerando y estabilizado en ralentí (IDLE).</text>
        </g>

        <g transform="translate(0, 270)">
          <rect width="445" height="135" rx="8" fill="#18263e" stroke="#f59e0b" stroke-width="1.5"/>
          <text x="20" y="28" font-size="15" font-weight="800" fill="#fbbf24">3. Desconexión de GPU y ASU</text>
          <text x="20" y="52" font-size="13" font-weight="700" fill="#ffffff">C: "Puesta en marcha 2 correcta. GPU y ASU fuera"</text>
          <text x="20" y="74" font-size="13" font-weight="500" fill="#38bdf8">T: "GPU y ASU fuera / GPU and ASU removed"</text>
          <text x="20" y="96" font-size="13" font-weight="500" fill="#cbd5e1">• Tierra retira mangueras y cierra registros.</text>
          <text x="20" y="118" font-size="13" font-weight="700" fill="#34d399">• Generador de Motor 2 alimenta toda la red.</text>
        </g>
      </g>
    </g>

    <!-- Col 3: Fase 3 -->
    <g transform="translate(1030, 0)">
      <rect width="490" height="560" rx="12" fill="url(#cardGrad)" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
      <rect width="490" height="42" rx="12" fill="url(#greenGrad)"/>
      <text x="245" y="27" font-family="sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">
        FASE 3: CROSSBLEED START MOTOR 1
      </text>

      <g transform="translate(20, 60)" font-family="sans-serif">
        <rect width="450" height="120" rx="8" fill="rgba(220, 38, 38, 0.2)" stroke="#ef4444" stroke-width="1.5"/>
        <text x="20" y="26" font-size="14.5" font-weight="800" fill="#f87171">1. Seguridad de Chorro Trasero (Jet Blast)</text>
        <text x="20" y="48" font-size="13" font-weight="700" fill="#ffffff">C: "¿Está libre zona motor 2 para potencia?"</text>
        <text x="20" y="70" font-size="13" font-weight="500" fill="#38bdf8">T: "Libre área del número 2 para potencia"</text>
        <text x="20" y="92" font-size="12.5" font-weight="600" fill="#fecaca">• Asegurar que no hay vehículos ni GSE en cono trasero.</text>
        <text x="20" y="112" font-size="12.5" font-weight="700" fill="#34d399">• Avanzar palanca Eng 2 hasta Duct &gt; 30 PSI.</text>

        <g transform="translate(0, 135)">
          <rect width="450" height="120" rx="8" fill="#18263e" stroke="#10b981" stroke-width="1.5"/>
          <text x="20" y="28" font-size="15" font-weight="800" fill="#34d399">2. Arranque Cruzado Motor 1</text>
          <text x="20" y="52" font-size="13" font-weight="700" fill="#ffffff">C: "Arrancando motor número 1"</text>
          <text x="20" y="74" font-size="13.5" font-weight="900" fill="#34d399">T: "Cabina, motor 1 girando"</text>
          <text x="20" y="96" font-size="13" font-weight="500" fill="#cbd5e1">• Al estabilizar Motor 1 en ralentí:</text>
          <text x="20" y="116" font-size="13" font-weight="700" fill="#facc15">➔ REDUCIR INMEDIATAMENTE MOTOR 2 A IDLE.</text>
        </g>

        <g transform="translate(0, 270)">
          <rect width="450" height="135" rx="8" fill="#18263e" stroke="#334155" stroke-width="1"/>
          <text x="20" y="28" font-size="15" font-weight="800" fill="#38bdf8">3. Retirada de Calzos &amp; Despedida</text>
          <text x="20" y="52" font-size="12.5" font-weight="700" fill="#ffffff">C: "Dos puestas correctas. Calzos fuera, señal a la izq"</text>
          <text x="20" y="74" font-size="12.5" font-weight="500" fill="#38bdf8">T: "Calzos fuera, mantenga posición hasta señal visual"</text>
          <text x="20" y="96" font-size="13" font-weight="700" fill="#fbbf24">• Comprobar señal visual con pasador y cinta roja.</text>
          <text x="20" y="118" font-size="13" font-weight="500" fill="#cbd5e1">• Soltar freno de parking e iniciar rodaje seguro.</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Bottom Bar -->
  <g transform="translate(40, 1010)">
    <rect width="1520" height="110" rx="12" fill="#132035" stroke="#253856" stroke-width="2" filter="url(#shadow)"/>
    <text x="30" y="36" font-family="sans-serif" font-size="16" font-weight="800" fill="#38bdf8">
      REGLA DE SEGURIDAD OPERACIONAL BINTER MOA 8.2.2.12.3.1:
    </text>
    <text x="30" y="65" font-family="sans-serif" font-size="14" font-weight="500" fill="#cbd5e1">
      • La rotación del motor debe ser confirmada expresamente por el agente de rampa por interfono antes de dar por buena la secuencia de ignición.
    </text>
    <text x="30" y="90" font-family="sans-serif" font-size="14" font-weight="500" fill="#cbd5e1">
      • El coordinador de rampa permanecerá en la posición de despedida visible desde cabina hasta que la aeronave inicie el movimiento de rodaje.
    </text>
  </g>
</svg>
