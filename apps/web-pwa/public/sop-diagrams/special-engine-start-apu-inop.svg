<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b111e"/>
      <stop offset="100%" stop-color="#070b12"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="850" fill="url(#bgGrad)"/>

  <!-- Subtle Grid Lines -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="0" y1="700" x2="1200" y2="700"/>
  </g>

  <!-- Header Banner -->
  <rect x="40" y="30" width="1120" height="75" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)"/>
  <rect x="40" y="30" width="10" height="75" fill="#f59e0b" rx="2"/>
  
  <text x="65" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#f8fafc" letter-spacing="0.5">
    PROCEDIMIENTO ESPECIAL: PUESTA EN MARCHA CON APU INOP
  </text>
  <text x="65" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">
    Binter MOA 8.2.2.12.3.1 &amp; SOPM E195-E2 • Arranque con ASU Neumático en Tierra + Crossbleed Start
  </text>
  <rect x="980" y="47" width="160" height="38" rx="6" fill="rgba(245, 158, 11, 0.2)" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="1060" y="71" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#fcd34d" text-anchor="middle">
    MOA 8.2 &amp; SOPM
  </text>

  <!-- Sequence Step 1 -->
  <g transform="translate(40, 125)">
    <rect width="350" height="480" rx="8" fill="#131e31" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect width="350" height="40" rx="8" fill="url(#blueGrad)"/>
    <text x="175" y="26" font-family="sans-serif" font-size="13.5" font-weight="800" fill="#ffffff" text-anchor="middle">
      FASE 1: CONEXIÓN &amp; BRIEFING TIERRA
    </text>

    <circle cx="35" cy="70" r="14" fill="#0284c7"/>
    <text x="35" y="75" font-family="sans-serif" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
    <text x="60" y="68" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff">Equipos de Tierra (GPU + ASU)</text>
    <text x="60" y="85" font-family="sans-serif" font-size="11.5" font-weight="500" fill="#94a3b8">GPU eléctrica (115V AC) conectada</text>
    <text x="60" y="100" font-family="sans-serif" font-size="11.5" font-weight="500" fill="#94a3b8">ASU neumático conectado en tomas</text>

    <circle cx="35" cy="140" r="14" fill="#0284c7"/>
    <text x="35" y="145" font-family="sans-serif" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">2</text>
    <text x="60" y="138" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff">Verificación Presión Neumática</text>
    <text x="60" y="155" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#38bdf8">Duct Pressure MÍNIMO 30 PSI</text>
    <text x="60" y="170" font-family="sans-serif" font-size="11.5" font-weight="500" fill="#94a3b8">Pedir a tierra ajuste de presión si &lt;30</text>

    <circle cx="35" cy="210" r="14" fill="#0284c7"/>
    <text x="35" y="215" font-family="sans-serif" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">3</text>
    <text x="60" y="208" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff">Briefing Intercom con Tierra</text>
    <text x="60" y="225" font-family="sans-serif" font-size="11.5" font-weight="500" fill="#94a3b8">Confirmar secuencia: "Arrancaremos</text>
    <text x="60" y="240" font-family="sans-serif" font-size="11.5" font-weight="500" fill="#94a3b8">Motor 2 con ASU, desconexión y</text>
    <text x="60" y="255" font-family="sans-serif" font-size="11.5" font-weight="500" fill="#94a3b8">posterior arranque cruzado de Motor 1"</text>

    <!-- Dialog Box -->
    <rect x="20" y="295" width="310" height="165" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
    <text x="35" y="320" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#38bdf8">FRASILOGÍA CABINA - TIERRA:</text>
    <text x="35" y="342" font-family="sans-serif" font-size="11" font-weight="600" fill="#f8fafc">C: "¿Presión de aire lista en 30 PSI?"</text>
    <text x="35" y="362" font-family="sans-serif" font-size="11" font-weight="600" fill="#93c5fd">T: "Presión lista y comprobada."</text>
    <text x="35" y="382" font-family="sans-serif" font-size="11" font-weight="600" fill="#f8fafc">C: "Puesta en marcha Motor 2."</text>
    <text x="35" y="402" font-family="sans-serif" font-size="11" font-weight="600" fill="#93c5fd">T: "Área motor 2 libre, autorizado."</text>
    <text x="35" y="430" font-family="sans-serif" font-size="10.5" font-weight="500" fill="#cbd5e1">Beacon ON antes de accionar START</text>
  </g>

  <!-- Sequence Step 2 -->
  <g transform="translate(425, 125)">
    <rect width="350" height="480" rx="8" fill="#131e31" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect width="350" height="40" rx="8" fill="url(#amberGrad)"/>
    <text x="175" y="26" font-family="sans-serif" font-size="13.5" font-weight="800" fill="#ffffff" text-anchor="middle">
      FASE 2: ARRANQUE MOTOR 2 CON ASU
    </text>

    <circle cx="35" cy="70" r="14" fill="#d97706"/>
    <text x="35" y="75" font-family="sans-serif" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
    <text x="60" y="68" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff">Accionar Start Switch</text>
    <text x="60" y="85" font-family="sans-serif" font-size="11.5" font-weight="500" fill="#cbd5e1">START selector ENG 2 a posición START</text>
    <text x="60" y="100" font-family="sans-serif" font-size="11.5" font-weight="500" fill="#cbd5e1">durante 2 segundos y soltar.</text>

    <circle cx="35" cy="140" r="14" fill="#d97706"/>
    <text x="35" y="145" font-family="sans-serif" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">2</text>
    <text x="60" y="138" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff">Monitoreo de Instrumentos</text>
    <text x="60" y="155" font-family="sans-serif" font-size="11.5" font-weight="500" fill="#cbd5e1">• N2 en aumento / Presión de aceite</text>
    <text x="60" y="170" font-family="sans-serif" font-size="11.5" font-weight="500" fill="#cbd5e1">• Flujo de combustible / Light-off (ITT)</text>
    <text x="60" y="185" font-family="sans-serif" font-size="11.5" font-weight="500" fill="#cbd5e1">• N1 subiendo y estabilizado en ralentí</text>

    <circle cx="35" cy="225" r="14" fill="#d97706"/>
    <text x="35" y="230" font-family="sans-serif" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">3</text>
    <text x="60" y="223" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff">Desconexión Equipos Tierra</text>
    <text x="60" y="240" font-family="sans-serif" font-size="11.5" font-weight="500" fill="#cbd5e1">Confirmar Motor 2 en ralentí estable.</text>
    <text x="60" y="255" font-family="sans-serif" font-size="11.5" font-weight="500" fill="#cbd5e1">Ordenar desconexión ASU y GPU.</text>

    <!-- Dialog Box -->
    <rect x="20" y="295" width="310" height="165" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
    <text x="35" y="320" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#fcd34d">CONFIRMACIÓN DE TIERRA:</text>
    <text x="35" y="342" font-family="sans-serif" font-size="11" font-weight="600" fill="#93c5fd">T: "Cabina, motor 2 girando."</text>
    <text x="35" y="362" font-family="sans-serif" font-size="11" font-weight="600" fill="#f8fafc">C: "Motor 2 estabilizado. Desconecten</text>
    <text x="35" y="380" font-family="sans-serif" font-size="11" font-weight="600" fill="#f8fafc">ASU y GPU externa."</text>
    <text x="35" y="402" font-family="sans-serif" font-size="11" font-weight="600" fill="#93c5fd">T: "ASU y GPU desconectadas y fuera.</text>
    <text x="35" y="420" font-family="sans-serif" font-size="11" font-weight="600" fill="#93c5fd">Trampillas de servicio cerradas."</text>
  </g>

  <!-- Sequence Step 3 -->
  <g transform="translate(810, 125)">
    <rect width="350" height="480" rx="8" fill="#131e31" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect width="350" height="40" rx="8" fill="url(#greenGrad)"/>
    <text x="175" y="26" font-family="sans-serif" font-size="13.5" font-weight="800" fill="#ffffff" text-anchor="middle">
      FASE 3: CROSSBLEED START MOTOR 1
    </text>

    <circle cx="35" cy="70" r="14" fill="#16a34a"/>
    <text x="35" y="75" font-family="sans-serif" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
    <text x="60" y="68" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff">Verificar Área Trasera Libre</text>
    <text x="60" y="85" font-family="sans-serif" font-size="11.5" font-weight="500" fill="#cbd5e1">Avisar a tierra antes del aumento</text>
    <text x="60" y="100" font-family="sans-serif" font-size="11.5" font-weight="500" fill="#cbd5e1">de empuje (Jet Blast hazard).</text>

    <circle cx="35" cy="140" r="14" fill="#16a34a"/>
    <text x="35" y="145" font-family="sans-serif" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">2</text>
    <text x="60" y="138" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff">Subir Potencia Motor 2</text>
    <text x="60" y="155" font-family="sans-serif" font-size="11.5" font-weight="500" fill="#cbd5e1">Avanzar palanca Eng 2 hasta obtener</text>
    <text x="60" y="170" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#4ade80">Duct Pressure &gt; 30 PSI en Crossbleed</text>

    <circle cx="35" cy="215" r="14" fill="#16a34a"/>
    <text x="35" y="220" font-family="sans-serif" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">3</text>
    <text x="60" y="213" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff">Arranque Motor 1 &amp; IDLE</text>
    <text x="60" y="230" font-family="sans-serif" font-size="11.5" font-weight="500" fill="#cbd5e1">START switch Eng 1 a START.</text>
    <text x="60" y="245" font-family="sans-serif" font-size="11.5" font-weight="500" fill="#cbd5e1">Al estabilizar N1 en ralentí,</text>
    <text x="60" y="260" font-family="sans-serif" font-size="11.5" font-weight="500" fill="#cbd5e1">reducir Motor 2 a IDLE de inmediato.</text>

    <!-- Final Box -->
    <rect x="20" y="295" width="310" height="165" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
    <text x="35" y="320" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#4ade80">DESPEDIDA &amp; CALZOS FUERA:</text>
    <text x="35" y="342" font-family="sans-serif" font-size="11" font-weight="600" fill="#f8fafc">C: "Ambos motores estabilizados,</text>
    <text x="35" y="358" font-family="sans-serif" font-size="11" font-weight="600" fill="#f8fafc">autorizados a retirar calzos y desconectar."</text>
    <text x="35" y="380" font-family="sans-serif" font-size="11" font-weight="600" fill="#93c5fd">T: "Calzos fuera, pasador retirado,</text>
    <text x="35" y="396" font-family="sans-serif" font-size="11" font-weight="600" fill="#93c5fd">señal a la izquierda. ¡Buen vuelo!"</text>
    <text x="35" y="420" font-family="sans-serif" font-size="11" font-weight="600" fill="#fcd34d">Comprobar señal visual con pin y cinta</text>
  </g>

  <!-- Bottom Technical Summary Bar -->
  <g transform="translate(40, 625)">
    <rect width="1120" height="190" rx="8" fill="#131e31" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)"/>
    
    <!-- Left Section: Bleed Architecture -->
    <text x="30" y="30" font-family="sans-serif" font-size="13" font-weight="800" fill="#38bdf8">
      ARQUITECTURA NEUMÁTICA E195-E2 (PRATT &amp; WHITNEY PW1900G):
    </text>
    <text x="30" y="55" font-family="sans-serif" font-size="11.5" font-weight="500" fill="#cbd5e1">
      • Toma de arranque en tierra (Ground Pneumatic Receptacle): Localizada en la parte inferior del fuselaje derecho.
    </text>
    <text x="30" y="75" font-family="sans-serif" font-size="11.5" font-weight="500" fill="#cbd5e1">
      • Válvula Crossbleed (XBLEED): En modo AUTO abre automáticamente durante la secuencia de arranque cruzado.
    </text>
    <text x="30" y="95" font-family="sans-serif" font-size="11.5" font-weight="500" fill="#cbd5e1">
      • Presión mínima requerida: 30 PSI para garantizar rotación adecuada del starter neumático y evitar Hot Start / Hung Start.
    </text>

    <!-- Right Section: Critical Safety Warnings -->
    <rect x="680" y="15" width="415" height="160" rx="6" fill="rgba(220,38,38,0.15)" stroke="#ef4444" stroke-width="1.5"/>
    <text x="700" y="38" font-family="sans-serif" font-size="12" font-weight="800" fill="#f87171">ADVERTENCIAS DE SEGURIDAD OPERACIONAL (MOA 8):</text>
    <text x="700" y="60" font-family="sans-serif" font-size="11" font-weight="600" fill="#fecaca">• ¡CUIDADO JET BLAST! Antes de subir potencia de Motor 2,</text>
    <text x="700" y="76" font-family="sans-serif" font-size="11" font-weight="600" fill="#fecaca">asegurar que no hay vehículos ni personal en el cono trasero.</text>
    <text x="700" y="98" font-family="sans-serif" font-size="11" font-weight="600" fill="#fecaca">• BEACON LIGHT: Debe permanecer encendido durante todo el proceso</text>
    <text x="700" y="114" font-family="sans-serif" font-size="11" font-weight="600" fill="#fecaca">desde antes de iniciar el arranque del primer motor.</text>
    <text x="700" y="136" font-family="sans-serif" font-size="11" font-weight="600" fill="#fecaca">• No soltar los frenos de estacionamiento hasta recibir la señal</text>
    <text x="700" y="152" font-family="sans-serif" font-size="11" font-weight="600" fill="#fecaca">visual de "Calzos fuera y área despejada".</text>
  </g>
</svg>
