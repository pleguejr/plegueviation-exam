<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1150" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c16"/>
      <stop offset="50%" stop-color="#0c1626"/>
      <stop offset="100%" stop-color="#050810"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#152238"/>
      <stop offset="100%" stop-color="#0f192b"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1600" height="1150" fill="url(#bgGrad)"/>

  <!-- Header Banner -->
  <g transform="translate(40, 25)">
    <rect width="1520" height="85" rx="12" fill="#132035" stroke="#253856" stroke-width="2" filter="url(#shadow)"/>
    <rect width="12" height="85" fill="url(#blueGrad)" rx="3"/>
    
    <text x="35" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#f8fafc" letter-spacing="0.5">
      EVALUACIÓN DE APPROACH BAN, MÍNIMOS LVO Y REFERENCIAS VISUALES
    </text>
    <text x="35" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#38bdf8">
      EASA Part-CAT (CAT.OP.MPA.305) · SPA.LVO.100 · AMC1 CAT.OP.MPA.110 • Regla de Corte de 1.000 ft AAL y Requisitos Visuales
    </text>

    <rect x="1330" y="24" width="160" height="38" rx="8" fill="rgba(2, 132, 199, 0.15)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="1410" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#38bdf8" text-anchor="middle">
      1.000 FT AAL GATE
    </text>
  </g>

  <!-- Left Column: Big Flight Profile & Descent Vertical Trajectory -->
  <g transform="translate(40, 130)">
    <rect width="560" height="780" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="560" height="46" rx="12" fill="url(#blueGrad)"/>
    <text x="280" y="30" font-family="sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">
      PERFIL VERTICAL DE APROXIMACIÓN &amp; HITOS
    </text>

    <!-- Visual Approach Trajectory Diagram -->
    <g transform="translate(40, 70)">
      <!-- 3-Degree Glidepath Line -->
      <path d="M 40,40 L 260,260 L 400,500 L 450,560" fill="none" stroke="#38bdf8" stroke-width="4" stroke-dasharray="8,5"/>

      <!-- Runway Threshold & Touchdown Zone Graphic -->
      <g transform="translate(400, 560)">
        <polygon points="0,0 80,0 60,-20 20,-20" fill="#334155" stroke="#94a3b8" stroke-width="1.5"/>
        <line x1="40" y1="-20" x2="40" y2="0" stroke="#f8fafc" stroke-width="2.5" stroke-dasharray="3,3"/>
        <text x="40" y="22" font-family="sans-serif" font-size="12" font-weight="900" fill="#38bdf8" text-anchor="middle">RWY TDZ</text>
        <line x1="0" y1="-20" x2="80" y2="-20" stroke="#10b981" stroke-width="3"/>
      </g>

      <!-- FAF / FAP Plane (High) -->
      <g transform="translate(40, 40) scale(0.65)">
        <path d="M -60,0 L 60,0" stroke="#f8fafc" stroke-width="16" stroke-linecap="round"/>
        <path d="M 50,-8 L 70,0 L 50,8 Z" fill="#0284c7"/>
        <path d="M 10,-8 L -15,-45 L -25,-45 L -5,-8 Z" fill="#64748b"/>
        <path d="M 10,8 L -15,45 L -25,45 L -5,8 Z" fill="#64748b"/>
        <path d="M -15,-45 L -12,-52 L -20,-45 Z" fill="#10b981"/>
        <path d="M -15,45 L -12,52 L -20,45 Z" fill="#10b981"/>
      </g>
      <text x="85" y="45" font-family="sans-serif" font-size="13" font-weight="800" fill="#38bdf8">FAF / FAP (Aproximación Final)</text>

      <!-- 1000 ft Gate Marker Line -->
      <line x1="10" y1="260" x2="470" y2="260" stroke="#ef4444" stroke-width="3" stroke-dasharray="6,4"/>
      <rect x="90" y="240" width="300" height="38" rx="8" fill="#450a0a" stroke="#ef4444" stroke-width="1.5"/>
      <text x="240" y="264" font-family="sans-serif" font-size="14" font-weight="900" fill="#fca5a5" text-anchor="middle">
        PUNTO DE CORTE: 1.000 FT AAL (OM)
      </text>

      <!-- Plane at Decision Height -->
      <g transform="translate(320, 390) scale(0.65)">
        <path d="M -60,0 L 60,0" stroke="#f8fafc" stroke-width="16" stroke-linecap="round"/>
        <path d="M 50,-8 L 70,0 L 50,8 Z" fill="#0284c7"/>
        <path d="M 10,-8 L -15,-45 L -25,-45 L -5,-8 Z" fill="#64748b"/>
        <path d="M 10,8 L -15,45 L -25,45 L -5,8 Z" fill="#64748b"/>
        <path d="M -15,-45 L -12,-52 L -20,-45 Z" fill="#10b981"/>
        <path d="M -15,45 L -12,52 L -20,45 Z" fill="#10b981"/>
      </g>

      <!-- DA / DH Marker Line -->
      <line x1="180" y1="460" x2="470" y2="460" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="4,4"/>
      <text x="180" y="452" font-family="sans-serif" font-size="12.5" font-weight="800" fill="#fbbf24">
        DA / DH (CAT I: 200 ft / CAT II: 100 ft)
      </text>

      <!-- Explanatory Callout Boxes -->
      <!-- Above 1000ft Box -->
      <rect x="10" y="110" width="240" height="110" rx="8" fill="#101a2b" stroke="#ef4444" stroke-width="1.5"/>
      <text x="25" y="134" font-family="sans-serif" font-size="13" font-weight="900" fill="#f87171">POR ENCIMA DE 1.000 FT:</text>
      <text x="25" y="156" font-family="sans-serif" font-size="12" font-weight="500" fill="#cbd5e1">Si RVR notificado &lt; Mínimo:</text>
      <text x="25" y="176" font-family="sans-serif" font-size="12.5" font-weight="900" fill="#fca5a5">APPROACH BAN EN VIGOR</text>
      <text x="25" y="196" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#f87171">¡Prohibido continuar descenso!</text>

      <!-- Below 1000ft Box -->
      <rect x="10" y="300" width="240" height="120" rx="8" fill="#101a2b" stroke="#10b981" stroke-width="1.5"/>
      <text x="25" y="324" font-family="sans-serif" font-size="13" font-weight="900" fill="#34d399">POR DEBAJO DE 1.000 FT:</text>
      <text x="25" y="346" font-family="sans-serif" font-size="12" font-weight="500" fill="#cbd5e1">Si RVR notificado decae:</text>
      <text x="25" y="366" font-family="sans-serif" font-size="12.5" font-weight="900" fill="#a7f3d0">CONTINUAR HASTA DA/DH</text>
      <text x="25" y="386" font-family="sans-serif" font-size="11.5" font-weight="500" fill="#cbd5e1">Decide el contacto visual en mínimos.</text>
    </g>

    <!-- Bottom Flight Profile Rule Box -->
    <rect x="25" y="660" width="510" height="95" rx="8" fill="#101a2b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="45" y="688" font-family="sans-serif" font-size="13.5" font-weight="900" fill="#38bdf8">DEFINICIÓN DEL PUNTO DE CORTE (EASA):</text>
    <text x="45" y="712" font-family="sans-serif" font-size="12.5" font-weight="500" fill="#cbd5e1">1.000 ft sobre el terreno (AAL) o el FAF (Final Approach Fix) si este se encuentra por debajo de 1.000 ft.</text>
    <text x="45" y="734" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#fbbf24">En aproximaciones sin FAF: 1.000 ft AAL en el segmento final.</text>
  </g>

  <!-- Right: 3 Big Decision Stage Cards -->
  <g transform="translate(620, 130)">
    
    <!-- BLOCK 1: ANTES DE 1.000 FT AAL -->
    <g transform="translate(0, 0)">
      <rect width="940" height="240" rx="12" fill="url(#cardGrad)" stroke="#ef4444" stroke-width="2" filter="url(#shadow)"/>
      <rect width="940" height="42" rx="12" fill="url(#redGrad)"/>
      <text x="470" y="28" font-family="sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">
        1. EVALUACIÓN ANTES DE 1.000 FT AAL (O FAF / OUTER MARKER)
      </text>

      <g transform="translate(25, 55)">
        <text x="0" y="18" font-family="sans-serif" font-size="14" font-weight="600" fill="#cbd5e1">
          Control de la aproximación según el último valor oficial de RVR transmitido por la Torre de Control (TWR) o ATIS:
        </text>

        <!-- Condition A: RVR OK -->
        <rect x="0" y="32" width="435" height="135" rx="8" fill="#101a2b" stroke="#10b981" stroke-width="1.5"/>
        <text x="20" y="60" font-family="sans-serif" font-size="15" font-weight="900" fill="#34d399">✓ RVR ≥ MÍNIMO PUBLICADO</text>
        <text x="20" y="86" font-family="sans-serif" font-size="13" font-weight="500" fill="#cbd5e1">• Aproximación legalmente autorizada a continuar.</text>
        <text x="20" y="108" font-family="sans-serif" font-size="13" font-weight="500" fill="#cbd5e1">• Monitorear estabilización estricta de senda.</text>
        <text x="20" y="130" font-family="sans-serif" font-size="13" font-weight="700" fill="#38bdf8">• Preparar adquisición visual hacia la DA/DH.</text>

        <!-- Condition B: Approach Ban -->
        <rect x="455" y="32" width="435" height="135" rx="8" fill="rgba(220, 38, 38, 0.2)" stroke="#ef4444" stroke-width="1.5"/>
        <text x="475" y="60" font-family="sans-serif" font-size="15" font-weight="900" fill="#f87171">✗ RVR &lt; MÍNIMO PUBLICADO</text>
        <text x="475" y="86" font-family="sans-serif" font-size="13.5" font-weight="800" fill="#fca5a5">APPROACH BAN (CAT.OP.MPA.305)</text>
        <text x="475" y="108" font-family="sans-serif" font-size="13" font-weight="500" fill="#fecaca">• Prohibido descender por debajo de 1.000 ft AAL.</text>
        <text x="475" y="130" font-family="sans-serif" font-size="13.5" font-weight="800" fill="#ffffff">• ¡INICIAR GO-AROUND / FRUSTRADA INMEDIATA!</text>
      </g>
    </g>

    <!-- BLOCK 2: TRAS CRUZAR 1.000 FT AAL -->
    <g transform="translate(0, 260)">
      <rect width="940" height="240" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)"/>
      <rect width="940" height="42" rx="12" fill="url(#blueGrad)"/>
      <text x="470" y="28" font-family="sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">
        2. EVALUACIÓN POR DEBAJO DE 1.000 FT AAL (SEGMENTO FINAL EN CORTA)
      </text>

      <g transform="translate(25, 55)">
        <text x="0" y="18" font-family="sans-serif" font-size="14" font-weight="600" fill="#cbd5e1">
          El criterio legal cambia del valor meteorológico reportado por ATC a la adquisición visual efectiva en cabina:
        </text>

        <rect x="0" y="32" width="890" height="135" rx="8" fill="#101a2b" stroke="#38bdf8" stroke-width="1.5"/>
        <text x="25" y="60" font-family="sans-serif" font-size="15" font-weight="900" fill="#38bdf8">
          ¿QUÉ OCURRE SI EL RVR DECAE POR DEBAJO DEL MÍNIMO ESTANDO YA BAJO 1.000 FT?
        </text>
        <text x="25" y="88" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#f8fafc">
          ➔ La normativa EASA permite LEGALMENTE continuar el descenso hasta alcanzar la DA/DH o MDA/MDH.
        </text>
        <text x="25" y="112" font-family="sans-serif" font-size="13" font-weight="500" fill="#cbd5e1">
          • La tripulación no tiene que frustrar automáticamente por el reporte de torre tras cruzar 1.000 ft AAL.
        </text>
        <text x="25" y="136" font-family="sans-serif" font-size="13" font-weight="700" fill="#34d399">
          • El Comandante evaluará visualmente en la altura de decisión si se cumplen las referencias exigidas.
        </text>
      </g>
    </g>

    <!-- BLOCK 3: DECISIÓN EN DA/DH O MDA (REFERENCIAS VISUALES) -->
    <g transform="translate(0, 520)">
      <rect width="940" height="260" rx="12" fill="url(#cardGrad)" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
      <rect width="940" height="42" rx="12" fill="url(#greenGrad)"/>
      <text x="470" y="28" font-family="sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">
        3. DECISIÓN EN DA/DH O MDA/MDH (REFERENCIAS VISUALES EXIGIDAS)
      </text>

      <g transform="translate(25, 55)">
        <text x="0" y="18" font-family="sans-serif" font-size="14" font-weight="600" fill="#cbd5e1">
          Requisitos visuales mínimos indispensables para continuar por debajo de la DA/DH hacia el aterrizaje:
        </text>

        <!-- Visual Criteria CAT I / CAT II -->
        <rect x="0" y="32" width="435" height="155" rx="8" fill="#101a2b" stroke="#10b981" stroke-width="1.5"/>
        <text x="20" y="58" font-family="sans-serif" font-size="14.5" font-weight="900" fill="#34d399">CAT I (DH ≥ 200 ft):</text>
        <text x="20" y="80" font-family="sans-serif" font-size="12.5" font-weight="500" fill="#cbd5e1">Mínimo 1 elemento visual distintivo de pista (luces de aproximación, umbral, TDZ o marcas).</text>
        
        <text x="20" y="112" font-family="sans-serif" font-size="14.5" font-weight="900" fill="#34d399">CAT II (DH 100 - 200 ft):</text>
        <text x="20" y="134" font-family="sans-serif" font-size="12.5" font-weight="500" fill="#cbd5e1">Segmento visual mínimo de 3 luces consecutivas (eje/luces de aprox) + 1 barra transversal.</text>

        <!-- No Contact Go-Around -->
        <rect x="455" y="32" width="435" height="155" rx="8" fill="rgba(220, 38, 38, 0.2)" stroke="#ef4444" stroke-width="1.5"/>
        <text x="475" y="58" font-family="sans-serif" font-size="14.5" font-weight="900" fill="#f87171">¿SIN REFERENCIAS VISUALES EN DA/DH?</text>
        <text x="475" y="82" font-family="sans-serif" font-size="14" font-weight="900" fill="#fca5a5">¡MISSED APPROACH INMEDIATO!</text>
        <text x="475" y="106" font-family="sans-serif" font-size="13" font-weight="800" fill="#ffffff">Callout: "GO-AROUND, FLAPS, SET GA THRUST"</text>
        <text x="475" y="130" font-family="sans-serif" font-size="12.5" font-weight="500" fill="#fecaca">• Queda terminantemente prohibido buscar la pista por debajo de la DA/DH.</text>
        <text x="475" y="152" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#fbbf24">• Mantener patrón de frustrada publicado / ATC.</text>
      </g>
    </g>

  </g>

  <!-- Bottom Detailed AMC & Legal Framework Panel -->
  <g transform="translate(40, 930)">
    <rect width="1520" height="185" rx="12" fill="#132035" stroke="#253856" stroke-width="1.5" filter="url(#shadow)"/>
    
    <text x="35" y="38" font-family="sans-serif" font-size="16" font-weight="900" fill="#38bdf8">
      NORMATIVA EUROPEA APLICABLE &amp; DEFINICIONES TÉCNICAS (EASA AIR OPERATIONS):
    </text>

    <g transform="translate(35, 55)">
      <text x="0" y="20" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#f8fafc">
        • RVR de Toque Requerido (TDZ):
      </text>
      <text x="260" y="20" font-family="sans-serif" font-size="13.5" font-weight="500" fill="#cbd5e1">
        El RVR de la zona de toma (Touchdown) es siempre determinante y mandatorio. Los valores de Mid y Stop-end son informativos salvo especificación contraria en ficha de aproximación.
      </text>

      <text x="0" y="48" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#f8fafc">
        • Fallo de RVR de Toma:
      </text>
      <text x="220" y="48" font-family="sans-serif" font-size="13.5" font-weight="500" fill="#cbd5e1">
        Si el sensor de Touchdown está inoperativo, puede ser sustituido por el RVR del punto medio (Mid-point) si este cumple los mínimos.
      </text>

      <text x="0" y="76" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#f8fafc">
        • Iluminación de Pista &amp; LVP:
      </text>
      <text x="245" y="76" font-family="sans-serif" font-size="13.5" font-weight="500" fill="#cbd5e1">
        Para operaciones CAT II/III, los Procedimientos de Baja Visibilidad (LVP) deben estar obligatoriamente activos y confirmados por ATC antes de iniciar la aproximación final.
      </text>

      <text x="0" y="104" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#f8fafc">
        • Criterio de Estabilización:
      </text>
      <text x="235" y="104" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#fbbf24">
        A 1.000 ft en IMC o 500 ft en VMC, cualquier desviación en velocidad (+10/-0), senda (±1 punto) o potencia obliga a frustrar inmediatamente.
      </text>
    </g>
  </g>
</svg>
