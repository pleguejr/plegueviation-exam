<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#141c2e" />
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b283d" />
      <stop offset="100%" stop-color="#101826" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />
  
  <!-- Subtle Grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="135" x2="1200" y2="135" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="0" y1="405" x2="1200" y2="405" />
    <line x1="0" y1="540" x2="1200" y2="540" />
    <line x1="300" y1="0" x2="300" y2="675" />
    <line x1="600" y1="0" x2="600" y2="675" />
    <line x1="900" y1="0" x2="900" y2="675" />
  </g>

  <!-- Title Header -->
  <rect x="40" y="24" width="1120" height="74" rx="12" fill="#131d2e" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5" />
  <text x="60" y="56" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" letter-spacing="1">EVALUACIÓN DE APPROACH BAN, MÍNIMOS LVO Y REFERENCIAS VISUALES</text>
  <text x="60" y="82" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500">EASA Part-CAT.OP.MPA.305 · Part-SPA.LVO.100 · AMC1 CAT.OP.MPA.110 · NetJets Operations</text>
  
  <rect x="990" y="38" width="150" height="46" rx="8" fill="#0369a1" fill-opacity="0.4" stroke="#38bdf8" stroke-width="1" />
  <text x="1065" y="66" fill="#e0f2fe" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">REGLA 1.000 FT AAL</text>

  <!-- Left: Flight Profile Illustration -->
  <g transform="translate(40, 115)">
    <rect width="450" height="525" rx="14" fill="url(#cardGrad1)" stroke="#334155" stroke-width="1.5" />
    <text x="24" y="38" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700">PERFIL DE APROXIMACIÓN &amp; HITOS</text>

    <!-- Glide Slope Line -->
    <path d="M 50 80 L 250 250 L 380 430 L 410 470" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-dasharray="8 4" />
    
    <!-- Runway Graphic -->
    <polygon points="360,480 430,480 410,470 380,470" fill="#475569" stroke="#94a3b8" stroke-width="1" />
    <line x1="395" y1="470" x2="395" y2="480" stroke="#f8fafc" stroke-width="2" stroke-dasharray="2 2" />
    <text x="395" y="504" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">RWY TDZ</text>

    <!-- Airplane 1 (High) -->
    <circle cx="50" cy="80" r="14" fill="#0284c7" />
    <text x="50" y="85" fill="#ffffff" font-size="14" text-anchor="middle">✈</text>
    <text x="75" y="85" fill="#cbd5e1" font-size="12" font-weight="600">FAF / FAP (Crucero Final)</text>

    <!-- 1000 ft Gate Marker -->
    <line x1="30" y1="250" x2="420" y2="250" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="6 4" />
    <rect x="140" y="235" width="220" height="30" rx="6" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-width="1.5" />
    <text x="250" y="255" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="13" font-weight="800" text-anchor="middle">PUNTO DE CORTE: 1.000 FT AAL / OM</text>

    <!-- Airplane 2 (At Decision Height) -->
    <circle cx="280" cy="285" r="14" fill="#10b981" />
    <text x="280" y="290" fill="#ffffff" font-size="14" text-anchor="middle">✈</text>

    <!-- DA / DH Marker -->
    <line x1="200" y1="410" x2="420" y2="410" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 4" />
    <text x="210" y="402" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="700">DA / DH (CAT I: 200ft / CAT II: 100ft)</text>

    <!-- Info Callouts in Left Column -->
    <rect x="24" y="295" width="210" height="85" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1" />
    <text x="36" y="320" fill="#34d399" font-size="12" font-weight="700">Por debajo de 1.000 ft:</text>
    <text x="36" y="340" fill="#94a3b8" font-size="11">Si RVR decae por debajo,</text>
    <text x="36" y="356" fill="#f8fafc" font-size="11" font-weight="600">SE PERMITE continuar a DH.</text>
    <text x="36" y="372" fill="#94a3b8" font-size="11">Decide el contacto visual.</text>

    <rect x="24" y="140" width="210" height="85" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1" />
    <text x="36" y="165" fill="#f87171" font-size="12" font-weight="700">Por encima de 1.000 ft:</text>
    <text x="36" y="185" fill="#94a3b8" font-size="11">Si RVR notificado &lt; Mínimo,</text>
    <text x="36" y="201" fill="#fca5a5" font-size="11" font-weight="700">APPROACH BAN EN VIGOR.</text>
    <text x="36" y="217" fill="#f87171" font-size="11">¡Frustrada obligatoria!</text>
  </g>

  <!-- Right: 3 Decision Blocks -->
  <g transform="translate(510, 115)">
    
    <!-- BLOCK 1: ANTES DE 1000 FT AAL -->
    <g transform="translate(0, 0)">
      <rect width="650" height="155" rx="12" fill="url(#cardGrad1)" stroke="#ef4444" stroke-width="1.5" />
      <rect x="18" y="16" width="36" height="36" rx="8" fill="url(#redGrad)" />
      <text x="36" y="41" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="800" text-anchor="middle">1</text>
      
      <text x="68" y="34" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="15" font-weight="700">ANTES DE 1.000 FT AAL (O FAF / OUTER MARKER)</text>
      <text x="68" y="52" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Control de la aproximación según el RVR transmitido oficialmente por la Torre / ATIS</text>
      
      <rect x="20" y="70" width="295" height="70" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="32" y="94" fill="#34d399" font-size="13" font-weight="700">✓ RVR ≥ Mínimo Publicado</text>
      <text x="32" y="114" fill="#94a3b8" font-size="11">Aproximación autorizada a continuar.</text>
      <text x="32" y="129" fill="#cbd5e1" font-size="11">Monitorear estabilización de senda.</text>

      <rect x="330" y="70" width="300" height="70" rx="8" fill="#450a0a" fill-opacity="0.4" stroke="#ef4444" stroke-width="1.2" />
      <text x="342" y="94" fill="#f87171" font-size="13" font-weight="800">✗ RVR &lt; Mínimo Publicado</text>
      <text x="342" y="114" fill="#fca5a5" font-size="11" font-weight="700">APPROACH BAN (CAT.OP.MPA.305)</text>
      <text x="342" y="129" fill="#fecaca" font-size="11">Prohibido descender de 1000 ft. Iniciar Go-Around.</text>
    </g>

    <!-- BLOCK 2: TRAS CRUZAR 1000 FT AAL -->
    <g transform="translate(0, 175)">
      <rect width="650" height="155" rx="12" fill="url(#cardGrad1)" stroke="#38bdf8" stroke-width="1.5" />
      <rect x="18" y="16" width="36" height="36" rx="8" fill="url(#skyGrad)" />
      <text x="36" y="41" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="800" text-anchor="middle">2</text>
      
      <text x="68" y="34" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="15" font-weight="700">POR DEBAJO DE 1.000 FT AAL / FAF</text>
      <text x="68" y="52" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">El criterio legal pasa de la notificación RVR a la adquisición visual en la DH/MDH</text>

      <rect x="20" y="70" width="610" height="70" rx="8" fill="#0f172a" stroke="#0284c7" stroke-width="1" />
      <text x="34" y="94" fill="#38bdf8" font-size="13" font-weight="700">¿RVR decae por debajo del mínimo estando ya en corta final?</text>
      <text x="34" y="115" fill="#cbd5e1" font-size="12">La normativa EASA permite LEGALMENTE continuar el descenso hasta la DA/DH o MDA/MDH.</text>
      <text x="34" y="131" fill="#94a3b8" font-size="11">El Comandante evaluará visualmente en los mínimos si existen las referencias requeridas para la toma.</text>
    </g>

    <!-- BLOCK 3: EN LA DA/DH O MDA -->
    <g transform="translate(0, 350)">
      <rect width="650" height="175" rx="12" fill="url(#cardGrad1)" stroke="#10b981" stroke-width="1.5" />
      <rect x="18" y="16" width="36" height="36" rx="8" fill="url(#greenGrad)" />
      <text x="36" y="41" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="800" text-anchor="middle">3</text>
      
      <text x="68" y="34" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="15" font-weight="700">DECISIÓN EN DA/DH O MDA/MDH (REFERENCIAS VISUALES)</text>
      <text x="68" y="52" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Requisitos visuales estrictos según categoría ILS / LVO</text>

      <rect x="20" y="70" width="295" height="90" rx="8" fill="#064e3b" fill-opacity="0.4" stroke="#10b981" stroke-width="1" />
      <text x="32" y="92" fill="#34d399" font-size="12" font-weight="800">CAT I (DH ≥ 200 ft):</text>
      <text x="32" y="109" fill="#cbd5e1" font-size="11">Mínimo 1 elemento visual distintivo (luces de aproximación, umbral, TDZ, marcas).</text>
      <text x="32" y="128" fill="#34d399" font-size="12" font-weight="800">CAT II (DH 100-200 ft):</text>
      <text x="32" y="145" fill="#cbd5e1" font-size="11">3 luces consecutivas + 1 barra transversal.</text>

      <rect x="330" y="70" width="300" height="90" rx="8" fill="#450a0a" fill-opacity="0.3" stroke="#ef4444" stroke-width="1" />
      <text x="342" y="94" fill="#f87171" font-size="12" font-weight="800">¿SIN REFERENCIAS VISUALES EN DA/DH?</text>
      <text x="342" y="116" fill="#fca5a5" font-size="12" font-weight="700">¡MISSED APPROACH INMEDIATO!</text>
      <text x="342" y="136" fill="#e2e8f0" font-size="11">Callout: "GO-AROUND, FLAPS, SET GA THRUST"</text>
      <text x="342" y="151" fill="#94a3b8" font-size="10">Prohibido buscar la pista por debajo de la DA/DH.</text>
    </g>

  </g>
</svg>
