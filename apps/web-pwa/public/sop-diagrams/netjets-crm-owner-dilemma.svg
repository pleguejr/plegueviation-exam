<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1150" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c16"/>
      <stop offset="50%" stop-color="#0c1626"/>
      <stop offset="100%" stop-color="#050810"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#152238"/>
      <stop offset="100%" stop-color="#0f192b"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1600" height="1150" fill="url(#bgGrad)"/>

  <!-- Header Banner -->
  <g transform="translate(40, 25)">
    <rect width="1520" height="85" rx="12" fill="#132035" stroke="#253856" stroke-width="2" filter="url(#shadow)"/>
    <rect width="12" height="85" fill="url(#purpleGrad)" rx="3"/>
    
    <text x="35" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#f8fafc" letter-spacing="0.5">
      PROTOCOLO CRM: GESTIÓN DE PROPIETARIOS VIP, LIDERAZGO &amp; MODELO PACE
    </text>
    <text x="35" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#c084fc">
      EASA Part-CAT.GEN.MPA.105 · Autoridad del Comandante, Cultura Justa, Atención VIP y Gradiente Asertivo de Cabina
    </text>

    <rect x="1330" y="24" width="160" height="38" rx="8" fill="rgba(168, 85, 247, 0.15)" stroke="#a855f7" stroke-width="1.5"/>
    <text x="1410" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#d8b4fe" text-anchor="middle">
      OWNER MINDSET
    </text>
  </g>

  <!-- Top Strategic Overview Banner -->
  <g transform="translate(40, 130)">
    <rect width="1520" height="150" rx="12" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.5" filter="url(#shadow)"/>
    
    <g transform="translate(40, 25)">
      <rect width="450" height="100" rx="8" fill="#101a2b" stroke="#ef4444" stroke-width="1.5"/>
      <text x="25" y="32" font-family="sans-serif" font-size="15" font-weight="900" fill="#f87171">PILAR 1: SEGURIDAD INNEGOCIABLE</text>
      <text x="25" y="58" font-family="sans-serif" font-size="13" font-weight="500" fill="#cbd5e1">La seguridad de los pasajeros y la aeronave prima sobre cualquier interés comercial o jerárquico.</text>
      <text x="25" y="80" font-family="sans-serif" font-size="13" font-weight="800" fill="#fca5a5">Autoridad legal plena (CAT.GEN.105).</text>
    </g>

    <g transform="translate(535, 25)">
      <rect width="450" height="100" rx="8" fill="#101a2b" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="25" y="32" font-family="sans-serif" font-size="15" font-weight="900" fill="#fbbf24">PILAR 2: EXCELENCIA &amp; SOLUCIONES</text>
      <text x="25" y="58" font-family="sans-serif" font-size="13" font-weight="500" fill="#cbd5e1">Comunicación empática, directa y constructiva con el pasajero VIP. Proponer planes alternativos.</text>
      <text x="25" y="80" font-family="sans-serif" font-size="13" font-weight="800" fill="#fde68a">Soluciones inmediatas con OCC/Dispatch.</text>
    </g>

    <g transform="translate(1030, 25)">
      <rect width="450" height="100" rx="8" fill="#101a2b" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="25" y="32" font-family="sans-serif" font-size="15" font-weight="900" fill="#38bdf8">PILAR 3: GRADIENTE ASISTIDO (PACE)</text>
      <text x="25" y="58" font-family="sans-serif" font-size="13" font-weight="500" fill="#cbd5e1">Comunicación asertiva y no punitiva en cabina para corregir desviaciones sin vacilación.</text>
      <text x="25" y="80" font-family="sans-serif" font-size="13" font-weight="800" fill="#a7f3d0">Modelo Probe - Alert - Challenge - Emergency.</text>
    </g>
  </g>

  <!-- 3 Big Main Panels -->
  
  <!-- Panel 1: Seguridad No Negociable & Autoridad -->
  <g transform="translate(40, 305)">
    <rect width="485" height="585" rx="12" fill="url(#cardGrad)" stroke="#ef4444" stroke-width="2" filter="url(#shadow)"/>
    <rect width="485" height="46" rx="12" fill="url(#redGrad)"/>
    <text x="242" y="30" font-family="sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">
      1. SEGURIDAD NO NEGOCIABLE &amp; AUTORIDAD
    </text>

    <g transform="translate(25, 65)">
      <!-- Legal limits -->
      <rect x="0" y="0" width="435" height="135" rx="8" fill="#101a2b" stroke="#334155" stroke-width="1.5"/>
      <text x="20" y="26" font-family="sans-serif" font-size="14.5" font-weight="900" fill="#38bdf8">LÍMITES LEGALES Y OPERATIVOS SAGRADOS:</text>
      <text x="20" y="50" font-family="sans-serif" font-size="13" font-weight="500" fill="#cbd5e1">• Mínimos Meteorológicos de Destino y Alternativo (LVO / AOM)</text>
      <text x="20" y="72" font-family="sans-serif" font-size="13" font-weight="500" fill="#cbd5e1">• Límites de Actividad de Vuelo y Descanso de Tripulación (FTL)</text>
      <text x="20" y="94" font-family="sans-serif" font-size="13" font-weight="500" fill="#cbd5e1">• Pesos Estructurales y Rendimiento de Pista (MTOW, MLW, TOR)</text>
      <text x="20" y="116" font-family="sans-serif" font-size="13" font-weight="500" fill="#cbd5e1">• Despacho Técnico según Lista de Desviaciones Mínimas (MEL)</text>

      <!-- Commercial Pressure Rejection -->
      <rect x="0" y="150" width="435" height="165" rx="8" fill="rgba(220, 38, 38, 0.2)" stroke="#ef4444" stroke-width="1.5"/>
      <text x="20" y="26" font-family="sans-serif" font-size="14.5" font-weight="900" fill="#f87171">MANEJO DE PRESIÓN COMERCIAL / PROPIETARIOS:</text>
      <text x="20" y="50" font-family="sans-serif" font-size="13" font-weight="700" fill="#fca5a5">"Tengo una junta de 100M€ y debo despegar ya"</text>
      <text x="20" y="74" font-family="sans-serif" font-size="13" font-weight="500" fill="#fecaca">• El Comandante NUNCA cede ante presiones económicas o prisas.</text>
      <text x="20" y="96" font-family="sans-serif" font-size="13" font-weight="500" fill="#fecaca">• La vida de las personas a bordo está por encima de todo interés.</text>
      <text x="20" y="120" font-family="sans-serif" font-size="13.5" font-weight="900" fill="#ffffff">Firmeza serena: "Mi deber es llevarle a su destino con total seguridad".</text>
      <text x="20" y="144" font-family="sans-serif" font-size="12.5" font-weight="600" fill="#fca5a5">EASA ampara al 100% la decisión de no volar por seguridad.</text>

      <!-- Just Culture -->
      <rect x="0" y="330" width="435" height="175" rx="8" fill="#101a2b" stroke="#10b981" stroke-width="1.5"/>
      <text x="20" y="26" font-family="sans-serif" font-size="14.5" font-weight="900" fill="#34d399">FILOSOFÍA DE CULTURA JUSTA (JUST CULTURE):</text>
      <text x="20" y="50" font-family="sans-serif" font-size="13" font-weight="500" fill="#cbd5e1">• La Dirección respalda incondicionalmente a sus Comandantes cuando toman decisiones fundadas en la seguridad.</text>
      <text x="20" y="86" font-family="sans-serif" font-size="13" font-weight="500" fill="#cbd5e1">• No existen sanciones por retrasos o desvíos derivados de la meteorología o incidencias técnicas reales.</text>
      <text x="20" y="125" font-family="sans-serif" font-size="14" font-weight="900" fill="#a7f3d0">"SAFETY IS OUR UNCOMPROMISING PRIORITY"</text>
      <text x="20" y="148" font-family="sans-serif" font-size="12.5" font-weight="600" fill="#38bdf8">Principio rector de toda operación aeronáutica regulada.</text>
    </g>
  </g>

  <!-- Panel 2: Excelencia y Empatía VIP -->
  <g transform="translate(555, 305)">
    <rect width="490" height="585" rx="12" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
    <rect width="490" height="46" rx="12" fill="url(#amberGrad)"/>
    <text x="245" y="30" font-family="sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">
      2. EXCELENCIA, COMUNICACIÓN &amp; EMPATÍA VIP
    </text>

    <g transform="translate(25, 65)">
      <!-- Face to Face Communication -->
      <rect x="0" y="0" width="440" height="170" rx="8" fill="#101a2b" stroke="#334155" stroke-width="1.5"/>
      <text x="20" y="26" font-family="sans-serif" font-size="14.5" font-weight="900" fill="#fbbf24">COMUNICACIÓN ASERTIVA Y PERSONALIZADA:</text>
      <text x="20" y="50" font-family="sans-serif" font-size="13" font-weight="600" fill="#f8fafc">1. Hablar en persona (Face to Face):</text>
      <text x="35" y="70" font-family="sans-serif" font-size="12.5" font-weight="500" fill="#cbd5e1">El Comandante sale a la cabina o sala VIP para informar.</text>
      <text x="20" y="94" font-family="sans-serif" font-size="13" font-weight="600" fill="#f8fafc">2. Lenguaje claro sin tecnicismos oscuros:</text>
      <text x="35" y="114" font-family="sans-serif" font-size="12.5" font-weight="500" fill="#cbd5e1">Explicar la causa con sencillez, transparencia y calma.</text>
      <text x="20" y="138" font-family="sans-serif" font-size="13" font-weight="700" fill="#fde68a">3. Marco en positivo:</text>
      <text x="35" y="156" font-family="sans-serif" font-size="12.5" font-style="italic" fill="#cbd5e1">"En cuanto tengamos ventana de seguridad, saldremos".</text>

      <!-- Proactive Dispatch Coordination -->
      <rect x="0" y="185" width="440" height="165" rx="8" fill="#78350f" fill-opacity="0.3" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="20" y="26" font-family="sans-serif" font-size="14.5" font-weight="900" fill="#fbbf24">PROACTIVIDAD TOTAL CON DISPATCH / OCC:</text>
      <text x="20" y="50" font-family="sans-serif" font-size="13" font-weight="500" fill="#cbd5e1">Nunca decir un simple "NO"; presentar soluciones de inmediato:</text>
      <text x="20" y="74" font-family="sans-serif" font-size="13" font-weight="700" fill="#fde68a">• Reposicionamiento de otra aeronave de la flota.</text>
      <text x="20" y="96" font-family="sans-serif" font-size="13" font-weight="700" fill="#fde68a">• Vuelo a aeropuerto alternativo cercano con traslado terrestre VIP.</text>
      <text x="20" y="118" font-family="sans-serif" font-size="13" font-weight="700" fill="#fde68a">• Reserva prioritaria en hotel premium o transporte exclusivo.</text>
      <text x="20" y="144" font-family="sans-serif" font-size="13" font-weight="900" fill="#34d399">El cliente percibe servicio de primera clase y total compromiso.</text>

      <!-- VIP Care & Comfort -->
      <rect x="0" y="365" width="440" height="140" rx="8" fill="#101a2b" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="20" y="26" font-family="sans-serif" font-size="14.5" font-weight="900" fill="#38bdf8">ATENCIÓN EN TIERRA DURANTE LA DEMORA:</text>
      <text x="20" y="50" font-family="sans-serif" font-size="13" font-weight="500" fill="#cbd5e1">• Ofrecer bebidas, catering a bordo o acceso a sala ejecutiva.</text>
      <text x="20" y="74" font-family="sans-serif" font-size="13" font-weight="500" fill="#cbd5e1">• Climatización confortable en cabina (con GPU/APU según proceda).</text>
      <text x="20" y="98" font-family="sans-serif" font-size="13" font-weight="700" fill="#38bdf8">• Actualizaciones informativas periódicas cada 15 a 20 minutos.</text>
      <text x="20" y="122" font-family="sans-serif" font-size="12.5" font-weight="500" fill="#cbd5e1">Mantener la certidumbre reduce drásticamente el estrés del pasajero.</text>
    </g>
  </g>

  <!-- Panel 3: Gradiente de Cabina & Modelo PACE -->
  <g transform="translate(1075, 305)">
    <rect width="485" height="585" rx="12" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="2" filter="url(#shadow)"/>
    <rect width="485" height="46" rx="12" fill="url(#purpleGrad)"/>
    <text x="242" y="30" font-family="sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">
      3. GRADIENTE ASISTIDO &amp; MODELO PACE
    </text>

    <g transform="translate(25, 65)">
      <!-- Step P -->
      <rect x="0" y="0" width="435" height="68" rx="8" fill="#101a2b" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="20" y="24" font-family="sans-serif" font-size="14" font-weight="900" fill="#38bdf8">P - PROBE (Sondeo Inicial):</text>
      <text x="20" y="48" font-family="sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">"¿Has comprobado el modo vertical activo en el FMA?"</text>

      <!-- Step A -->
      <rect x="0" y="78" width="435" height="68" rx="8" fill="#101a2b" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="20" y="24" font-family="sans-serif" font-size="14" font-weight="900" fill="#fbbf24">A - ALERT (Alerta Directa):</text>
      <text x="20" y="48" font-family="sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">"Estamos 15 nudos por encima de VREF, ajusta empuje"</text>

      <!-- Step C -->
      <rect x="0" y="156" width="435" height="68" rx="8" fill="#101a2b" stroke="#f97316" stroke-width="1.5"/>
      <text x="20" y="24" font-family="sans-serif" font-size="14" font-weight="900" fill="#fb923c">C - CHALLENGE (Desafío Asertivo):</text>
      <text x="20" y="48" font-family="sans-serif" font-size="13" font-weight="800" fill="#f8fafc">"Comandante, senda 1 punto por debajo, corrige inmediatamente"</text>

      <!-- Step E -->
      <rect x="0" y="234" width="435" height="72" rx="8" fill="rgba(220, 38, 38, 0.2)" stroke="#ef4444" stroke-width="1.5"/>
      <text x="20" y="24" font-family="sans-serif" font-size="14" font-weight="900" fill="#f87171">E - EMERGENCY (Orden Directa):</text>
      <text x="20" y="48" font-family="sans-serif" font-size="14" font-weight="900" fill="#fca5a5">"¡GO-AROUND MANDATORIO, APROXIMACIÓN NO ESTABILIZADA!"</text>

      <!-- Takeover Controls -->
      <rect x="0" y="316" width="435" height="190" rx="8" fill="#581c87" fill-opacity="0.3" stroke="#c084fc" stroke-width="1.5"/>
      <text x="20" y="26" font-family="sans-serif" font-size="14.5" font-weight="900" fill="#e9d5ff">ASUNCIÓN DE MANDOS (TAKEOVER):</text>
      <text x="20" y="50" font-family="sans-serif" font-size="13" font-weight="500" fill="#cbd5e1">Si tras el escalado PACE no hay respuesta o corrección eficaz:</text>
      <text x="20" y="76" font-family="sans-serif" font-size="15" font-weight="900" fill="#f0abfc">"I HAVE CONTROLS" + Palancas a TO/GA</text>
      <text x="20" y="102" font-family="sans-serif" font-size="13" font-weight="500" fill="#cbd5e1">• Criterio de Estabilización Obligatorio:</text>
      <text x="35" y="124" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#f8fafc">1.000 ft en IMC / 500 ft en VMC.</text>
      <text x="20" y="148" font-family="sans-serif" font-size="13" font-weight="800" fill="#fbbf24">Si no está 100% estabilizado ➔ Frustrada inmediata sin debate.</text>
    </g>
  </g>

  <!-- Bottom Detailed Rules & Legal Summary Panel -->
  <g transform="translate(40, 910)">
    <rect width="1520" height="205" rx="12" fill="#132035" stroke="#253856" stroke-width="1.5" filter="url(#shadow)"/>
    
    <text x="35" y="38" font-family="sans-serif" font-size="16" font-weight="900" fill="#38bdf8">
      MARCO JURÍDICO EUROPEO SOBRE LA AUTORIDAD DEL COMANDANTE (EASA AIR OPERATIONS):
    </text>

    <g transform="translate(35, 55)">
      <text x="0" y="20" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#f8fafc">
        • CAT.GEN.MPA.105 (a):
      </text>
      <text x="200" y="20" font-family="sans-serif" font-size="13.5" font-weight="500" fill="#cbd5e1">
        El Comandante será responsable de la seguridad de todos los miembros de la tripulación, los pasajeros y la carga a bordo desde el momento en que sube al avión hasta que lo abandona.
      </text>

      <text x="0" y="48" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#f8fafc">
        • CAT.GEN.MPA.105 (b):
      </text>
      <text x="200" y="48" font-family="sans-serif" font-size="13.5" font-weight="500" fill="#cbd5e1">
        El Comandante tendrá autoridad absoluta para dar todas las órdenes que considere necesarias para garantizar la seguridad de la aeronave y de las personas a bordo.
      </text>

      <text x="0" y="76" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#f8fafc">
        • CAT.GEN.MPA.105 (c):
      </text>
      <text x="200" y="76" font-family="sans-serif" font-size="13.5" font-weight="500" fill="#cbd5e1">
        El Comandante tendrá potestad para desembarcar a cualquier persona o carga que pueda representar un peligro potencial para la seguridad de la operación.
      </text>

      <text x="0" y="104" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#f8fafc">
        • Principio de Inmunidad:
      </text>
      <text x="180" y="104" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#fbbf24">
        Ningún operador aéreo podrá sancionar ni presionar a un Comandante por rechazar una operación contraria a la seguridad o normativa vigente.
      </text>
    </g>
  </g>
</svg>
