<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101d" />
      <stop offset="100%" stop-color="#152138" />
    </linearGradient>
    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a273e" />
      <stop offset="100%" stop-color="#0f1726" />
    </linearGradient>
    <linearGradient id="purpleGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>
    <linearGradient id="amberGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad3)" />

  <!-- Grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="135" x2="1200" y2="135" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="0" y1="405" x2="1200" y2="405" />
    <line x1="0" y1="540" x2="1200" y2="540" />
    <line x1="300" y1="0" x2="300" y2="675" />
    <line x1="600" y1="0" x2="600" y2="675" />
    <line x1="900" y1="0" x2="900" y2="675" />
  </g>

  <!-- Header -->
  <rect x="40" y="24" width="1120" height="74" rx="12" fill="#131d2e" stroke="#c084fc" stroke-opacity="0.4" stroke-width="1.5" />
  <text x="60" y="56" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" letter-spacing="1">PROTOCOLO CRM NETJETS: GESTIÓN DE PROPIETARIOS VIP Y LIDERAZGO</text>
  <text x="60" y="82" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500">EASA Part-CAT.GEN.MPA.105 · NetJets Pilot Core Values · Safety Leadership &amp; PACE Escalation</text>
  
  <rect x="980" y="38" width="160" height="46" rx="8" fill="#581c87" fill-opacity="0.5" stroke="#c084fc" stroke-width="1" />
  <text x="1060" y="66" fill="#f3e8ff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">OWNER MINDSET</text>

  <!-- 3 Big Panels -->
  
  <!-- PANEL 1: PILAR DE AUTORIDAD Y SEGURIDAD -->
  <g transform="translate(40, 115)">
    <rect width="355" height="525" rx="14" fill="url(#cardGrad3)" stroke="#ef4444" stroke-width="1.5" />
    <rect x="20" y="20" width="36" height="36" rx="8" fill="#ef4444" />
    <text x="38" y="44" fill="#ffffff" font-size="18" font-weight="800" text-anchor="middle">★</text>
    
    <text x="68" y="38" fill="#fca5a5" font-size="15" font-weight="800">1. SEGURIDAD NO NEGOCIABLE</text>
    <text x="68" y="54" fill="#94a3b8" font-size="11">Autoridad del Comandante (CAT.GEN.105)</text>

    <rect x="20" y="75" width="315" height="110" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="34" y="98" fill="#38bdf8" font-size="12" font-weight="700">Límites Legales Sagrados:</text>
    <text x="34" y="120" fill="#cbd5e1" font-size="11">• Mínimos Meteorológicos (AOM / LVO)</text>
    <text x="34" y="138" fill="#cbd5e1" font-size="11">• Límites de Actividad / Descanso (FTL)</text>
    <text x="34" y="156" fill="#cbd5e1" font-size="11">• Pesos Estructurales (MTOW / MLW / Perf)</text>
    <text x="34" y="174" fill="#cbd5e1" font-size="11">• Despacho Técnico de MEL / Inop Items</text>

    <rect x="20" y="200" width="315" height="140" rx="8" fill="#450a0a" fill-opacity="0.3" stroke="#ef4444" stroke-width="1" />
    <text x="34" y="224" fill="#f87171" font-size="12" font-weight="800">Presión Comercial / Propietario:</text>
    <text x="34" y="246" fill="#fca5a5" font-size="11" font-weight="600">"Tengo una reunión de 100M€"</text>
    <text x="34" y="266" fill="#cbd5e1" font-size="11">El Comandante NUNCA cede ante</text>
    <text x="34" y="282" fill="#cbd5e1" font-size="11">presiones de tiempo o estatus.</text>
    <text x="34" y="304" fill="#fca5a5" font-size="11" font-weight="700">La vida de los pasajeros y la</text>
    <text x="34" y="320" fill="#fca5a5" font-size="11" font-weight="700">tripulación es la prioridad absoluta.</text>

    <rect x="20" y="355" width="315" height="150" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="34" y="378" fill="#34d399" font-size="12" font-weight="700">Filosofía de Cultura Justa:</text>
    <text x="34" y="400" fill="#cbd5e1" font-size="11">NetJets respalda al 100% las</text>
    <text x="34" y="416" fill="#cbd5e1" font-size="11">decisiones de seguridad tomadas</text>
    <text x="34" y="432" fill="#cbd5e1" font-size="11">por sus Comandantes de acuerdo</text>
    <text x="34" y="448" fill="#cbd5e1" font-size="11">a normativa y buen juicio.</text>
    <text x="34" y="476" fill="#6ee7b7" font-size="11" font-weight="700">"Safety First, Always."</text>
  </g>

  <!-- PANEL 2: ATENCIÓN AL CLIENTE VIP Y EMPATÍA -->
  <g transform="translate(420, 115)">
    <rect width="355" height="525" rx="14" fill="url(#cardGrad3)" stroke="#f59e0b" stroke-width="1.5" />
    <rect x="20" y="20" width="36" height="36" rx="8" fill="url(#amberGrad2)" />
    <text x="38" y="44" fill="#ffffff" font-size="18" font-weight="800" text-anchor="middle">👤</text>
    
    <text x="68" y="38" fill="#fde68a" font-size="15" font-weight="800">2. EXCELENCIA Y EMPATÍA</text>
    <text x="68" y="54" fill="#94a3b8" font-size="11">Owner Mindset &amp; Soluciones Proactivas</text>

    <rect x="20" y="75" width="315" height="155" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="34" y="98" fill="#fbbf24" font-size="12" font-weight="700">Comunicación Asertiva y Serena:</text>
    <text x="34" y="118" fill="#cbd5e1" font-size="11">1. Ir a hablar personalmente (Face to Face).</text>
    <text x="34" y="136" fill="#cbd5e1" font-size="11">2. Lenguaje claro sin tecnicismos oscuros.</text>
    <text x="34" y="154" fill="#cbd5e1" font-size="11">3. Marco positivo:</text>
    <text x="44" y="174" fill="#fde68a" font-size="11" font-style="italic">"Nuestra prioridad es proteger su vida.</text>
    <text x="44" y="190" fill="#fde68a" font-size="11" font-style="italic">En cuanto tengamos ventana segura,</text>
    <text x="44" y="206" fill="#fde68a" font-size="11" font-style="italic">despegaremos de inmediato."</text>

    <rect x="20" y="245" width="315" height="145" rx="8" fill="#78350f" fill-opacity="0.3" stroke="#f59e0b" stroke-width="1" />
    <text x="34" y="268" fill="#fbbf24" font-size="12" font-weight="800">Proactividad con Dispatch:</text>
    <text x="34" y="290" fill="#cbd5e1" font-size="11">No decir simplemente "NO", sino</text>
    <text x="34" y="306" fill="#f8fafc" font-size="11" font-weight="700">presentar soluciones inmediatamente:</text>
    <text x="34" y="328" fill="#fde68a" font-size="11">• Reposicionar otro jet de NetJets</text>
    <text x="34" y="346" fill="#fde68a" font-size="11">• Desvío a aeropuerto cercano con sol</text>
    <text x="34" y="364" fill="#fde68a" font-size="11">• Transporte terrestre VIP / Hotel</text>

    <rect x="20" y="405" width="315" height="105" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="34" y="428" fill="#38bdf8" font-size="12" font-weight="700">Hospitalidad en Espera:</text>
    <text x="34" y="448" fill="#cbd5e1" font-size="11">Ofrecer bebidas, confort en sala VIP,</text>
    <text x="34" y="464" fill="#cbd5e1" font-size="11">mantener informado al cliente cada</text>
    <text x="34" y="480" fill="#cbd5e1" font-size="11">15-20 minutos con actualizaciones.</text>
  </g>

  <!-- PANEL 3: GRADIENTE DE CABINA & MODELO PACE -->
  <g transform="translate(800, 115)">
    <rect width="360" height="525" rx="14" fill="url(#cardGrad3)" stroke="#a855f7" stroke-width="1.5" />
    <rect x="20" y="20" width="36" height="36" rx="8" fill="url(#purpleGrad2)" />
    <text x="38" y="44" fill="#ffffff" font-size="18" font-weight="800" text-anchor="middle">⚡</text>
    
    <text x="68" y="38" fill="#e9d5ff" font-size="15" font-weight="800">3. GRADIENTE &amp; PACE</text>
    <text x="68" y="54" fill="#94a3b8" font-size="11">Escalada Asertiva en Cockpit</text>

    <!-- PACE STEPS -->
    <rect x="20" y="75" width="320" height="60" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1" />
    <text x="34" y="98" fill="#60a5fa" font-size="12" font-weight="800">P - PROBE (Sondeo):</text>
    <text x="34" y="118" fill="#cbd5e1" font-size="11">"¿Confirmas el modo vertical del FMA?"</text>

    <rect x="20" y="145" width="320" height="60" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1" />
    <text x="34" y="168" fill="#fbbf24" font-size="12" font-weight="800">A - ALERT (Alerta):</text>
    <text x="34" y="188" fill="#cbd5e1" font-size="11">"Estamos 15 nudos por encima de VREF"</text>

    <rect x="20" y="215" width="320" height="65" rx="8" fill="#0f172a" stroke="#f97316" stroke-width="1" />
    <text x="34" y="238" fill="#fb923c" font-size="12" font-weight="800">C - CHALLENGE (Desafío Asertivo):</text>
    <text x="34" y="258" fill="#cbd5e1" font-size="11">"Comandante, senda 1 punto baja, corrige"</text>

    <rect x="20" y="290" width="320" height="65" rx="8" fill="#450a0a" fill-opacity="0.3" stroke="#ef4444" stroke-width="1.2" />
    <text x="34" y="313" fill="#f87171" font-size="12" font-weight="800">E - EMERGENCY (Orden Directa):</text>
    <text x="34" y="333" fill="#fca5a5" font-size="11" font-weight="700">"¡GO-AROUND MANDATORIO!"</text>

    <rect x="20" y="365" width="320" height="145" rx="8" fill="#581c87" fill-opacity="0.3" stroke="#c084fc" stroke-width="1.2" />
    <text x="34" y="388" fill="#e9d5ff" font-size="12" font-weight="800">ASUNCIÓN DE MANDOS (TAKEOVER):</text>
    <text x="34" y="410" fill="#cbd5e1" font-size="11">Si no hay respuesta a la llamada:</text>
    <text x="34" y="432" fill="#f0abfc" font-size="12" font-weight="700">"I HAVE CONTROLS" + TO/GA</text>
    <text x="34" y="454" fill="#cbd5e1" font-size="11">Estabilización: 1.000 ft IMC / 500 ft VMC.</text>
    <text x="34" y="472" fill="#e9d5ff" font-size="11">Si no estabilizado -> Go-Around sin debate.</text>
  </g>
</svg>
