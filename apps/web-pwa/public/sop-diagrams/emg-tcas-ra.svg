<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1150" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c16"/>
      <stop offset="50%" stop-color="#0c1626"/>
      <stop offset="100%" stop-color="#050810"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#152238"/>
      <stop offset="100%" stop-color="#0f192b"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1600" height="1150" fill="url(#bgGrad)"/>

  <!-- Header Banner -->
  <g transform="translate(40, 25)">
    <rect width="1520" height="85" rx="12" fill="#132035" stroke="#253856" stroke-width="2" filter="url(#shadow)"/>
    <rect width="12" height="85" fill="url(#redGrad)" rx="3"/>
    
    <text x="35" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#f8fafc" letter-spacing="0.5">
      MANIOBRA TCAS RA (RESOLUTION ADVISORY)
    </text>
    <text x="35" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#38bdf8">
      Aviso Anticolisión de Tráfico • Binter MOB 3.1.8 &amp; SOPM Sec 3 • Fly-to-Zone en PFD
    </text>

    <rect x="1330" y="24" width="160" height="38" rx="8" fill="rgba(220, 38, 38, 0.2)" stroke="#ef4444" stroke-width="1.5"/>
    <text x="1410" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#f87171" text-anchor="middle">
      MEMORY ITEMS
    </text>
  </g>

  <!-- PFD Fly-to-Zone Visual Representation Banner with Binter Aircraft -->
  <g transform="translate(40, 130)">
    <rect width="1520" height="175" rx="12" fill="url(#cardGrad)" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
    
    <!-- PFD Variometer / VSI Scale Simulation -->
    <g transform="translate(80, 20)">
      <rect width="160" height="135" rx="8" fill="#080f1d" stroke="#334155"/>
      <text x="80" y="20" font-family="sans-serif" font-size="11.5" font-weight="800" fill="#94a3b8" text-anchor="middle">PFD VARIOMETER</text>
      
      <!-- Red Prohibited Zone -->
      <rect x="110" y="70" width="30" height="60" fill="rgba(220, 38, 38, 0.6)"/>
      <!-- Green Fly-to-Zone Trapeze -->
      <rect x="110" y="30" width="30" height="35" fill="#10b981"/>
      <text x="60" y="52" font-family="sans-serif" font-size="11.5" font-weight="800" fill="#34d399">FLY TO</text>
      <text x="60" y="66" font-family="sans-serif" font-size="10" font-weight="700" fill="#34d399">ZONE</text>
      <!-- Pointer -->
      <polygon points="105,48 95,43 95,53" fill="#ffffff"/>
    </g>

    <!-- Aircraft Trajectory Visual -->
    <g transform="translate(320, 20)">
      <!-- Intruder Aircraft (Red Diamond) -->
      <polygon points="450,110 460,95 470,110 460,125" fill="#ef4444" stroke="#ffffff" stroke-width="1.5"/>
      <text x="490" y="115" font-family="sans-serif" font-size="12" font-weight="800" fill="#f87171">TRÁFICO CONFLICTIVO (TRAFFIC)</text>
      
      <!-- Escape Arc -->
      <path d="M 50,110 Q 250,110 450,35" fill="none" stroke="#10b981" stroke-width="3.5" stroke-dasharray="6,3"/>
      
      <!-- Binter E195-E2 Climbing in Fly to Zone -->
      <g transform="translate(560, 65) rotate(-12) scale(0.65)">
<g id="realistic-e195-lateral">
  <!-- Fuselage Profile (Side View) -->
  <path d="M -170,4 C -170,0 -140,-8 -90,-9 L 110,-9 C 145,-9 175,-5 195,1 C 205,4 205,7 195,9 C 175,13 145,15 110,15 L -90,15 C -135,15 -160,11 -170,4 Z" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/>
  <!-- Nose Radome Cone -->
  <path d="M 185,-3 C 198,1 204,4 204,5 C 204,6 198,9 185,12 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <!-- Cockpit Windshield (4-panel E2 cockpit) -->
  <path d="M 160,-6 L 180,-4 L 183,1 L 162,0 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <!-- Passenger Windows (2-by-2 E-Jets cabin) -->
  <g fill="#1e293b" opacity="0.85">
    <rect x="-65" y="-3" width="3.5" height="5" rx="1.2"/>
    <rect x="-55" y="-3" width="3.5" height="5" rx="1.2"/>
    <rect x="-45" y="-3" width="3.5" height="5" rx="1.2"/>
    <rect x="-35" y="-3" width="3.5" height="5" rx="1.2"/>
    <rect x="-25" y="-3" width="3.5" height="5" rx="1.2"/>
    <rect x="-15" y="-3" width="3.5" height="5" rx="1.2"/>
    <rect x="-5" y="-3" width="3.5" height="5" rx="1.2"/>
    <rect x="5" y="-3" width="3.5" height="5" rx="1.2"/>
    <rect x="15" y="-3" width="3.5" height="5" rx="1.2"/>
    <rect x="25" y="-3" width="3.5" height="5" rx="1.2"/>
    <rect x="35" y="-3" width="3.5" height="5" rx="1.2"/>
    <rect x="45" y="-3" width="3.5" height="5" rx="1.2"/>
    <rect x="55" y="-3" width="3.5" height="5" rx="1.2"/>
    <rect x="65" y="-3" width="3.5" height="5" rx="1.2"/>
    <rect x="75" y="-3" width="3.5" height="5" rx="1.2"/>
    <rect x="85" y="-3" width="3.5" height="5" rx="1.2"/>
    <rect x="95" y="-3" width="3.5" height="5" rx="1.2"/>
    <rect x="105" y="-3" width="3.5" height="5" rx="1.2"/>
    <rect x="115" y="-3" width="3.5" height="5" rx="1.2"/>
    <rect x="125" y="-3" width="3.5" height="5" rx="1.2"/>
  </g>
  <!-- Passenger Doors -->
  <rect x="142" y="-4" width="7" height="15" rx="1.5" fill="none" stroke="#94a3b8" stroke-width="1"/>
  <rect x="-85" y="-4" width="7" height="15" rx="1.5" fill="none" stroke="#94a3b8" stroke-width="1"/>
  <!-- Binter Livery Dynamic Swoosh (Green & Blue) -->
  <path d="M -80,4 C -10,4 60,6 150,2 L 155,7 C 65,11 -5,9 -75,9 Z" fill="#059669"/>
  <path d="M -70,9 C 0,9 70,11 160,7 L 163,12 C 73,15 5,14 -65,14 Z" fill="#0284c7"/>
  <!-- Binter Green Tailfin (Vertical Stabilizer) -->
  <path d="M -115,-8 L -175,-72 L -140,-72 L -80,-8 Z" fill="#059669" stroke="#047857" stroke-width="1.2"/>
  <path d="M -155,-72 L -140,-72 L -85,-8 L -100,-8 Z" fill="#10b981"/>
  <path d="M -145,-72 L -140,-72 L -90,-8 L -95,-8 Z" fill="#0284c7"/>
  <!-- Horizontal Stabilizer Side Profile -->
  <path d="M -155,-60 L -185,-60 L -180,-55 L -150,-55 Z" fill="#cbd5e1"/>
  <!-- Main Wing Low Profile & Flap Fairings -->
  <path d="M 0,10 L 40,28 L 50,28 L 25,10 Z" fill="#cbd5e1" stroke="#64748b" stroke-width="1"/>
  <!-- PW1900G Geared Turbofan Engine (Side View) -->
  <!-- Pylon -->
  <path d="M 35,4 L 45,4 L 40,12 L 30,12 Z" fill="#64748b"/>
  <!-- Nacelle -->
  <path d="M 15,10 L 65,10 C 72,10 75,15 75,22 C 75,29 72,34 65,34 L 15,34 C 10,34 8,29 8,22 C 8,15 10,10 15,10 Z" fill="#f8fafc" stroke="#475569" stroke-width="1.2"/>
  <!-- Engine Intake Lip (Silver) -->
  <path d="M 62,10 C 68,10 72,14 72,22 C 72,30 68,34 62,34 Z" fill="#334155" stroke="#94a3b8" stroke-width="1"/>
  <!-- Exhaust Cone -->
  <path d="M 8,17 L 0,22 L 8,27 Z" fill="#1e293b"/>
  <!-- Binter Green Accent on Nacelle -->
  <path d="M 30,12 L 52,12 L 52,32 L 30,32 Z" fill="#059669"/>
  <!-- Nose & Main Landing Gear (optional / retracted or extended) -->
</g>
    </g>
      <text x="320" y="25" font-family="sans-serif" font-size="13" font-weight="800" fill="#34d399">TRAYECTORIA DE ESCAPE TCAS RA (0.25g / ≤5 seg)</text>
    </g>

    <!-- Rules Box -->
    <rect x="1100" y="20" width="380" height="135" rx="8" fill="#132035" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="1120" y="45" font-family="sans-serif" font-size="14" font-weight="800" fill="#fbbf24">PRIORIDAD ABSOLUTA TCAS:</text>
    <text x="1120" y="70" font-family="sans-serif" font-size="13" font-weight="600" fill="#fef08a">• Las órdenes del TCAS RA prevalecen</text>
    <text x="1120" y="90" font-family="sans-serif" font-size="13" font-weight="600" fill="#fef08a">sobre cualquier instrucción del ATC.</text>
    <text x="1120" y="112" font-family="sans-serif" font-size="12" font-weight="500" fill="#cbd5e1">• Seguir el trapecio verde con suavidad.</text>
  </g>

  <!-- 3 Main Columns: PF, PM, Conflicto Resuelto -->
  <g transform="translate(40, 325)">
    
    <!-- Col 1: Acciones PF -->
    <g transform="translate(0, 0)">
      <rect width="485" height="560" rx="12" fill="url(#cardGrad)" stroke="#ef4444" stroke-width="2" filter="url(#shadow)"/>
      <rect width="485" height="42" rx="12" fill="url(#redGrad)"/>
      <text x="242" y="27" font-family="sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">
        1. PILOT FLYING (PF) — INMEDIATO
      </text>

      <g transform="translate(20, 60)" font-family="sans-serif">
        <rect width="445" height="125" rx="8" fill="#18263e" stroke="#334155" stroke-width="1"/>
        <text x="20" y="28" font-size="15" font-weight="800" fill="#f87171">1. Desconexión de Piloto Automático</text>
        <text x="20" y="52" font-size="14" font-weight="700" fill="#38bdf8">PF CALLOUT: "MY CONTROLS"</text>
        <text x="20" y="74" font-size="13.5" font-weight="500" fill="#cbd5e1">• Desconectar AP y A/T en el yoke / palancas.</text>
        <text x="20" y="96" font-size="13.5" font-weight="500" fill="#cbd5e1">• Colocar manos firmes sobre los mandos.</text>
        <text x="20" y="116" font-size="12" font-weight="600" fill="#fbbf24">Tiempo de reacción objetivo: ≤ 5 segundos.</text>

        <g transform="translate(0, 140)">
          <rect width="445" height="135" rx="8" fill="#18263e" stroke="#10b981" stroke-width="1.5"/>
          <text x="20" y="28" font-size="15" font-weight="800" fill="#34d399">2. Volar al Trapecio Verde (Fly-to-Zone)</text>
          <text x="20" y="52" font-size="13.5" font-weight="500" fill="#e2e8f0">• Ajustar cabeceo suave al índice verde</text>
          <text x="20" y="74" font-size="13.5" font-weight="500" fill="#e2e8f0">del variómetro dentro de la franja verde del PFD.</text>
          <text x="20" y="98" font-size="13.5" font-weight="700" fill="#fbbf24">• Factor de carga estándar: ±0.25 g.</text>
          <text x="20" y="120" font-size="13" font-weight="500" fill="#cbd5e1">• Escanear tráfico exterior y pantalla TCAS.</text>
        </g>

        <g transform="translate(0, 290)">
          <rect width="445" height="110" rx="8" fill="#18263e" stroke="#334155" stroke-width="1"/>
          <text x="20" y="28" font-size="15" font-weight="800" fill="#38bdf8">3. Evitar Maniobras Bruscas</text>
          <text x="20" y="52" font-size="13.5" font-weight="500" fill="#cbd5e1">• Nunca sobrepasar el límite del trapecio verde.</text>
          <text x="20" y="74" font-size="13.5" font-weight="500" fill="#cbd5e1">• El TCAS calcula la trayectoria óptima con mínima</text>
          <text x="20" y="94" font-size="13.5" font-weight="500" fill="#cbd5e1">desviación de altitud respecto al plan.</text>
        </g>
      </g>
    </g>

    <!-- Col 2: Acciones PM -->
    <g transform="translate(515, 0)">
      <rect width="485" height="560" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)"/>
      <rect width="485" height="42" rx="12" fill="url(#blueGrad)"/>
      <text x="242" y="27" font-family="sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">
        2. PILOT MONITORING (PM)
      </text>

      <g transform="translate(20, 60)" font-family="sans-serif">
        <rect width="445" height="125" rx="8" fill="#18263e" stroke="#334155" stroke-width="1"/>
        <text x="20" y="28" font-size="15" font-weight="800" fill="#38bdf8">1. Luces Exteriores &amp; Cinturones</text>
        <text x="20" y="52" font-size="13.5" font-weight="700" fill="#ffffff">• TURN ON ALL EXTERNAL LIGHTS:</text>
        <text x="35" y="72" font-size="13" font-weight="500" fill="#cbd5e1">Landing, Taxi, Strobe, Logo y Wing Lights.</text>
        <text x="20" y="94" font-size="13.5" font-weight="700" fill="#fbbf24">• FSTN BELTS SWITCH: ON</text>
        <text x="20" y="114" font-size="13" font-weight="600" fill="#34d399">• STERIL LIGHT SWITCH: ON</text>

        <g transform="translate(0, 140)">
          <rect width="445" height="135" rx="8" fill="#18263e" stroke="#0284c7" stroke-width="1.5"/>
          <text x="20" y="28" font-size="15" font-weight="800" fill="#38bdf8">2. Llamada Radiotelefónica a ATC</text>
          <text x="20" y="52" font-size="13.5" font-weight="500" fill="#cbd5e1">Transmitir inmediatamente por la frecuencia:</text>
          <text x="20" y="78" font-size="14.5" font-weight="900" fill="#fbbf24">"[Callsign], TCAS RA"</text>
          <text x="20" y="102" font-size="13" font-weight="500" fill="#cbd5e1">• Informa al controlador de que se abandona la</text>
          <text x="20" y="122" font-size="13" font-weight="500" fill="#cbd5e1">autorización por orden directa del sistema TCAS.</text>
        </g>

        <g transform="translate(0, 290)">
          <rect width="445" height="110" rx="8" fill="#18263e" stroke="#334155" stroke-width="1"/>
          <text x="20" y="28" font-size="15" font-weight="800" fill="#38bdf8">3. Monitoreo Activo</text>
          <text x="20" y="52" font-size="13.5" font-weight="500" fill="#cbd5e1">• Verificar que el PF sigue fielmente el trapecio verde.</text>
          <text x="20" y="74" font-size="13.5" font-weight="500" fill="#cbd5e1">• Escanear tráfico exterior y en pantalla.</text>
          <text x="20" y="94" font-size="13.5" font-weight="500" fill="#cbd5e1">• Estar atentos a avisos de inversión (Reversal RA).</text>
        </g>
      </g>
    </g>

    <!-- Col 3: Clear of Conflict & Retorno -->
    <g transform="translate(1030, 0)">
      <rect width="490" height="560" rx="12" fill="url(#cardGrad)" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
      <rect width="490" height="42" rx="12" fill="url(#greenGrad)"/>
      <text x="245" y="27" font-family="sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">
        3. RESOLUCIÓN &amp; RETORNO
      </text>

      <g transform="translate(20, 60)" font-family="sans-serif">
        <rect width="450" height="125" rx="8" fill="#18263e" stroke="#334155" stroke-width="1"/>
        <text x="20" y="28" font-size="15" font-weight="800" fill="#34d399">Alarma Auditiva: "CLEAR OF CONFLICT"</text>
        <text x="20" y="52" font-size="13.5" font-weight="500" fill="#e2e8f0">• El conflicto de tráfico ha quedado solventado.</text>
        <text x="20" y="74" font-size="13.5" font-weight="500" fill="#e2e8f0">• Reducir cabeceo suavemente.</text>
        <text x="20" y="96" font-size="13.5" font-weight="700" fill="#38bdf8">• Regresar a la última altitud asignada por ATC</text>
        <text x="20" y="116" font-size="12.5" font-weight="500" fill="#cbd5e1">o nivel de vuelo previamente autorizado.</text>

        <g transform="translate(0, 140)">
          <rect width="450" height="135" rx="8" fill="#18263e" stroke="#10b981" stroke-width="1.5"/>
          <text x="20" y="28" font-size="15" font-weight="800" fill="#34d399">Llamada ATC de Finalización</text>
          <text x="20" y="52" font-size="13" font-weight="500" fill="#cbd5e1">Transmitir inmediatamente a control:</text>
          <text x="20" y="78" font-size="13.5" font-weight="900" fill="#34d399">"[Callsign], CLEAR OF CONFLICT,</text>
          <text x="20" y="98" font-size="13.5" font-weight="900" fill="#34d399">RETURNING TO [ALTITUDE / FL]"</text>
          <text x="20" y="122" font-size="12.5" font-weight="500" fill="#cbd5e1">Control reanuda la responsabilidad de separación.</text>
        </g>

        <g transform="translate(0, 290)">
          <rect width="450" height="110" rx="8" fill="#18263e" stroke="#334155" stroke-width="1"/>
          <text x="20" y="28" font-size="15" font-weight="800" fill="#38bdf8">Reconexión de Sistemas &amp; ASR</text>
          <text x="20" y="52" font-size="13.5" font-weight="500" fill="#cbd5e1">• Reconectar Piloto Automático y Autothrottle.</text>
          <text x="20" y="74" font-size="13.5" font-weight="500" fill="#cbd5e1">• Restablecer luces de navegación normales.</text>
          <text x="20" y="94" font-size="13.5" font-weight="700" fill="#fbbf24">• Rellenar ASR / Reporte TCAS tras el vuelo.</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Bottom Bar -->
  <g transform="translate(40, 1010)">
    <rect width="1520" height="110" rx="12" fill="#132035" stroke="#253856" stroke-width="2" filter="url(#shadow)"/>
    <text x="30" y="36" font-family="sans-serif" font-size="16" font-weight="800" fill="#38bdf8">
      REGLAS CRÍTICAS DE TCAS II VERSIÓN 7.1:
    </text>
    <text x="30" y="65" font-family="sans-serif" font-size="14" font-weight="500" fill="#cbd5e1">
      • Si el TCAS emite una alarma inversa ("CLIMB, CLIMB NOW" o "LEVEL OFF, LEVEL OFF"), responder de inmediato en ≤ 2.5 segundos.
    </text>
    <text x="30" y="90" font-family="sans-serif" font-size="14" font-weight="500" fill="#cbd5e1">
      • Queda terminantemente prohibido maniobrar en sentido contrario a la orden del TCAS RA.
    </text>
  </g>
</svg>
