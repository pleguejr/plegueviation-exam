<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1150" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c16"/>
      <stop offset="50%" stop-color="#0c1626"/>
      <stop offset="100%" stop-color="#050810"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#152238"/>
      <stop offset="100%" stop-color="#0f192b"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1600" height="1150" fill="url(#bgGrad)"/>

  <!-- Header Banner -->
  <g transform="translate(40, 25)">
    <rect width="1520" height="85" rx="12" fill="#132035" stroke="#253856" stroke-width="2" filter="url(#shadow)"/>
    <rect width="12" height="85" fill="url(#redGrad)" rx="3"/>
    
    <text x="35" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#f8fafc" letter-spacing="0.5">
      MANIOBRA WINDSHEAR (CIZALLADURA DE VIENTO)
    </text>
    <text x="35" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#38bdf8">
      Escape Guidance (WSHR) • Binter MOB 3.1.9 &amp; SOPM Sec 3 • Empuje FADEC RSV • Embraer 195-E2
    </text>

    <rect x="1330" y="24" width="160" height="38" rx="8" fill="rgba(220, 38, 38, 0.2)" stroke="#ef4444" stroke-width="1.5"/>
    <text x="1410" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#f87171" text-anchor="middle">
      MODO WSHR
    </text>
  </g>

  <!-- Visual Microburst & Escape Flight Profile with Binter Aircraft -->
  <g transform="translate(40, 130)">
    <rect width="1520" height="175" rx="12" fill="url(#cardGrad)" stroke="#ef4444" stroke-width="1.5" filter="url(#shadow)"/>
    
    <!-- Microburst Vortex / Wind Vectors -->
    <g stroke="rgba(239, 68, 68, 0.4)" stroke-width="2" fill="none">
      <path d="M 450,15 Q 520,70 600,140"/>
      <path d="M 520,15 Q 600,80 680,140"/>
      <path d="M 680,140 Q 760,80 840,15"/>
      <path d="M 600,140 Q 680,80 760,15"/>
    </g>
    <text x="640" y="40" font-family="sans-serif" font-size="13" font-weight="800" fill="#f87171" text-anchor="middle">MICROBURST / DOWNDRAFT</text>

    <!-- Normal Approach / Takeoff Path -->
    <line x1="80" y1="120" x2="350" y2="120" stroke="#94a3b8" stroke-width="2"/>
    <text x="180" y="110" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#94a3b8" text-anchor="middle">Aproximación / Despegue</text>

    <!-- Escape Trajectory in Windshear Mode -->
    <path d="M 350,120 Q 550,135 750,55 L 1050,25" fill="none" stroke="#22c55e" stroke-width="3.5" stroke-dasharray="6,3"/>

    <!-- Aircraft Climbing at 15° Pitch towards PLI (Binter E195-E2) -->
    <g transform="translate(560, 65) rotate(15) scale(0.65)">
<g id="realistic-e195-lateral">
  <!-- Fuselage Profile (Side View) -->
  <path d="M -170,4 C -170,0 -140,-8 -90,-9 L 110,-9 C 145,-9 175,-5 195,1 C 205,4 205,7 195,9 C 175,13 145,15 110,15 L -90,15 C -135,15 -160,11 -170,4 Z" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/>
  <!-- Nose Radome Cone -->
  <path d="M 185,-3 C 198,1 204,4 204,5 C 204,6 198,9 185,12 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <!-- Cockpit Windshield (4-panel E2 cockpit) -->
  <path d="M 160,-6 L 180,-4 L 183,1 L 162,0 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <!-- Passenger Windows (2-by-2 E-Jets cabin) -->
  <g fill="#1e293b" opacity="0.85">
    <rect x="-65" y="-3" width="3.5" height="5" rx="1.2"/>
    <rect x="-55" y="-3" width="3.5" height="5" rx="1.2"/>
    <rect x="-45" y="-3" width="3.5" height="5" rx="1.2"/>
    <rect x="-35" y="-3" width="3.5" height="5" rx="1.2"/>
    <rect x="-25" y="-3" width="3.5" height="5" rx="1.2"/>
    <rect x="-15" y="-3" width="3.5" height="5" rx="1.2"/>
    <rect x="-5" y="-3" width="3.5" height="5" rx="1.2"/>
    <rect x="5" y="-3" width="3.5" height="5" rx="1.2"/>
    <rect x="15" y="-3" width="3.5" height="5" rx="1.2"/>
    <rect x="25" y="-3" width="3.5" height="5" rx="1.2"/>
    <rect x="35" y="-3" width="3.5" height="5" rx="1.2"/>
    <rect x="45" y="-3" width="3.5" height="5" rx="1.2"/>
    <rect x="55" y="-3" width="3.5" height="5" rx="1.2"/>
    <rect x="65" y="-3" width="3.5" height="5" rx="1.2"/>
    <rect x="75" y="-3" width="3.5" height="5" rx="1.2"/>
    <rect x="85" y="-3" width="3.5" height="5" rx="1.2"/>
    <rect x="95" y="-3" width="3.5" height="5" rx="1.2"/>
    <rect x="105" y="-3" width="3.5" height="5" rx="1.2"/>
    <rect x="115" y="-3" width="3.5" height="5" rx="1.2"/>
    <rect x="125" y="-3" width="3.5" height="5" rx="1.2"/>
  </g>
  <!-- Passenger Doors -->
  <rect x="142" y="-4" width="7" height="15" rx="1.5" fill="none" stroke="#94a3b8" stroke-width="1"/>
  <rect x="-85" y="-4" width="7" height="15" rx="1.5" fill="none" stroke="#94a3b8" stroke-width="1"/>
  <!-- Binter Livery Dynamic Swoosh (Green & Blue) -->
  <path d="M -80,4 C -10,4 60,6 150,2 L 155,7 C 65,11 -5,9 -75,9 Z" fill="#059669"/>
  <path d="M -70,9 C 0,9 70,11 160,7 L 163,12 C 73,15 5,14 -65,14 Z" fill="#0284c7"/>
  <!-- Binter Green Tailfin (Vertical Stabilizer) -->
  <path d="M -115,-8 L -175,-72 L -140,-72 L -80,-8 Z" fill="#059669" stroke="#047857" stroke-width="1.2"/>
  <path d="M -155,-72 L -140,-72 L -85,-8 L -100,-8 Z" fill="#10b981"/>
  <path d="M -145,-72 L -140,-72 L -90,-8 L -95,-8 Z" fill="#0284c7"/>
  <!-- Horizontal Stabilizer Side Profile -->
  <path d="M -155,-60 L -185,-60 L -180,-55 L -150,-55 Z" fill="#cbd5e1"/>
  <!-- Main Wing Low Profile & Flap Fairings -->
  <path d="M 0,10 L 40,28 L 50,28 L 25,10 Z" fill="#cbd5e1" stroke="#64748b" stroke-width="1"/>
  <!-- PW1900G Geared Turbofan Engine (Side View) -->
  <!-- Pylon -->
  <path d="M 35,4 L 45,4 L 40,12 L 30,12 Z" fill="#64748b"/>
  <!-- Nacelle -->
  <path d="M 15,10 L 65,10 C 72,10 75,15 75,22 C 75,29 72,34 65,34 L 15,34 C 10,34 8,29 8,22 C 8,15 10,10 15,10 Z" fill="#f8fafc" stroke="#475569" stroke-width="1.2"/>
  <!-- Engine Intake Lip (Silver) -->
  <path d="M 62,10 C 68,10 72,14 72,22 C 72,30 68,34 62,34 Z" fill="#334155" stroke="#94a3b8" stroke-width="1"/>
  <!-- Exhaust Cone -->
  <path d="M 8,17 L 0,22 L 8,27 Z" fill="#1e293b"/>
  <!-- Binter Green Accent on Nacelle -->
  <path d="M 30,12 L 52,12 L 52,32 L 30,32 Z" fill="#059669"/>
  <!-- Nose & Main Landing Gear (optional / retracted or extended) -->
</g>
    </g>
    <text x="760" y="50" font-family="sans-serif" font-size="13.5" font-weight="900" fill="#34d399">PITCH 15° NOSE UP / PLI</text>

    <!-- Overlay Callout Badges -->
    <rect x="1100" y="25" width="380" height="125" rx="8" fill="rgba(220, 38, 38, 0.25)" stroke="#ef4444" stroke-width="1.5"/>
    <text x="1120" y="52" font-family="sans-serif" font-size="14.5" font-weight="900" fill="#f87171">¡PROHIBIDO CAMBIAR CONFIGURACIÓN!</text>
    <text x="1120" y="76" font-family="sans-serif" font-size="13" font-weight="600" fill="#fecaca">• NO retraer ni subir el tren de aterrizaje</text>
    <text x="1120" y="96" font-family="sans-serif" font-size="13" font-weight="600" fill="#fecaca">• NO mover ni retractar flaps</text>
    <text x="1120" y="118" font-family="sans-serif" font-size="12" font-weight="500" fill="#cbd5e1">Evita pérdidas transitorias de sustentación.</text>
  </g>

  <!-- 3 Main Columns: Alertas, Escape, Salida Modo -->
  <g transform="translate(40, 325)">
    
    <!-- Col 1: Alertas Predictivas vs Reactivas -->
    <g transform="translate(0, 0)">
      <rect width="485" height="560" rx="12" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
      <rect width="485" height="42" rx="12" fill="url(#goldGrad)"/>
      <text x="242" y="27" font-family="sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">
        1. ALERTAS PREDICTIVAS vs REACTIVAS
      </text>

      <g transform="translate(20, 60)" font-family="sans-serif">
        <rect width="445" height="130" rx="8" fill="#18263e" stroke="#334155" stroke-width="1"/>
        <text x="20" y="28" font-size="15" font-weight="800" fill="#fbbf24">Predictiva en Despegue (Radar)</text>
        <text x="20" y="52" font-size="13.5" font-weight="700" fill="#f87171">• Alarma Roja: "WINDSHEAR AHEAD x2"</text>
        <text x="20" y="74" font-size="13" font-weight="500" fill="#cbd5e1">No iniciar carrera de despegue / Abortar &lt; V1.</text>
        <text x="20" y="98" font-size="13.5" font-weight="700" fill="#fbbf24">• Precaución Ámbar: "MONITOR RADAR DISPLAY"</text>
        <text x="20" y="118" font-size="13" font-weight="500" fill="#cbd5e1">Demorar salida y evaluar células convectivas.</text>

        <g transform="translate(0, 145)">
          <rect width="445" height="115" rx="8" fill="#18263e" stroke="#334155" stroke-width="1"/>
          <text x="20" y="28" font-size="15" font-weight="800" fill="#fbbf24">Predictiva en Aproximación</text>
          <text x="20" y="52" font-size="13.5" font-weight="700" fill="#f87171">• "GO AROUND, WINDSHEAR AHEAD"</text>
          <text x="20" y="74" font-size="13.5" font-weight="500" fill="#cbd5e1">Ejecutar frustrada inmediata normal antes de</text>
          <text x="20" y="96" font-size="13.5" font-weight="500" fill="#cbd5e1">penetrar en el núcleo de la cizalladura.</text>
        </g>

        <g transform="translate(0, 275)">
          <rect width="445" height="125" rx="8" fill="rgba(220, 38, 38, 0.2)" stroke="#ef4444" stroke-width="1.5"/>
          <text x="20" y="28" font-size="15" font-weight="800" fill="#f87171">Reactiva en Vuelo (Sistema WSHR)</text>
          <text x="20" y="52" font-size="14" font-weight="900" fill="#ffffff">"WINDSHEAR, WINDSHEAR, WINDSHEAR"</text>
          <text x="20" y="76" font-size="13" font-weight="500" fill="#fecaca">Guía de escape activa de 10 a 1.500 ft AGL.</text>
          <text x="20" y="98" font-size="13" font-weight="700" fill="#facc15">➔ ¡EJECUTAR MANIOBRA DE ESCAPE INMEDIATA!</text>
        </g>
      </g>
    </g>

    <!-- Col 2: Maniobra de Escape -->
    <g transform="translate(515, 0)">
      <rect width="485" height="560" rx="12" fill="url(#cardGrad)" stroke="#ef4444" stroke-width="2" filter="url(#shadow)"/>
      <rect width="485" height="42" rx="12" fill="url(#redGrad)"/>
      <text x="242" y="27" font-family="sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">
        2. MANIOBRA DE ESCAPE (PF / PM)
      </text>

      <g transform="translate(20, 60)" font-family="sans-serif">
        <rect width="445" height="135" rx="8" fill="#18263e" stroke="#334155" stroke-width="1"/>
        <text x="20" y="28" font-size="15" font-weight="800" fill="#f87171">1. Empuje Máximo &amp; TO/GA</text>
        <text x="20" y="52" font-size="14" font-weight="900" fill="#ffffff">PF: "WINDSHEAR" ➔ PM: "MAX"</text>
        <text x="20" y="74" font-size="13.5" font-weight="500" fill="#cbd5e1">• Palancas al tope máximo: <tspan font-weight="800" fill="#38bdf8">MAX DETENT</tspan>.</text>
        <text x="20" y="96" font-size="13.5" font-weight="500" fill="#cbd5e1">• Pulsar botón <tspan font-weight="700" fill="#ffffff">TO/GA</tspan> en las palancas.</text>
        <text x="20" y="118" font-size="13" font-weight="700" fill="#34d399">• FADEC entrega automáticamente GO/AROUND RSV.</text>

        <g transform="translate(0, 150)">
          <rect width="445" height="135" rx="8" fill="#18263e" stroke="#10b981" stroke-width="1.5"/>
          <text x="20" y="28" font-size="15" font-weight="800" fill="#34d399">2. Cabeceo de Máximo Ascenso</text>
          <text x="20" y="52" font-size="13.5" font-weight="500" fill="#e2e8f0">• Nivelar planos (Wings level).</text>
          <text x="20" y="74" font-size="13.5" font-weight="500" fill="#e2e8f0">• Seguir la barra del Flight Director en modo WSHR</text>
          <text x="20" y="96" font-size="13.5" font-weight="700" fill="#facc15">o tirar a 15° cabeceo respetando el PLI.</text>
          <text x="20" y="118" font-size="12.5" font-weight="500" fill="#cbd5e1">(Pitch Limit Indicator / límite de pérdida).</text>
        </g>

        <g transform="translate(0, 300)">
          <rect width="445" height="100" rx="8" fill="#18263e" stroke="#334155" stroke-width="1"/>
          <text x="20" y="28" font-size="15" font-weight="800" fill="#38bdf8">3. Monitoreo Activo PM</text>
          <text x="20" y="52" font-size="13.5" font-weight="500" fill="#cbd5e1">• Verificar empuje máximo de reserva en EICAS.</text>
          <text x="20" y="74" font-size="13.5" font-weight="500" fill="#cbd5e1">• Cantar altitud y régimen de variómetro.</text>
        </g>
      </g>
    </g>

    <!-- Col 3: Salida del Modo WSHR -->
    <g transform="translate(1030, 0)">
      <rect width="490" height="560" rx="12" fill="url(#cardGrad)" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
      <rect width="490" height="42" rx="12" fill="url(#greenGrad)"/>
      <text x="245" y="27" font-family="sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">
        3. SALIDA &amp; RECUPERACIÓN
      </text>

      <g transform="translate(20, 60)" font-family="sans-serif">
        <rect width="450" height="135" rx="8" fill="#18263e" stroke="#334155" stroke-width="1"/>
        <text x="20" y="28" font-size="15" font-weight="800" fill="#34d399">Superados 1.500 FT AGL y Libre</text>
        <text x="20" y="52" font-size="13.5" font-weight="500" fill="#e2e8f0">• Retrasar palancas suavemente a <tspan font-weight="700" fill="#ffffff">TO/GA</tspan>.</text>
        <text x="20" y="74" font-size="13.5" font-weight="500" fill="#e2e8f0">• Pulsar botón TO/GA para salir del modo WSHR.</text>
        <text x="20" y="98" font-size="13.5" font-weight="700" fill="#38bdf8">• Seleccionar modo vertical manual (FLCH / HDG).</text>
        <text x="20" y="118" font-size="13" font-weight="500" fill="#cbd5e1">• Conectar Piloto Automático al estabilizar.</text>

        <g transform="translate(0, 150)">
          <rect width="450" height="135" rx="8" fill="#18263e" stroke="#10b981" stroke-width="1.5"/>
          <text x="20" y="28" font-size="15" font-weight="800" fill="#34d399">Secuencia de Ascenso Frustrado</text>
          <text x="20" y="52" font-size="13.5" font-weight="700" fill="#ffffff">PF: "GO AROUND, FLAP 2 (4)"</text>
          <text x="20" y="74" font-size="13.5" font-weight="700" fill="#38bdf8">PM: "POSITIVE RATE"</text>
          <text x="20" y="96" font-size="13.5" font-weight="700" fill="#ffffff">PF: "GEAR UP"</text>
          <text x="20" y="118" font-size="13" font-weight="500" fill="#cbd5e1">• Acelerar a VFS y continuar a altitud segura.</text>
        </g>

        <g transform="translate(0, 300)">
          <rect width="450" height="100" rx="8" fill="#18263e" stroke="#334155" stroke-width="1"/>
          <text x="20" y="28" font-size="15" font-weight="800" fill="#fbbf24">Acciones Posteriores al Vuelo</text>
          <text x="20" y="52" font-size="13.5" font-weight="500" fill="#cbd5e1">• Notificar a ATC condiciones de cizalladura en pista.</text>
          <text x="20" y="74" font-size="13.5" font-weight="500" fill="#cbd5e1">• Rellenar ASR / Reporte de Cizalladura obligatorio.</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Bottom Bar -->
  <g transform="translate(40, 1010)">
    <rect width="1520" height="110" rx="12" fill="#132035" stroke="#253856" stroke-width="2" filter="url(#shadow)"/>
    <text x="30" y="36" font-family="sans-serif" font-size="16" font-weight="800" fill="#38bdf8">
      SISTEMA FADEC EN EL EMBRAER 195-E2 DURANTE WINDSHEAR:
    </text>
    <text x="30" y="65" font-family="sans-serif" font-size="14" font-weight="500" fill="#cbd5e1">
      • Al accionar MAX DETENT, el FADEC cancela cualquier reducción previa (FLEX/DERATE) y suministra el 100% de empuje de reserva de los dos motores PW1900G.
    </text>
    <text x="30" y="90" font-family="sans-serif" font-size="14" font-weight="500" fill="#cbd5e1">
      • Si salta el Stick Shaker (vibrador de palanca), aflojar suavemente el cabeceo hasta librar la vibración manteniendo el máximo ascenso posible.
    </text>
  </g>
</svg>
