<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#18233c" />
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e2c44" />
      <stop offset="100%" stop-color="#121b2c" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad2)" />

  <!-- Grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="135" x2="1200" y2="135" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="0" y1="405" x2="1200" y2="405" />
    <line x1="0" y1="540" x2="1200" y2="540" />
    <line x1="300" y1="0" x2="300" y2="675" />
    <line x1="600" y1="0" x2="600" y2="675" />
    <line x1="900" y1="0" x2="900" y2="675" />
  </g>

  <!-- Title Header -->
  <rect x="40" y="24" width="1120" height="74" rx="12" fill="#131d2e" stroke="#60a5fa" stroke-opacity="0.4" stroke-width="1.5" />
  <text x="60" y="56" fill="#60a5fa" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" letter-spacing="1">OPERACIÓN RVSM, COTEJO ALTIMÉTRICO Y PROCEDIMIENTOS DE CONTINGENCIA</text>
  <text x="60" y="82" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500">EASA Part-SPA.RVSM.100 / 110 · ICAO Doc 9574 / 7030 · NetJets Fleet Operations</text>
  
  <rect x="990" y="38" width="150" height="46" rx="8" fill="#1e3a8a" fill-opacity="0.6" stroke="#60a5fa" stroke-width="1" />
  <text x="1065" y="66" fill="#bfdbfe" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">FL290 — FL410</text>

  <!-- 4 Big Columns / Cards -->
  
  <!-- CARD 1: 4 EQUIPOS RVSM OBLIGATORIOS -->
  <g transform="translate(40, 115)">
    <rect width="265" height="525" rx="14" fill="url(#cardGrad2)" stroke="#3b82f6" stroke-width="1.5" />
    <rect x="18" y="18" width="34" height="34" rx="8" fill="url(#blueGrad)" />
    <text x="35" y="41" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="800" text-anchor="middle">1</text>
    
    <text x="60" y="36" fill="#93c5fd" font-size="14" font-weight="800">4 EQUIPOS RVSM</text>
    <text x="60" y="52" fill="#94a3b8" font-size="11">Requisitos de Aeronave</text>

    <!-- 4 Sub items -->
    <rect x="18" y="75" width="229" height="95" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="30" y="98" fill="#38bdf8" font-size="12" font-weight="700">1. Dos Altímetros Primarios</text>
    <text x="30" y="118" fill="#cbd5e1" font-size="11">Independientes (ADC1 y ADC2)</text>
    <text x="30" y="134" fill="#94a3b8" font-size="10">Error en tierra: ≤ ±50-75 ft</text>
    <text x="30" y="150" fill="#94a3b8" font-size="10">Error en vuelo: ≤ 200 ft</text>

    <rect x="18" y="180" width="229" height="75" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="30" y="203" fill="#38bdf8" font-size="12" font-weight="700">2. Sistema de Piloto Aut.</text>
    <text x="30" y="223" fill="#cbd5e1" font-size="11">Con modo de mantenimiento</text>
    <text x="30" y="239" fill="#94a3b8" font-size="10">de altitud (Altitude Hold ±65 ft)</text>

    <rect x="18" y="265" width="229" height="75" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="30" y="288" fill="#38bdf8" font-size="12" font-weight="700">3. Alerta de Altitud</text>
    <text x="30" y="308" fill="#cbd5e1" font-size="11">Aviso visual/acústico ante</text>
    <text x="30" y="324" fill="#94a3b8" font-size="10">desviaciones (&gt;200-300 ft)</text>

    <rect x="18" y="350" width="229" height="75" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="30" y="373" fill="#38bdf8" font-size="12" font-weight="700">4. Transponder SSR / ADS-B</text>
    <text x="30" y="393" fill="#cbd5e1" font-size="11">Con reporte de altitud (Modo C/S)</text>
    <text x="30" y="409" fill="#94a3b8" font-size="10">conectado al altímetro activo</text>

    <rect x="18" y="435" width="229" height="75" rx="8" fill="#1e3a8a" fill-opacity="0.3" stroke="#3b82f6" stroke-width="1" />
    <text x="30" y="458" fill="#93c5fd" font-size="11" font-weight="700">Separación RVSM:</text>
    <text x="30" y="476" fill="#e2e8f0" font-size="13" font-weight="800">1.000 FT VERTICAL</text>
    <text x="30" y="494" fill="#94a3b8" font-size="10">(vs 2.000 ft en no-RVSM)</text>
  </g>

  <!-- CARD 2: COTEJO ALTIMÉTRICO & TOLERANCIAS -->
  <g transform="translate(325, 115)">
    <rect width="265" height="525" rx="14" fill="url(#cardGrad2)" stroke="#10b981" stroke-width="1.5" />
    <rect x="18" y="18" width="34" height="34" rx="8" fill="url(#emeraldGrad)" />
    <text x="35" y="41" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="800" text-anchor="middle">2</text>
    
    <text x="60" y="36" fill="#6ee7b7" font-size="14" font-weight="800">COTEJO ALTIMÉTRICO</text>
    <text x="60" y="52" fill="#94a3b8" font-size="11">Tolerancias de Vuelo</text>

    <rect x="18" y="75" width="229" height="130" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1" />
    <text x="30" y="98" fill="#34d399" font-size="12" font-weight="700">En Tierra (QNH Local):</text>
    <text x="30" y="118" fill="#cbd5e1" font-size="11">Altímetros vs Elevación:</text>
    <text x="30" y="136" fill="#a7f3d0" font-size="13" font-weight="800">Máx. ±50 ft a ±75 ft</text>
    <text x="30" y="156" fill="#cbd5e1" font-size="11">Diferencia entre ambos:</text>
    <text x="30" y="174" fill="#a7f3d0" font-size="13" font-weight="800">Máx. ≤ 50 ft</text>

    <rect x="18" y="215" width="229" height="140" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1" />
    <text x="30" y="238" fill="#34d399" font-size="12" font-weight="700">En Vuelo (Crucero STD):</text>
    <text x="30" y="258" fill="#cbd5e1" font-size="11">Chequeo periódico (cada hora):</text>
    <text x="30" y="278" fill="#a7f3d0" font-size="14" font-weight="800">DIFERENCIA ≤ 200 FT</text>
    <text x="30" y="298" fill="#94a3b8" font-size="11">Entre Altímetro 1 (CMD) y</text>
    <text x="30" y="314" fill="#94a3b8" font-size="11">Altímetro 2 (FO).</text>
    <text x="30" y="336" fill="#fca5a5" font-size="10">Si &gt; 200 ft: ¡Fallo RVSM!</text>

    <rect x="18" y="365" width="229" height="145" rx="8" fill="#064e3b" fill-opacity="0.3" stroke="#10b981" stroke-width="1" />
    <text x="30" y="390" fill="#34d399" font-size="12" font-weight="700">Transición Altimétrica:</text>
    <text x="30" y="412" fill="#cbd5e1" font-size="11">Al cruzar la TA (Transition Alt):</text>
    <text x="30" y="432" fill="#f8fafc" font-size="12" font-weight="700">Fijar Standard 1013.2 hPa</text>
    <text x="30" y="450" fill="#cbd5e1" font-size="11">/ 29.92 inHg simultáneamente.</text>
    <text x="30" y="472" fill="#34d399" font-size="11" font-weight="700">Crosscheck "STANDARD SET"</text>
  </g>

  <!-- CARD 3: SLOP (STRATEGIC LATERAL OFFSET) -->
  <g transform="translate(610, 115)">
    <rect width="265" height="525" rx="14" fill="url(#cardGrad2)" stroke="#8b5cf6" stroke-width="1.5" />
    <rect x="18" y="18" width="34" height="34" rx="8" fill="url(#purpleGrad)" />
    <text x="35" y="41" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="800" text-anchor="middle">3</text>
    
    <text x="60" y="36" fill="#c4b5fd" font-size="14" font-weight="800">PROTOCOLO SLOP</text>
    <text x="60" y="52" fill="#94a3b8" font-size="11">Desvío Lateral Estratégico</text>

    <rect x="18" y="75" width="229" height="240" rx="8" fill="#0f172a" stroke="#8b5cf6" stroke-width="1" />
    <text x="30" y="98" fill="#a78bfa" font-size="12" font-weight="700">Objetivo Operacional:</text>
    <text x="30" y="118" fill="#cbd5e1" font-size="11">Mitigar turbulencia de estela y</text>
    <text x="30" y="134" fill="#cbd5e1" font-size="11">riesgo de colisión en ruta RNAV.</text>
    
    <!-- SLOP Diagram mini -->
    <line x1="50" y1="160" x2="50" y2="230" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 4" />
    <line x1="120" y1="160" x2="120" y2="230" stroke="#34d399" stroke-width="2" />
    <line x1="190" y1="160" x2="190" y2="230" stroke="#a78bfa" stroke-width="2" />
    <text x="50" y="245" fill="#94a3b8" font-size="9" text-anchor="middle">EJE (0)</text>
    <text x="120" y="245" fill="#34d399" font-size="9" text-anchor="middle">+1 NM DCH</text>
    <text x="190" y="245" fill="#a78bfa" font-size="9" text-anchor="middle">+2 NM DCH</text>
    
    <text x="30" y="275" fill="#cbd5e1" font-size="11">Rangos autorizados:</text>
    <text x="30" y="295" fill="#c4b5fd" font-size="13" font-weight="800">0.1 NM, 1.0 NM o 2.0 NM</text>

    <rect x="18" y="325" width="229" height="185" rx="8" fill="#4c1d95" fill-opacity="0.3" stroke="#8b5cf6" stroke-width="1" />
    <text x="30" y="348" fill="#fca5a5" font-size="12" font-weight="800">REGLAS DE ORO SLOP:</text>
    <text x="30" y="370" fill="#f8fafc" font-size="11" font-weight="700">1. SIEMPRE A LA DERECHA</text>
    <text x="30" y="388" fill="#94a3b8" font-size="10">¡Nunca desviarse a la izquierda!</text>
    <text x="30" y="408" fill="#f8fafc" font-size="11" font-weight="700">2. NO REQUIERE AVISO ATC</text>
    <text x="30" y="426" fill="#94a3b8" font-size="10">En espacio aéreo oceánico / remoto autorizado.</text>
    <text x="30" y="448" fill="#f8fafc" font-size="11" font-weight="700">3. RE-ALINEAR EN APROX</text>
    <text x="30" y="466" fill="#94a3b8" font-size="10">Volver a 0 NM antes de STAR/IAF.</text>
  </g>

  <!-- CARD 4: PROCEDIMIENTOS DE CONTINGENCIA -->
  <g transform="translate(895, 115)">
    <rect width="265" height="525" rx="14" fill="url(#cardGrad2)" stroke="#ef4444" stroke-width="1.5" />
    <rect x="18" y="18" width="34" height="34" rx="8" fill="#ef4444" />
    <text x="35" y="41" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="800" text-anchor="middle">4</text>
    
    <text x="60" y="36" fill="#fca5a5" font-size="14" font-weight="800">CONTINGENCIAS</text>
    <text x="60" y="52" fill="#94a3b8" font-size="11">Fallo de Capacidad RVSM</text>

    <rect x="18" y="75" width="229" height="130" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1" />
    <text x="30" y="98" fill="#f87171" font-size="12" font-weight="700">Disparadores de Degradación:</text>
    <text x="30" y="118" fill="#cbd5e1" font-size="11">• Fallo de Piloto Automático</text>
    <text x="30" y="136" fill="#cbd5e1" font-size="11">• Pérdida de 1 Altímetro prim.</text>
    <text x="30" y="154" fill="#cbd5e1" font-size="11">• Fallo alertador de altitud</text>
    <text x="30" y="172" fill="#fca5a5" font-size="11" font-weight="700">• Discrepancia altim. &gt; 200 ft</text>

    <rect x="18" y="215" width="229" height="150" rx="8" fill="#450a0a" fill-opacity="0.4" stroke="#ef4444" stroke-width="1.2" />
    <text x="30" y="238" fill="#f87171" font-size="12" font-weight="800">LLAMADA ATC OBLIGATORIA:</text>
    <text x="30" y="260" fill="#fca5a5" font-size="11" font-weight="700">"UNABLE RVSM DUE TO EQUIPMENT"</text>
    <text x="30" y="285" fill="#cbd5e1" font-size="11">Respuesta ATC estándar:</text>
    <text x="30" y="303" fill="#38bdf8" font-size="11">• Aumentar separación a 2.000 ft</text>
    <text x="30" y="321" fill="#38bdf8" font-size="11">• O autorizar descenso &lt; FL290</text>
    <text x="30" y="339" fill="#94a3b8" font-size="10">Vigilar pantalla TCAS activamente.</text>

    <rect x="18" y="375" width="229" height="135" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="30" y="398" fill="#fbbf24" font-size="12" font-weight="700">Turbulencia Severa (MTA):</text>
    <text x="30" y="420" fill="#cbd5e1" font-size="11">Si no es posible mantener</text>
    <text x="30" y="438" fill="#fef08a" font-size="12" font-weight="700">altitud dentro de ±65 ft:</text>
    <text x="30" y="460" fill="#fca5a5" font-size="11">Cantar a ATC: "UNABLE RVSM</text>
    <text x="30" y="478" fill="#fca5a5" font-size="11">DUE TO TURBULENCE"</text>
  </g>
</svg>
