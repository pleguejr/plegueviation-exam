<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1150" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c16"/>
      <stop offset="50%" stop-color="#0c1626"/>
      <stop offset="100%" stop-color="#050810"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#152238"/>
      <stop offset="100%" stop-color="#0f192b"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1600" height="1150" fill="url(#bgGrad)"/>

  <!-- Header Banner -->
  <g transform="translate(40, 25)">
    <rect width="1520" height="85" rx="12" fill="#132035" stroke="#253856" stroke-width="2" filter="url(#shadow)"/>
    <rect width="12" height="85" fill="url(#redGrad)" rx="3"/>
    
    <text x="35" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#f8fafc" letter-spacing="0.5">
      DESCENSO DE EMERGENCIA (EMERGENCY DESCENT)
    </text>
    <text x="35" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#38bdf8">
      Despresurización de Cabina • CABIN ALT HI • Binter MOB 3.1.4 &amp; QRH Rev 20 S1-3 • Embraer 195-E2
    </text>

    <rect x="1330" y="24" width="160" height="38" rx="8" fill="rgba(220, 38, 38, 0.2)" stroke="#ef4444" stroke-width="1.5"/>
    <text x="1410" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#f87171" text-anchor="middle">
      MEMORY ITEMS
    </text>
  </g>

  <!-- Visual Descent Trajectory Banner with Binter E195-E2 -->
  <g transform="translate(40, 130)">
    <rect width="1520" height="175" rx="12" fill="url(#cardGrad)" stroke="#ef4444" stroke-width="1.5" filter="url(#shadow)"/>
    
    <!-- Cruise Line -->
    <line x1="80" y1="40" x2="320" y2="40" stroke="#94a3b8" stroke-width="2.5"/>
    <text x="80" y="28" font-family="sans-serif" font-size="13" font-weight="700" fill="#cbd5e1">FL370 (CRUCERO)</text>

    <!-- Steep Dive Profile -->
    <path d="M 320,40 Q 420,40 520,70 L 980,135 L 1440,135" fill="none" stroke="#ef4444" stroke-width="3" stroke-dasharray="6,4"/>
    
    <!-- Level-off Line -->
    <text x="1350" y="125" font-family="sans-serif" font-size="13" font-weight="800" fill="#34d399">FL100 / MEA (NIVELACIÓN)</text>

    <!-- Aircraft in Emergency Descent Dive (Binter E195-E2) -->
    <g transform="translate(700, 95) rotate(14) scale(0.65)">
      <!-- Fuselage -->
      <path d="M -160,0 L 160,0 Q 200,0 180,5 L -140,5 Z" fill="#f8fafc" stroke="#94a3b8"/>
      <!-- Binter Livery -->
      <path d="M -20,-8 Q 40,-1 100,-8 L 130,-7 Q 70,0 10,-7 Z" fill="#059669"/>
      <path d="M -10,-7 Q 50,1 110,-5 L 140,-4 Q 80,2 20,-4 Z" fill="#0284c7"/>
      <!-- Wings & Speedbrakes FULL OPEN -->
      <path d="M 0,0 L -50,-45 L -25,-45 L 30,0 Z" fill="#059669"/>
      <path d="M 0,0 L -50,45 L -25,45 L 30,0 Z" fill="#059669"/>
      <!-- Speedbrake Panels Deployed (Red/Yellow) -->
      <rect x="-10" y="-35" width="20" height="6" fill="#f59e0b" transform="rotate(-30)"/>
      <rect x="-10" y="25" width="20" height="6" fill="#f59e0b" transform="rotate(30)"/>
      <!-- Tail -->
      <path d="M -120,0 L -160,-35 L -140,-35 L -100,0 Z" fill="#0284c7"/>
    </g>

    <!-- Milestones on Profile -->
    <circle cx="320" cy="40" r="5" fill="#ef4444"/>
    <text x="320" y="65" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#f87171" text-anchor="middle">Máscaras 100% / Throttles IDLE</text>

    <circle cx="550" cy="78" r="5" fill="#f59e0b"/>
    <text x="550" y="105" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#fbbf24" text-anchor="middle">Speedbrakes FULL OPEN / VMO/MMO</text>

    <circle cx="980" cy="135" r="5" fill="#38bdf8"/>
    <text x="980" y="160" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#38bdf8" text-anchor="middle">-2.000 ft: 250 kt ➔ -1.000 ft: Speedbrakes RETRACT</text>
  </g>

  <!-- 3 Main Columns: Memory Items, Level Off, DUMP -->
  <g transform="translate(40, 325)">
    
    <!-- Col 1: Acciones de Memoria (PF/PM) -->
    <g transform="translate(0, 0)">
      <rect width="485" height="560" rx="12" fill="url(#cardGrad)" stroke="#ef4444" stroke-width="2" filter="url(#shadow)"/>
      <rect width="485" height="42" rx="12" fill="url(#redGrad)"/>
      <text x="242" y="27" font-family="sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">
        1. ACCIONES DE MEMORIA (MEMORY ITEMS)
      </text>

      <g transform="translate(20, 60)" font-family="sans-serif">
        <rect width="445" height="120" rx="8" fill="rgba(220, 38, 38, 0.2)" stroke="#ef4444" stroke-width="1.5"/>
        <text x="18" y="26" font-size="14.5" font-weight="800" fill="#f87171">TRIPULACIÓN TÉCNICA (INMEDIATO):</text>
        <text x="18" y="48" font-size="13.5" font-weight="700" fill="#ffffff">1. CREW OXY MASK: DON 100%</text>
        <text x="18" y="70" font-size="13.5" font-weight="700" fill="#ffffff">2. CREW COMMUNICATIONS: ESTABLISH (Intercom)</text>
        <text x="18" y="92" font-size="13.5" font-weight="700" fill="#fbbf24">3. FSTN BELTS SWITCH: ON</text>
        <text x="18" y="112" font-size="13" font-weight="600" fill="#38bdf8">4. MEGAFONÍA: "DESCENSO DE EMERGENCIA x3"</text>

        <g transform="translate(0, 135)">
          <rect width="445" height="145" rx="8" fill="#18263e" stroke="#334155" stroke-width="1"/>
          <text x="18" y="26" font-size="14.5" font-weight="800" fill="#38bdf8">ACCIONES DE VUELO (PF):</text>
          <text x="18" y="48" font-size="13.5" font-weight="700" fill="#f87171">• ALTITUDE: 10.000 FT O MEA (la más alta)</text>
          <text x="18" y="70" font-size="13.5" font-weight="700" fill="#ffffff">• THRUST LEVERS: IDLE</text>
          <text x="18" y="92" font-size="13.5" font-weight="700" fill="#ffffff">• SPEEDBRAKE LEVER: FULL OPEN</text>
          <text x="18" y="114" font-size="13.5" font-weight="700" fill="#34d399">• AIRSPEED: MAX / APPROPRIATE (VMO/MMO)</text>
          <text x="18" y="136" font-size="12.5" font-weight="500" fill="#cbd5e1">Virar 90° fuera de la aerovía si es posible.</text>
        </g>

        <g transform="translate(0, 295)">
          <rect width="445" height="95" rx="8" fill="#18263e" stroke="#334155" stroke-width="1"/>
          <text x="18" y="26" font-size="14.5" font-weight="800" fill="#fbbf24">COMUNICACIONES (PM):</text>
          <text x="18" y="48" font-size="13.5" font-weight="700" fill="#f87171">• TRANSPONDER: SQUAWK 7700</text>
          <text x="18" y="70" font-size="13" font-weight="600" fill="#cbd5e1">• Llamada ATC: "MAYDAY x3, [Callsign],</text>
          <text x="18" y="88" font-size="13" font-weight="600" fill="#cbd5e1">DESCENSO DE EMERGENCIA A FL100"</text>
        </g>
      </g>
    </g>

    <!-- Col 2: Nivelación y Normalización -->
    <g transform="translate(515, 0)">
      <rect width="485" height="560" rx="12" fill="url(#cardGrad)" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
      <rect width="485" height="42" rx="12" fill="url(#binterGreenGrad)"/>
      <text x="242" y="27" font-family="sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">
        2. NIVELACIÓN A ALTITUD SEGURA
      </text>

      <g transform="translate(20, 60)" font-family="sans-serif">
        <rect width="445" height="110" rx="8" fill="#18263e" stroke="#334155" stroke-width="1"/>
        <text x="20" y="28" font-size="15" font-weight="800" fill="#34d399">A 2.000 FT de Nivelar ➔ PM Callout</text>
        <text x="20" y="52" font-size="14" font-weight="700" fill="#38bdf8">"TWO THOUSAND TO LEVEL OFF"</text>
        <text x="20" y="74" font-size="13.5" font-weight="500" fill="#cbd5e1">• Reducir velocidad suavemente a <tspan font-weight="700" fill="#ffffff">250 kt</tspan>.</text>
        <text x="20" y="96" font-size="13.5" font-weight="500" fill="#cbd5e1">• Evitar aceleraciones verticales bruscas.</text>

        <g transform="translate(0, 125)">
          <rect width="445" height="110" rx="8" fill="#18263e" stroke="#334155" stroke-width="1"/>
          <text x="20" y="28" font-size="15" font-weight="800" fill="#34d399">A 1.000 FT de Nivelar ➔ PM Callout</text>
          <text x="20" y="52" font-size="14" font-weight="700" fill="#38bdf8">"ONE THOUSAND TO LEVEL OFF"</text>
          <text x="20" y="74" font-size="13.5" font-weight="500" fill="#cbd5e1">• Retraer aerofrenos (<tspan font-weight="700" fill="#ffffff">Speedbrakes IN</tspan>).</text>
          <text x="20" y="96" font-size="13.5" font-weight="500" fill="#cbd5e1">• Nivelar en 10.000 ft o MEA y ajustar potencia.</text>
        </g>

        <g transform="translate(0, 250)">
          <rect width="445" height="145" rx="8" fill="#18263e" stroke="#334155" stroke-width="1"/>
          <text x="20" y="28" font-size="15" font-weight="800" fill="#fbbf24">Aviso de Finalización a Cabina</text>
          <text x="20" y="52" font-size="13" font-weight="700" fill="#facc15">PA: "TRIPULACIÓN DE CABINA, DESCENSO FINALIZADO"</text>
          <text x="20" y="74" font-size="13.5" font-weight="500" fill="#cbd5e1">• Sobrecargo evalúa heridos y comunica estado.</text>
          <text x="20" y="96" font-size="13.5" font-weight="500" fill="#cbd5e1">• Leer lista QRH: <tspan font-weight="700" fill="#38bdf8">Cabin Altitude Hi Checklist</tspan>.</text>
          <text x="20" y="118" font-size="13.5" font-weight="500" fill="#cbd5e1">• Preparar desvío al aeródromo adecuado.</text>
        </g>
      </g>
    </g>

    <!-- Col 3: Función DUMP & Oxígeno -->
    <g transform="translate(1030, 0)">
      <rect width="490" height="560" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)"/>
      <rect width="490" height="42" rx="12" fill="url(#blueGrad)"/>
      <text x="245" y="27" font-family="sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">
        3. FUNCIÓN DUMP &amp; OXÍGENO PAX
      </text>

      <g transform="translate(20, 60)" font-family="sans-serif">
        <rect width="450" height="150" rx="8" fill="#18263e" stroke="#334155" stroke-width="1"/>
        <text x="20" y="28" font-size="15" font-weight="800" fill="#38bdf8">Régimen de la Función DUMP</text>
        <text x="20" y="52" font-size="13.5" font-weight="700" fill="#ffffff">• Modo Automático:</text>
        <text x="35" y="72" font-size="13" font-weight="500" fill="#cbd5e1">Sube la cabina a <tspan font-weight="700" fill="#38bdf8">+2.000 ft/min</tspan> hasta 12.400 ft</text>
        <text x="35" y="92" font-size="13" font-weight="500" fill="#cbd5e1">(o hasta 14.500 ft si está en modo H ALTO).</text>
        <text x="20" y="116" font-size="13.5" font-weight="700" fill="#ffffff">• Modo Manual:</text>
        <text x="35" y="136" font-size="13" font-weight="500" fill="#cbd5e1">Sube la cabina a <tspan font-weight="700" fill="#f59e0b">+3.000 ft/min</tspan> hasta máx 14.500 ft.</text>

        <g transform="translate(0, 165)">
          <rect width="450" height="150" rx="8" fill="#18263e" stroke="#334155" stroke-width="1"/>
          <text x="20" y="28" font-size="15" font-weight="800" fill="#38bdf8">Despliegue de Máscaras de Pasajeros</text>
          <text x="20" y="52" font-size="13.5" font-weight="500" fill="#e2e8f0">• Despliegue automático de máscaras de pasaje:</text>
          <text x="20" y="74" font-size="13.5" font-weight="700" fill="#ef4444">Ocurre entre 14.000 y 14.750 ft altitud cabina.</text>
          <text x="20" y="98" font-size="13.5" font-weight="500" fill="#cbd5e1">• Generadores químicos de oxígeno activos por</text>
          <text x="20" y="118" font-size="13.5" font-weight="700" fill="#34d399">al menos 12 a 15 minutos continuos.</text>
          <text x="20" y="138" font-size="12" font-weight="500" fill="#94a3b8">• Si no caen automáticamente: Selector MASK DEPLOY.</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Bottom Bar -->
  <g transform="translate(40, 1010)">
    <rect width="1520" height="110" rx="12" fill="#132035" stroke="#253856" stroke-width="2" filter="url(#shadow)"/>
    <text x="30" y="36" font-family="sans-serif" font-size="16" font-weight="800" fill="#38bdf8">
      REGLAS DE SEGURIDAD OPERACIONAL EN DESPRESURIZACIÓN:
    </text>
    <text x="30" y="65" font-family="sans-serif" font-size="14" font-weight="500" fill="#cbd5e1">
      • En caso de sospecha de daño estructural severo, limitar la velocidad de descenso (reducir VMO/MMO) para evitar sobrecargas.
    </text>
    <text x="30" y="90" font-family="sans-serif" font-size="14" font-weight="500" fill="#cbd5e1">
      • Verificar altitud mínima de seguridad (MORA / Grid MORA en zonas montañosas como Canarias o Marruecos) antes de descender de 10.000 ft.
    </text>
  </g>
</svg>
