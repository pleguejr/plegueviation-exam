<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradEmgD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1a" />
      <stop offset="100%" stop-color="#121b2d" />
    </linearGradient>
    <linearGradient id="cardGradD" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#182338" />
      <stop offset="100%" stop-color="#0e1726" />
    </linearGradient>
    <linearGradient id="redGradD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGradEmgD)" />

  <!-- Grid -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="370" x2="1200" y2="370" />
    <line x1="300" y1="0" x2="300" y2="675" />
    <line x1="600" y1="0" x2="600" y2="675" />
    <line x1="900" y1="0" x2="900" y2="675" />
  </g>

  <!-- Header Banner -->
  <rect x="30" y="16" width="1140" height="64" rx="10" fill="#111c2e" stroke="#ef4444" stroke-opacity="0.4" stroke-width="1.5" />
  
  <!-- Embraer 195-E2 Silhouette -->
  <g transform="translate(48, 26) scale(0.6)">
    <path d="M 0 25 Q 35 15 70 18 L 85 5 L 92 6 L 82 19 L 140 22 L 185 0 L 195 2 L 165 24 L 205 25 Q 215 25 220 28 L 200 31 L 165 31 L 145 42 L 138 41 L 148 31 L 80 30 L 70 42 L 62 41 L 68 29 Q 30 30 0 25 Z" fill="#ef4444" fill-opacity="0.9" />
    <rect x="90" y="27" width="28" height="10" rx="4" fill="#b91c1c" />
    <polygon points="185,2 193,3 175,20 168,20" fill="#10b981" />
  </g>

  <text x="185" y="44" fill="#f87171" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" letter-spacing="1">DESCENSO DE EMERGENCIA (EMERGENCY DESCENT)</text>
  <text x="185" y="66" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Manuales Binter MOB 3.1.4 &amp; QRH Rev19 S1-3 · Despresurización E195-E2</text>
  
  <rect x="980" y="26" width="175" height="42" rx="6" fill="#450a0a" fill-opacity="0.5" stroke="#ef4444" stroke-width="1" />
  <text x="1067" y="52" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">SQUAWK 7700 · MAYDAY</text>

  <!-- 4 PROCESS PANELS -->
  <g transform="translate(30, 95)">
    
    <!-- CARD 1: ACCIONES DE MEMORIA -->
    <g transform="translate(0, 0)">
      <rect width="270" height="555" rx="12" fill="url(#cardGradD)" stroke="#ef4444" stroke-width="1.5" />
      <rect x="14" y="14" width="28" height="28" rx="6" fill="url(#redGradD)" />
      <text x="28" y="33" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="800" text-anchor="middle">1</text>
      
      <text x="50" y="28" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="14" font-weight="800">MEMORIA INMEDIATA</text>
      <text x="50" y="42" fill="#94a3b8" font-size="10">Oxígeno y Comunicación</text>

      <rect x="14" y="56" width="242" height="135" rx="6" fill="#450a0a" fill-opacity="0.4" stroke="#ef4444" stroke-width="1.2" />
      <text x="24" y="76" fill="#f87171" font-size="11" font-weight="800">MÁSCARAS DE OXÍGENO:</text>
      <rect x="22" y="84" width="226" height="46" rx="4" fill="#7f1d1d" stroke="#ef4444" stroke-width="1" />
      <text x="30" y="102" fill="#ffffff" font-size="12" font-weight="900">CREW OXY MASK DON 100%</text>
      <text x="30" y="120" fill="#fecaca" font-size="10" font-weight="800">ESTABLISH CREW COMMS</text>
      <text x="24" y="146" fill="#cbd5e1" font-size="10">• Intercomunicador de cabina.</text>
      <text x="24" y="160" fill="#cbd5e1" font-size="10">• Pulsar botón MASK en ACP.</text>
      <text x="24" y="174" fill="#94a3b8" font-size="9.5">• Micrófono de máscara activo.</text>

      <rect x="14" y="201" width="242" height="145" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1" />
      <text x="24" y="221" fill="#fbbf24" font-size="11" font-weight="800">AVISO POR MEGAFONÍA (PA):</text>
      <rect x="22" y="229" width="226" height="52" rx="4" fill="#78350f" fill-opacity="0.4" stroke="#f59e0b" stroke-width="1" />
      <text x="30" y="247" fill="#fef08a" font-size="10" font-weight="800">PF / PM por PA de cabina:</text>
      <text x="30" y="261" fill="#ffffff" font-size="10" font-weight="900">"DESCENSO DE EMERGENCIA,</text>
      <text x="30" y="273" fill="#ffffff" font-size="10" font-weight="900"> DESCENSO DE EMERGENCIA,</text>
      <text x="30" y="285" fill="#ffffff" font-size="10" font-weight="900"> DESCENSO DE EMERGENCIA"</text>
      <text x="24" y="302" fill="#cbd5e1" font-size="10">• Despliegue automático PAX:</text>
      <text x="24" y="316" fill="#a7f3d0" font-size="10" font-weight="700">  Entre 14.000 ft y 14.750 ft.</text>
      <text x="24" y="332" fill="#94a3b8" font-size="9.5">• Pasajeros respiran de máscaras.</text>

      <rect x="14" y="356" width="242" height="185" rx="6" fill="#1e293b" fill-opacity="0.5" stroke="#38bdf8" stroke-width="1" />
      <text x="24" y="376" fill="#38bdf8" font-size="11" font-weight="800">SISTEMA DE PRESIÓN DUMP:</text>
      <text x="24" y="394" fill="#cbd5e1" font-size="10">• Pulsador DUMP en panel:</text>
      <text x="34" y="412" fill="#7dd3fc" font-size="10.5" font-weight="700">Modo Automático:</text>
      <text x="34" y="426" fill="#cbd5e1" font-size="10">+2.000 ft/min hasta 12.400 ft</text>
      <text x="34" y="440" fill="#94a3b8" font-size="9">(o hasta 14.500 ft modo H ALTO).</text>
      <text x="34" y="460" fill="#7dd3fc" font-size="10.5" font-weight="700">Modo Manual:</text>
      <text x="34" y="474" fill="#cbd5e1" font-size="10">+3.000 ft/min hasta 14.500 ft.</text>
      <text x="24" y="500" fill="#fca5a5" font-size="9.5">Despresuriza cabina rápidamente.</text>
    </g>

    <!-- CARD 2: ACCIONES DE CONTROL DE VUELO -->
    <g transform="translate(285, 0)">
      <rect width="280" height="555" rx="12" fill="url(#cardGradD)" stroke="#f59e0b" stroke-width="1.5" />
      <rect x="14" y="14" width="28" height="28" rx="6" fill="#d97706" />
      <text x="28" y="33" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="800" text-anchor="middle">2</text>
      
      <text x="50" y="28" fill="#fde68a" font-family="system-ui, sans-serif" font-size="14" font-weight="800">CONTROL DE VUELO</text>
      <text x="50" y="42" fill="#94a3b8" font-size="10">Configuración de Descenso Rápido</text>

      <rect x="14" y="56" width="252" height="110" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="24" y="76" fill="#fbbf24" font-size="11" font-weight="800">1. SELECCIÓN DE ALTITUD:</text>
      <rect x="22" y="84" width="236" height="42" rx="4" fill="#78350f" fill-opacity="0.3" stroke="#f59e0b" stroke-width="1" />
      <text x="30" y="102" fill="#ffffff" font-size="12" font-weight="900">10.000 FT O MEA / MORA</text>
      <text x="30" y="116" fill="#fde68a" font-size="9.5">(La que sea más alta)</text>
      <text x="24" y="144" fill="#cbd5e1" font-size="10">• Pulsar botón FLCH en FGS.</text>
      <text x="24" y="158" fill="#94a3b8" font-size="9.5">• Iniciar descenso vertical de máxima tasa.</text>

      <rect x="14" y="176" width="252" height="105" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="24" y="196" fill="#fbbf24" font-size="11" font-weight="800">2. EMPUJE Y AEROFRENOS:</text>
      <text x="24" y="214" fill="#cbd5e1" font-size="10.5">• Palancas de gases:</text>
      <text x="34" y="230" fill="#fca5a5" font-size="12" font-weight="900">THRUST LEVERS: IDLE</text>
      <text x="24" y="248" fill="#cbd5e1" font-size="10.5">• Aerofrenos (Speedbrakes):</text>
      <text x="34" y="264" fill="#fca5a5" font-size="12" font-weight="900">SPEEDBRAKE LEVER: FULL OPEN</text>

      <rect x="14" y="291" width="252" height="115" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="24" y="311" fill="#fbbf24" font-size="11" font-weight="800">3. VELOCIDAD DE DESCENSO:</text>
      <text x="24" y="329" fill="#cbd5e1" font-size="10">• Si estructura aeronave intacta:</text>
      <text x="34" y="347" fill="#38bdf8" font-size="12" font-weight="800">AIRSPEED: MAX / VMO / MMO</text>
      <text x="24" y="367" fill="#cbd5e1" font-size="10">• Si hay sospecha de daño estructural:</text>
      <text x="34" y="383" fill="#fca5a5" font-size="10.5" font-weight="700">Ajustar velocidad apropiada / turbulencia.</text>

      <rect x="14" y="416" width="252" height="125" rx="6" fill="#064e3b" fill-opacity="0.4" stroke="#10b981" stroke-width="1" />
      <text x="24" y="436" fill="#34d399" font-size="11" font-weight="800">TASA DE DESCENSO TÍPICA:</text>
      <text x="24" y="456" fill="#ffffff" font-size="14" font-weight="900">-4.000 a -6.000 FT/MIN</text>
      <text x="24" y="476" fill="#cbd5e1" font-size="10">• Monitorizar variómetro y horizonte.</text>
      <text x="24" y="490" fill="#cbd5e1" font-size="10">• Mantener actitud estable con AP.</text>
      <text x="24" y="504" fill="#cbd5e1" font-size="10">• Cuidar no rebasar VMO en descenso.</text>
    </g>

    <!-- CARD 3: COMUNICACIONES & VIRAJE -->
    <g transform="translate(580, 0)">
      <rect width="280" height="555" rx="12" fill="url(#cardGradD)" stroke="#38bdf8" stroke-width="1.5" />
      <rect x="14" y="14" width="28" height="28" rx="6" fill="#0284c7" />
      <text x="28" y="33" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="800" text-anchor="middle">3</text>
      
      <text x="50" y="28" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="14" font-weight="800">COMUNICACIONES &amp; VIRAJE</text>
      <text x="50" y="42" fill="#94a3b8" font-size="10">Separación ATC y Tráfico</text>

      <rect x="14" y="56" width="252" height="125" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
      <text x="24" y="76" fill="#38bdf8" font-size="11" font-weight="800">TRANSPONDER SSR:</text>
      <rect x="22" y="84" width="236" height="46" rx="4" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1" />
      <text x="30" y="104" fill="#ffffff" font-size="13" font-weight="900">SQUAWK 7700</text>
      <text x="30" y="120" fill="#bae6fd" font-size="9.5">Alerta inmediata en radar de ATC.</text>
      <text x="24" y="148" fill="#cbd5e1" font-size="10">• TCAS en TA/RA modo activo.</text>
      <text x="24" y="162" fill="#cbd5e1" font-size="10">• Luces exteriores TODAS ON.</text>

      <rect x="14" y="191" width="252" height="145" rx="6" fill="#0f172a" stroke="#ef4444" stroke-width="1.2" />
      <text x="24" y="211" fill="#f87171" font-size="11" font-weight="800">LLAMADA RADIOTELEFÓNICA ATC:</text>
      <rect x="22" y="221" width="236" height="58" rx="4" fill="#450a0a" stroke="#ef4444" stroke-width="1" />
      <text x="30" y="239" fill="#fca5a5" font-size="10" font-weight="800">PM a la frecuencia de control:</text>
      <text x="30" y="253" fill="#ffffff" font-size="10.5" font-weight="900">"MAYDAY, MAYDAY, MAYDAY,</text>
      <text x="30" y="267" fill="#ffffff" font-size="10.5" font-weight="900"> [CALLSIGN], EMERGENCY DESCENT"</text>
      <text x="24" y="296" fill="#cbd5e1" font-size="10">• Solicitar nivel FL100 o MEA.</text>
      <text x="24" y="310" fill="#cbd5e1" font-size="10">• QNH local de la zona.</text>
      <text x="24" y="324" fill="#94a3b8" font-size="9.5">• Vectores hacia aeródromo alternativo.</text>

      <rect x="14" y="346" width="252" height="195" rx="6" fill="#0f172a" stroke="#8b5cf6" stroke-width="1" />
      <text x="24" y="366" fill="#c4b5fd" font-size="11" font-weight="800">VIRAJE FUERA DE AEROVÍA:</text>
      <text x="24" y="386" fill="#cbd5e1" font-size="10">• Virar aproximadamente</text>
      <text x="34" y="404" fill="#a78bfa" font-size="12" font-weight="800">90° FUERA DE LA RUTA</text>
      <text x="24" y="424" fill="#cbd5e1" font-size="10">  para evitar tráficos debajo</text>
      <text x="24" y="438" fill="#cbd5e1" font-size="10">  en la misma aerovía.</text>
      <text x="24" y="458" fill="#cbd5e1" font-size="10">• Hacia zona de menor orografía /</text>
      <text x="24" y="472" fill="#cbd5e1" font-size="10">  menor altitud mínima (Grid MORA).</text>
      <text x="24" y="492" fill="#cbd5e1" font-size="10">• Coordinar viraje con ATC</text>
      <text x="24" y="506" fill="#cbd5e1" font-size="10">  en cuanto sea posible.</text>
    </g>

    <!-- CARD 4: NIVELACIÓN & POST-DESCENSO -->
    <g transform="translate(875, 0)">
      <rect width="265" height="555" rx="12" fill="url(#cardGradD)" stroke="#10b981" stroke-width="1.5" />
      <rect x="14" y="14" width="28" height="28" rx="6" fill="#059669" />
      <text x="28" y="33" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="800" text-anchor="middle">4</text>
      
      <text x="50" y="28" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="14" font-weight="800">NIVELACIÓN SEGURA</text>
      <text x="50" y="42" fill="#94a3b8" font-size="10">Aproximación a FL100 / MEA</text>

      <rect x="14" y="56" width="237" height="95" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="24" y="76" fill="#38bdf8" font-size="10.5" font-weight="800">A 2.000 FT DE LA ALTITUD:</text>
      <text x="24" y="92" fill="#bae6fd" font-size="11" font-weight="800">PM: "2 THOUSAND TO LEVEL OFF"</text>
      <rect x="22" y="100" width="220" height="34" rx="4" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1" />
      <text x="30" y="122" fill="#ffffff" font-size="11" font-weight="900">Reducir velocidad a 250 kt</text>

      <rect x="14" y="161" width="237" height="95" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="24" y="181" fill="#38bdf8" font-size="10.5" font-weight="800">A 1.000 FT DE LA ALTITUD:</text>
      <text x="24" y="197" fill="#bae6fd" font-size="11" font-weight="800">PM: "1 THOUSAND TO LEVEL OFF"</text>
      <rect x="22" y="205" width="220" height="34" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1" />
      <text x="30" y="227" fill="#ffffff" font-size="11" font-weight="900">Retraer Speedbrakes suave</text>

      <rect x="14" y="266" width="237" height="110" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1" />
      <text x="24" y="286" fill="#34d399" font-size="11" font-weight="800">TRAS NIVELAR EN FL100/MEA:</text>
      <rect x="22" y="294" width="220" height="42" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1" />
      <text x="30" y="312" fill="#a7f3d0" font-size="9.5" font-weight="800">PA a la cabina:</text>
      <text x="30" y="326" fill="#ffffff" font-size="9.5" font-weight="900">"TRIPULACIÓN, DESCENSO FINALIZADO"</text>
      <text x="24" y="352" fill="#cbd5e1" font-size="10">• Evaluar retirar máscaras de O2.</text>
      <text x="24" y="366" fill="#cbd5e1" font-size="10">• Chequear estado físico de tripulación.</text>

      <rect x="14" y="386" width="237" height="155" rx="6" fill="#1e1b4b" stroke="#818cf8" stroke-width="1" />
      <text x="24" y="406" fill="#c7d2fe" font-size="11" font-weight="800">GESTIÓN POST-DESCENSO:</text>
      <text x="24" y="426" fill="#cbd5e1" font-size="10">• Completar lista:</text>
      <text x="34" y="442" fill="#fde68a" font-size="10.5" font-weight="700">Cabin Altitude Hi Emergency</text>
      <text x="34" y="456" fill="#fde68a" font-size="10.5" font-weight="700">Checklist en QRH.</text>
      <text x="24" y="476" fill="#cbd5e1" font-size="10">• Briefing TELSI con Sobrecargo.</text>
      <text x="24" y="490" fill="#cbd5e1" font-size="10">• Evaluar heridos o falta de O2.</text>
      <text x="24" y="504" fill="#cbd5e1" font-size="10">• Decisión IMFLOCC / Desvío.</text>
      <text x="24" y="522" fill="#a7f3d0" font-size="9.5">Aterrizaje en aeropuerto más adecuado.</text>
    </g>

  </g>
</svg>
