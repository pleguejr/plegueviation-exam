<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b111e"/>
      <stop offset="100%" stop-color="#070b12"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="850" fill="url(#bgGrad)"/>

  <!-- Subtle Grid Lines -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="0" y1="700" x2="1200" y2="700"/>
  </g>

  <!-- Header Banner -->
  <rect x="40" y="30" width="1120" height="75" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)"/>
  <rect x="40" y="30" width="10" height="75" fill="#f59e0b" rx="2"/>
  
  <text x="65" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#f8fafc" letter-spacing="0.5">
    GESTIÓN DE COMBUSTIBLE EN VUELO &amp; DECLARACIONES ATC
  </text>
  <text x="65" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">
    EASA Part-CAT (CAT.OP.MPA.180/181/182) &amp; ICAO Doc 4444 • Flujo de Decisión MDF, MINIMUM FUEL y MAYDAY FUEL
  </text>
  <rect x="980" y="47" width="160" height="38" rx="6" fill="rgba(245, 158, 11, 0.2)" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="1060" y="71" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#fcd34d" text-anchor="middle">
    EASA PART-CAT
  </text>

  <!-- 4 Columns Decision Flow -->
  <!-- Level 1: Monitorización en Crucero -->
  <g transform="translate(40, 125)">
    <rect width="265" height="490" rx="8" fill="#131e31" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect width="265" height="38" rx="8" fill="#1e293b"/>
    <text x="132" y="24" font-family="sans-serif" font-size="12" font-weight="800" fill="#38bdf8" text-anchor="middle">
      1. CRUCERO &amp; CHECKS
    </text>

    <circle cx="28" cy="65" r="12" fill="#0284c7"/>
    <text x="28" y="69" font-family="sans-serif" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">A</text>
    <text x="50" y="65" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff">Frecuencia de Check</text>
    <text x="50" y="80" font-family="sans-serif" font-size="11" font-weight="500" fill="#94a3b8">• Cada punto de reporte o</text>
    <text x="50" y="95" font-family="sans-serif" font-size="11" font-weight="500" fill="#94a3b8">• Intervalos ≤ 60 minutos</text>

    <circle cx="28" cy="130" r="12" fill="#0284c7"/>
    <text x="28" y="134" font-family="sans-serif" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">B</text>
    <text x="50" y="130" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff">Comparación de FOB</text>
    <text x="50" y="145" font-family="sans-serif" font-size="11" font-weight="500" fill="#94a3b8">• FOB real vs Plan de vuelo</text>
    <text x="50" y="160" font-family="sans-serif" font-size="11" font-weight="500" fill="#94a3b8">• Detectar consumos anómalos</text>
    <text x="50" y="175" font-family="sans-serif" font-size="11" font-weight="500" fill="#94a3b8">• Desbalance entre tanques</text>

    <circle cx="28" cy="210" r="12" fill="#0284c7"/>
    <text x="28" y="214" font-family="sans-serif" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">C</text>
    <text x="50" y="210" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff">Cálculo MDF Continuo</text>
    <text x="50" y="225" font-family="sans-serif" font-size="11" font-weight="500" fill="#94a3b8">Minimum Diversion Fuel:</text>
    <text x="50" y="240" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#38bdf8">MDF = Alternate +</text>
    <text x="50" y="255" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#38bdf8">Final Reserve (30 min)</text>

    <rect x="15" y="280" width="235" height="190" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="25" y="302" font-family="sans-serif" font-size="11" font-weight="700" fill="#38bdf8">REGLA BÁSICA EASA:</text>
    <text x="25" y="322" font-family="sans-serif" font-size="10.5" font-weight="500" fill="#cbd5e1">El comandante debe asegurar</text>
    <text x="25" y="338" font-family="sans-serif" font-size="10.5" font-weight="500" fill="#cbd5e1">que el combustible remanente</text>
    <text x="25" y="354" font-family="sans-serif" font-size="10.5" font-weight="500" fill="#cbd5e1">al aterrizar en destino sea al</text>
    <text x="25" y="370" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#f8fafc">menos igual a Alternate +</text>
    <text x="25" y="386" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#f8fafc">Final Reserve Fuel.</text>
    <text x="25" y="415" font-family="sans-serif" font-size="10" font-weight="500" fill="#94a3b8">Si no hay alternativo (aislado):</text>
    <text x="25" y="430" font-family="sans-serif" font-size="10" font-weight="700" fill="#f59e0b">FOB ≥ Final Reserve + 2 horas</text>
  </g>

  <!-- Level 2: Esperas y Punto de Decisión -->
  <g transform="translate(325, 125)">
    <rect width="265" height="490" rx="8" fill="#131e31" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect width="265" height="38" rx="8" fill="#1e293b"/>
    <text x="132" y="24" font-family="sans-serif" font-size="12" font-weight="800" fill="#f59e0b" text-anchor="middle">
      2. ESPERAS &amp; DESVÍO
    </text>

    <circle cx="28" cy="65" r="12" fill="#d97706"/>
    <text x="28" y="69" font-family="sans-serif" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">A</text>
    <text x="50" y="65" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff">Tiempo en Espera (Holding)</text>
    <text x="50" y="80" font-family="sans-serif" font-size="11" font-weight="600" fill="#fbbf24">Extra Fuel = FOB - MDF</text>
    <text x="50" y="95" font-family="sans-serif" font-size="11" font-weight="500" fill="#94a3b8">Hold Time = Extra / Consumo</text>

    <circle cx="28" cy="130" r="12" fill="#d97706"/>
    <text x="28" y="134" font-family="sans-serif" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">B</text>
    <text x="50" y="130" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff">Coordinación ATC (EAT)</text>
    <text x="50" y="145" font-family="sans-serif" font-size="11" font-weight="500" fill="#94a3b8">• Solicitar hora de aproximación:</text>
    <text x="50" y="160" font-family="sans-serif" font-size="11" font-weight="600" fill="#f8fafc">"Request Expected Approach Time"</text>

    <circle cx="28" cy="205" r="12" fill="#d97706"/>
    <text x="28" y="209" font-family="sans-serif" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">C</text>
    <text x="50" y="205" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff">Punto Límite de Desvío</text>
    <text x="50" y="220" font-family="sans-serif" font-size="11" font-weight="500" fill="#94a3b8">Al consumir el combustible</text>
    <text x="50" y="235" font-family="sans-serif" font-size="11" font-weight="500" fill="#94a3b8">extra y alcanzar MDF:</text>
    <text x="50" y="250" font-family="sans-serif" font-size="11.5" font-weight="800" fill="#f87171">¡INICIAR DESVÍO INMEDIATO!</text>

    <rect x="15" y="280" width="235" height="190" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
    <text x="25" y="302" font-family="sans-serif" font-size="11" font-weight="700" fill="#fcd34d">CRITERIO DE DECISIÓN:</text>
    <text x="25" y="322" font-family="sans-serif" font-size="10.5" font-weight="500" fill="#cbd5e1">Si la EAT dada por ATC es</text>
    <text x="25" y="338" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#f87171">POSTERIOR al tiempo límite</text>
    <text x="25" y="354" font-family="sans-serif" font-size="10.5" font-weight="500" fill="#cbd5e1">de espera (Hold Time), no se</text>
    <text x="25" y="370" font-family="sans-serif" font-size="10.5" font-weight="500" fill="#cbd5e1">puede aceptar la espera.</text>
    <text x="25" y="398" font-family="sans-serif" font-size="10.5" font-weight="600" fill="#38bdf8">Abandonar el circuito e</text>
    <text x="25" y="415" font-family="sans-serif" font-size="10.5" font-weight="600" fill="#38bdf8">iniciar navegación al alternativo.</text>
  </g>

  <!-- Level 3: MINIMUM FUEL -->
  <g transform="translate(610, 125)">
    <rect width="265" height="490" rx="8" fill="#131e31" stroke="#eab308" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect width="265" height="38" rx="8" fill="url(#amberGrad)"/>
    <text x="132" y="24" font-family="sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">
      3. MINIMUM FUEL
    </text>

    <circle cx="28" cy="65" r="12" fill="#ca8a04"/>
    <text x="28" y="69" font-family="sans-serif" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">A</text>
    <text x="50" y="65" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff">Condición de Activación</text>
    <text x="50" y="80" font-family="sans-serif" font-size="11" font-weight="500" fill="#94a3b8">Cualquier demora adicional</text>
    <text x="50" y="95" font-family="sans-serif" font-size="11" font-weight="500" fill="#94a3b8">implicará aterrizar con menos</text>
    <text x="50" y="110" font-family="sans-serif" font-size="11" font-weight="700" fill="#fbbf24">de la Reserva Final (30 min).</text>

    <circle cx="28" cy="140" r="12" fill="#ca8a04"/>
    <text x="28" y="144" font-family="sans-serif" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">B</text>
    <text x="50" y="140" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff">Fraseología Obligatoria</text>
    <text x="50" y="158" font-family="sans-serif" font-size="11.5" font-weight="800" fill="#fef08a">"[Callsign] MINIMUM FUEL"</text>
    <text x="50" y="175" font-family="sans-serif" font-size="10.5" font-weight="500" fill="#94a3b8">Informar a ATC inmediatamente</text>

    <rect x="15" y="210" width="235" height="260" rx="6" fill="#1e293b" stroke="#eab308" stroke-width="1.5"/>
    <text x="25" y="235" font-family="sans-serif" font-size="11" font-weight="800" fill="#facc15">¡NO ES UNA EMERGENCIA!</text>
    <text x="25" y="255" font-family="sans-serif" font-size="10.5" font-weight="500" fill="#cbd5e1">• <tspan font-weight="700" fill="#f87171">NO otorga prioridad</tspan> directa de aproximación o aterrizaje.</text>
    <text x="25" y="290" font-family="sans-serif" font-size="10.5" font-weight="500" fill="#cbd5e1">• Solo informa a ATC de que NO se pueden aceptar demoras extras.</text>
    <text x="25" y="328" font-family="sans-serif" font-size="10.5" font-weight="500" fill="#cbd5e1">• ATC no proporcionará vectores directos por defecto salvo que el flujo de tráfico lo permita.</text>
    <text x="25" y="380" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#f59e0b">Si tras MINIMUM FUEL ATC da demoras adicionales que afecten a la Reserva Final:</text>
    <text x="25" y="425" font-family="sans-serif" font-size="11" font-weight="800" fill="#ef4444">➔ DECLARAR MAYDAY FUEL</text>
  </g>

  <!-- Level 4: MAYDAY FUEL -->
  <g transform="translate(895, 125)">
    <rect width="265" height="490" rx="8" fill="#131e31" stroke="#ef4444" stroke-width="2" filter="url(#cardShadow)"/>
    <rect width="265" height="38" rx="8" fill="url(#redGrad)"/>
    <text x="132" y="24" font-family="sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">
      4. MAYDAY FUEL
    </text>

    <circle cx="28" cy="65" r="12" fill="#ef4444"/>
    <text x="28" y="69" font-family="sans-serif" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">A</text>
    <text x="50" y="65" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff">Condición Crítica</text>
    <text x="50" y="80" font-family="sans-serif" font-size="11" font-weight="500" fill="#94a3b8">Cálculo al aterrizar en el</text>
    <text x="50" y="95" font-family="sans-serif" font-size="11" font-weight="500" fill="#94a3b8">aeródromo más cercano utilizable:</text>
    <text x="50" y="110" font-family="sans-serif" font-size="11" font-weight="800" fill="#f87171">FOB &lt; FINAL RESERVE (30m)</text>

    <circle cx="28" cy="140" r="12" fill="#ef4444"/>
    <text x="28" y="144" font-family="sans-serif" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">B</text>
    <text x="50" y="140" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff">Fraseología de Socorro</text>
    <text x="50" y="158" font-family="sans-serif" font-size="11.5" font-weight="800" fill="#fca5a5">"MAYDAY MAYDAY MAYDAY,"</text>
    <text x="50" y="174" font-family="sans-serif" font-size="11.5" font-weight="800" fill="#fca5a5">"[Callsign] MAYDAY FUEL"</text>

    <rect x="15" y="210" width="235" height="260" rx="6" fill="rgba(220,38,38,0.2)" stroke="#ef4444" stroke-width="1.5"/>
    <text x="25" y="235" font-family="sans-serif" font-size="11" font-weight="800" fill="#f87171">SITUACIÓN DE SOCORRO (DISTRESS):</text>
    <text x="25" y="255" font-family="sans-serif" font-size="10.5" font-weight="600" fill="#fecaca">• <tspan font-weight="800" fill="#ffffff">PRIORIDAD ABSOLUTA</tspan> de tráfico y aterrizaje directo.</text>
    <text x="25" y="290" font-family="sans-serif" font-size="10.5" font-weight="500" fill="#fecaca">• Código Transponder: Squawk 7700 (si lo solicita ATC o se requiere).</text>
    <text x="25" y="328" font-family="sans-serif" font-size="10.5" font-weight="500" fill="#fecaca">• Servicios de emergencia en pista (RFFS) desplegados en espera.</text>
    <text x="25" y="375" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">POSTERIOR AL VUELO:</text>
    <text x="25" y="395" font-family="sans-serif" font-size="10" font-weight="500" fill="#fecaca">• ASR / Informe obligatorio EASA y a la autoridad de Aviación Civil.</text>
  </g>

  <!-- Bottom Fuel Calculation Summary Bar -->
  <g transform="translate(40, 630)">
    <rect width="1120" height="185" rx="8" fill="#131e31" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)"/>
    
    <!-- Left Equation Box -->
    <rect x="20" y="20" width="480" height="145" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="35" y="45" font-family="sans-serif" font-size="13" font-weight="800" fill="#38bdf8">FÓRMULAS OFICIALES DE COMBUSTIBLE EN VUELO:</text>
    <text x="35" y="70" font-family="sans-serif" font-size="12" font-weight="700" fill="#f8fafc">• MDF (Min Diversion Fuel) = Trip (Destino-Alt) + Final Reserve</text>
    <text x="35" y="92" font-family="sans-serif" font-size="12" font-weight="700" fill="#f8fafc">• Final Reserve Fuel (EASA Jet) = 30 min holding a 1.500 ft AAL ISA</text>
    <text x="35" y="114" font-family="sans-serif" font-size="12" font-weight="700" fill="#f8fafc">• Combustible de Espera Disponible = FOB - MDF</text>
    <text x="35" y="136" font-family="sans-serif" font-size="12" font-weight="700" fill="#4ade80">• Tiempo de Espera (min) = [ (FOB - MDF) / Consumo horario (kg/h) ] × 60</text>

    <!-- Right Operational Notes -->
    <text x="530" y="45" font-family="sans-serif" font-size="12.5" font-weight="800" fill="#f59e0b">RESPONSABILIDADES DEL COMANDANTE (CAT.GEN.NMPA.100):</text>
    <text x="530" y="70" font-family="sans-serif" font-size="11.5" font-weight="500" fill="#cbd5e1">1. Revaluar continuamente el aeródromo alternativo (METAR/TAF, RVR, pistas activas).</text>
    <text x="530" y="92" font-family="sans-serif" font-size="11.5" font-weight="500" fill="#cbd5e1">2. Prohibido continuar aproximación si al aterrizar se vulnerará la Reserva Final.</text>
    <text x="530" y="114" font-family="sans-serif" font-size="11.5" font-weight="500" fill="#cbd5e1">3. En aproximación frustrada (Go-Around), recalcular inmediatamente si da tiempo a alternativo.</text>
    <text x="530" y="136" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#38bdf8">4. Comunicar a Dispatch/OCC la decisión tomada una vez estabilizada la trayectoria.</text>
  </g>
</svg>
