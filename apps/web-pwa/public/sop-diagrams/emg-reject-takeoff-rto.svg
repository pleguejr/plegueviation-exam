<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradRto" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1a" />
      <stop offset="100%" stop-color="#121b2d" />
    </linearGradient>
    <linearGradient id="cardGradR" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#182338" />
      <stop offset="100%" stop-color="#0e1726" />
    </linearGradient>
    <linearGradient id="runwayGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="runwayRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGradRto)" />

  <!-- Grid -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="365" x2="1200" y2="365" />
    <line x1="300" y1="0" x2="300" y2="675" />
    <line x1="600" y1="0" x2="600" y2="675" />
    <line x1="900" y1="0" x2="900" y2="675" />
  </g>

  <!-- Header Banner -->
  <rect x="30" y="16" width="1140" height="64" rx="10" fill="#111c2e" stroke="#ef4444" stroke-opacity="0.4" stroke-width="1.5" />
  
  <!-- Embraer 195-E2 Silhouette -->
  <g transform="translate(48, 26) scale(0.6)">
    <path d="M 0 25 Q 35 15 70 18 L 85 5 L 92 6 L 82 19 L 140 22 L 185 0 L 195 2 L 165 24 L 205 25 Q 215 25 220 28 L 200 31 L 165 31 L 145 42 L 138 41 L 148 31 L 80 30 L 70 42 L 62 41 L 68 29 Q 30 30 0 25 Z" fill="#ef4444" fill-opacity="0.9" />
    <rect x="90" y="27" width="28" height="10" rx="4" fill="#b91c1c" />
    <polygon points="185,2 193,3 175,20 168,20" fill="#10b981" />
  </g>

  <text x="185" y="44" fill="#f87171" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" letter-spacing="1">DESPEGUE RECHAZADO / REJECT TAKEOFF (RTO)</text>
  <text x="185" y="66" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Manuales Binter MOB 3.1.2, SOPM Sec 3 &amp; QRH Rev19 · Flota Embraer 195-E2</text>
  
  <rect x="980" y="26" width="175" height="42" rx="6" fill="#450a0a" fill-opacity="0.5" stroke="#ef4444" stroke-width="1" />
  <text x="1067" y="52" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">CRITERIO 80 KT / V1</text>

  <!-- TOP RUNWAY SPEED REGIME DIAGRAM -->
  <g transform="translate(30, 95)">
    <rect width="1140" height="235" rx="12" fill="url(#cardGradR)" stroke="#f59e0b" stroke-width="1.2" />
    
    <!-- Runway graphical perspective bar -->
    <rect x="30" y="28" width="520" height="44" rx="4" fill="url(#runwayGreen)" stroke="#10b981" stroke-width="1.5" />
    <rect x="570" y="28" width="540" height="44" rx="4" fill="url(#runwayRed)" stroke="#ef4444" stroke-width="1.5" />
    
    <!-- Runway Centerline dashes -->
    <line x1="40" y1="50" x2="540" y2="50" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="14 10" />
    <line x1="580" y1="50" x2="1100" y2="50" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="14 10" />

    <text x="290" y="56" fill="#ffffff" font-size="13" font-weight="900" text-anchor="middle">LOW SPEED REGIME (&lt; 80 KIAS)</text>
    <text x="840" y="56" fill="#ffffff" font-size="13" font-weight="900" text-anchor="middle">HIGH SPEED REGIME (&gt; 80 KIAS HASTA V1)</text>

    <!-- Marker 80 kt -->
    <circle cx="560" cy="50" r="14" fill="#f59e0b" stroke="#ffffff" stroke-width="2" />
    <text x="560" y="55" fill="#000000" font-size="10" font-weight="900" text-anchor="middle">80</text>
    <text x="560" y="20" fill="#fbbf24" font-size="11" font-weight="800" text-anchor="middle">80 KT GATE</text>

    <!-- Marker V1 -->
    <circle cx="1110" cy="50" r="14" fill="#ef4444" stroke="#ffffff" stroke-width="2" />
    <text x="1110" y="55" fill="#ffffff" font-size="10" font-weight="900" text-anchor="middle">V1</text>
    <text x="1110" y="20" fill="#f87171" font-size="11" font-weight="800" text-anchor="middle">V1 DECISION</text>

    <!-- Sub-boxes below runway bar -->
    <!-- Low speed box -->
    <rect x="30" y="85" width="520" height="135" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1" />
    <text x="44" y="106" fill="#34d399" font-size="12" font-weight="800">SE ABORTA POR CUALQUIER ANOMALÍA / FALLO:</text>
    <text x="44" y="124" fill="#cbd5e1" font-size="10.5">• Cualquier fallo de sistemas o aviso acústico/visual.</text>
    <text x="44" y="140" fill="#cbd5e1" font-size="10.5">• Puertas abiertas, parámetros anómalos de motor.</text>
    <text x="44" y="156" fill="#cbd5e1" font-size="10.5">• Comportamiento extraño de guiñada o vibración.</text>
    <rect x="40" y="166" width="500" height="42" rx="4" fill="#78350f" fill-opacity="0.3" stroke="#f59e0b" stroke-width="1" />
    <text x="48" y="182" fill="#fde68a" font-size="10" font-weight="800">EXCEPCIONES (NO ABORTAR):</text>
    <text x="48" y="198" fill="#cbd5e1" font-size="10">Alertas menores "ENG TLA NOT TOGA" y "FUEL LO LEVEL".</text>

    <!-- High speed box -->
    <rect x="570" y="85" width="540" height="135" rx="6" fill="#450a0a" fill-opacity="0.4" stroke="#ef4444" stroke-width="1.2" />
    <text x="584" y="106" fill="#f87171" font-size="12" font-weight="900">ZONA DE ALTA ENERGÍA — SOLO ABORTAR POR:</text>
    <text x="584" y="126" fill="#fecaca" font-size="11" font-weight="700">1° FUEGO DE MOTOR O AVISO DE HUMO DENSO EN CABINA</text>
    <text x="584" y="144" fill="#fecaca" font-size="11" font-weight="700">2° FALLO DE MOTOR (ENGINE FAILURE / SEVERE DAMAGE)</text>
    <text x="584" y="162" fill="#fecaca" font-size="11" font-weight="700">3° ALERTA DE CIZALLADURA PREDICTIVA (WSHEAR AHEAD)</text>
    <text x="584" y="180" fill="#fecaca" font-size="11" font-weight="700">4° MENSAJES EICAS WARNING (ROJO)</text>
    <text x="584" y="198" fill="#fca5a5" font-size="10.5" font-weight="600">5° Aeronave manifiestamente insegura o incapaz de volar.</text>
  </g>

  <!-- BOTTOM: ACTIONS & TWO-CHALLENGE RULE -->
  <g transform="translate(30, 345)">
    
    <!-- ACTIONS PF (COMMANDER) -->
    <g transform="translate(0, 0)">
      <rect width="365" height="305" rx="12" fill="url(#cardGradR)" stroke="#ef4444" stroke-width="1.5" />
      <text x="20" y="26" fill="#f87171" font-size="13" font-weight="800">ACCIONES DEL COMANDANTE (PF)</text>
      
      <rect x="14" y="38" width="337" height="46" rx="4" fill="#7f1d1d" stroke="#ef4444" stroke-width="1" />
      <text x="24" y="56" fill="#ffffff" font-size="11" font-weight="900">1° CALLOUT EN CABINA:</text>
      <text x="24" y="72" fill="#ffffff" font-size="14" font-weight="900">"STOP"</text>

      <rect x="14" y="92" width="337" height="135" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="24" y="112" fill="#cbd5e1" font-size="10.5">• Palancas de empuje a ralentí (IDLE).</text>
      <text x="24" y="128" fill="#cbd5e1" font-size="10.5">• Desconectar Autothrottle (A/T).</text>
      <text x="24" y="144" fill="#cbd5e1" font-size="10.5">• Verificar actuación AUTOBRAKE RTO o</text>
      <text x="34" y="160" fill="#fca5a5" font-size="11" font-weight="800">aplicar MÁXIMA FRENADA MANUAL.</text>
      <text x="24" y="178" fill="#cbd5e1" font-size="10.5">• Aplicar reversas máximas simétricas.</text>
      <text x="24" y="196" fill="#cbd5e1" font-size="10.5">• Mantener el avión en el eje de pista.</text>
      <text x="24" y="214" fill="#34d399" font-size="10.5" font-weight="700">• Detener avión y poner PARK BRAKE ON.</text>

      <rect x="14" y="235" width="337" height="58" rx="4" fill="#78350f" fill-opacity="0.4" stroke="#f59e0b" stroke-width="1" />
      <text x="24" y="253" fill="#fbbf24" font-size="10" font-weight="800">AVISO MANDATORIO POR PA TRAS PARAR:</text>
      <text x="24" y="271" fill="#ffffff" font-size="10.5" font-weight="900">"TRIPULACIÓN DE CABINA, ESPEREN INSTRUCCIONES"</text>
    </g>

    <!-- ACTIONS PM (PILOT MONITORING) -->
    <g transform="translate(380, 0)">
      <rect width="365" height="305" rx="12" fill="url(#cardGradR)" stroke="#38bdf8" stroke-width="1.5" />
      <text x="20" y="26" fill="#38bdf8" font-size="13" font-weight="800">ACCIONES DEL PILOT MONITORING (PM)</text>

      <rect x="14" y="38" width="337" height="185" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
      <text x="24" y="60" fill="#38bdf8" font-size="11" font-weight="800">CALLOUTS DE DESACELERACIÓN:</text>
      
      <rect x="22" y="68" width="320" height="34" rx="4" fill="#0c4a6e" stroke="#0284c7" stroke-width="1" />
      <text x="30" y="90" fill="#ffffff" font-size="11" font-weight="900">"SPOILERS EXTENDED"</text>

      <rect x="22" y="108" width="320" height="34" rx="4" fill="#0c4a6e" stroke="#0284c7" stroke-width="1" />
      <text x="30" y="130" fill="#ffffff" font-size="11" font-weight="900">"REVERSE NORMAL"</text>

      <rect x="22" y="148" width="320" height="34" rx="4" fill="#0c4a6e" stroke="#0284c7" stroke-width="1" />
      <text x="30" y="170" fill="#ffffff" font-size="11" font-weight="900">"70 KNOTS"</text>

      <text x="24" y="204" fill="#cbd5e1" font-size="10">• Monitorizar frenada y presión hidráulica.</text>

      <rect x="14" y="231" width="337" height="62" rx="4" fill="#0c4a6e" fill-opacity="0.4" stroke="#38bdf8" stroke-width="1" />
      <text x="24" y="250" fill="#7dd3fc" font-size="10" font-weight="800">LLAMADA RADIOTELEFÓNICA ATC:</text>
      <text x="24" y="268" fill="#ffffff" font-size="10.5" font-weight="900">"[CALLSIGN], STOPPING ON RUNWAY"</text>
      <text x="24" y="282" fill="#bae6fd" font-size="9">Solicitar bomberos a pie de pista si procede.</text>
    </g>

    <!-- INCAPACITATION AT 80 KT (TWO CHALLENGE) -->
    <g transform="translate(760, 0)">
      <rect width="380" height="305" rx="12" fill="url(#cardGradR)" stroke="#f59e0b" stroke-width="1.5" />
      <text x="20" y="26" fill="#fbbf24" font-size="13" font-weight="800">INCAPACITACIÓN A 80 KT (TWO-CHALLENGE)</text>

      <rect x="14" y="38" width="352" height="74" rx="6" fill="#78350f" fill-opacity="0.3" stroke="#f59e0b" stroke-width="1" />
      <text x="24" y="56" fill="#fde68a" font-size="10.5" font-weight="800">REGLA DEL DOBLE LLAMAMIENTO:</text>
      <text x="24" y="74" fill="#ffffff" font-size="11.5" font-weight="900">PM: "80 KNOTS"... (sin respuesta) ➔ "80 KNOTS"</text>
      <text x="24" y="94" fill="#fca5a5" font-size="10" font-weight="700">Si el PF no responde al segundo aviso:</text>

      <rect x="14" y="118" width="352" height="88" rx="6" fill="#0f172a" stroke="#ef4444" stroke-width="1" />
      <text x="24" y="136" fill="#f87171" font-size="11" font-weight="800">ASUNCIÓN INMEDIATA DE MANDOS POR PM:</text>
      <text x="24" y="154" fill="#ffffff" font-size="12" font-weight="900">PM: "I HAVE CONTROLS"</text>
      <text x="24" y="172" fill="#cbd5e1" font-size="10">• Palancas IDLE, desconectar A/T.</text>
      <text x="24" y="188" fill="#cbd5e1" font-size="10">• Máxima frenada con pedales y reversas.</text>

      <rect x="14" y="214" width="352" height="78" rx="6" fill="#1e1b4b" stroke="#818cf8" stroke-width="1" />
      <text x="24" y="232" fill="#c7d2fe" font-size="10.5" font-weight="800">COORDINACIÓN DE EMERGENCIA MÉDICA:</text>
      <text x="24" y="248" fill="#cbd5e1" font-size="10">• Freno estacionamiento, PA "ESPEREN INSTRUCCIONES".</text>
      <text x="24" y="262" fill="#fde68a" font-size="10" font-weight="800">• ATC: "PAN-PAN MEDICAL &amp; FIRE FIGHTING"</text>
      <text x="24" y="278" fill="#cbd5e1" font-size="9.5">• Arranque de APU y Shutdown Checklist.</text>
    </g>

  </g>
</svg>
