<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1150" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c16"/>
      <stop offset="50%" stop-color="#0c1626"/>
      <stop offset="100%" stop-color="#050810"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#152238"/>
      <stop offset="100%" stop-color="#0f192b"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1600" height="1150" fill="url(#bgGrad)"/>

  <!-- Header Banner -->
  <g transform="translate(40, 25)">
    <rect width="1520" height="85" rx="12" fill="#132035" stroke="#253856" stroke-width="2" filter="url(#shadow)"/>
    <rect width="12" height="85" fill="url(#redGrad)" rx="3"/>
    
    <text x="35" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#f8fafc" letter-spacing="0.5">
      DESPEGUE RECHAZADO (REJECT TAKEOFF — RTO)
    </text>
    <text x="35" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#38bdf8">
      Criterios &lt;80 kt vs &gt;80 kt a V1 • Incapacitación del PF (Two-Challenge Rule) • Binter MOB 3.1.2 &amp; QRH
    </text>

    <rect x="1330" y="24" width="160" height="38" rx="8" fill="rgba(220, 38, 38, 0.2)" stroke="#ef4444" stroke-width="1.5"/>
    <text x="1410" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#f87171" text-anchor="middle">
      RTO PROCEDURES
    </text>
  </g>

  <!-- Visual Runway Timeline with Speed Regimes and Binter Aircraft -->
  <g transform="translate(40, 130)">
    <rect width="1520" height="165" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
    
    <!-- Runway Surface -->
    <rect x="40" y="110" width="1440" height="24" fill="#1e293b" stroke="#475569"/>
    <line x1="40" y1="122" x2="1480" y2="122" stroke="#fef08a" stroke-width="2" stroke-dasharray="15,15"/>

    <!-- Low Speed Zone (<80 kt) -->
    <rect x="40" y="20" width="450" height="75" rx="8" fill="rgba(56, 189, 248, 0.12)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="60" y="45" font-family="sans-serif" font-size="15" font-weight="800" fill="#38bdf8">ZONA BAJA VELOCIDAD (&lt; 80 KIAS)</text>
    <text x="60" y="68" font-family="sans-serif" font-size="13" font-weight="500" fill="#cbd5e1">Abortar ante cualquier fallo, aviso o anomalía.</text>

    <!-- 80 KT Transition Marker -->
    <line x1="490" y1="15" x2="490" y2="140" stroke="#f59e0b" stroke-width="3" stroke-dasharray="4,4"/>
    <circle cx="490" cy="122" r="7" fill="#f59e0b"/>
    <text x="490" y="155" font-family="sans-serif" font-size="13" font-weight="900" fill="#fbbf24" text-anchor="middle">80 KNOTS</text>

    <!-- High Speed Zone (80 kt to V1) -->
    <rect x="520" y="20" width="490" height="75" rx="8" fill="rgba(220, 38, 38, 0.15)" stroke="#ef4444" stroke-width="1.5"/>
    <text x="540" y="45" font-family="sans-serif" font-size="15" font-weight="800" fill="#f87171">ZONA ALTA ENERGÍA (80 KIAS A V1)</text>
    <text x="540" y="68" font-family="sans-serif" font-size="13" font-weight="600" fill="#fecaca">SOLO fuego, fallo motor, humo, cizalladura o Warning.</text>

    <!-- V1 Marker -->
    <line x1="1010" y1="15" x2="1010" y2="140" stroke="#ef4444" stroke-width="3"/>
    <circle cx="1010" cy="122" r="7" fill="#dc2626"/>
    <text x="1010" y="155" font-family="sans-serif" font-size="14" font-weight="900" fill="#f87171" text-anchor="middle">V1 (DECISIÓN)</text>

    <!-- Post V1: Must Go -->
    <rect x="1040" y="20" width="440" height="75" rx="8" fill="rgba(16, 185, 129, 0.12)" stroke="#10b981" stroke-width="1.5"/>
    <text x="1060" y="45" font-family="sans-serif" font-size="15" font-weight="800" fill="#34d399">ZONA TRAS V1 ➔ ¡DESPEGUE OBLIGATORIO!</text>
    <text x="1060" y="68" font-family="sans-serif" font-size="13" font-weight="500" fill="#cbd5e1">El avión debe ir al aire. Prohibido abortar &gt; V1.</text>
  </g>

  <!-- 3 Main Columns: Criterios, Incapacitacion, Frenada/Evacuacion -->
  <g transform="translate(40, 315)">
    
    <!-- Col 1: Criterios de Aborto -->
    <g transform="translate(0, 0)">
      <rect width="485" height="575" rx="12" fill="url(#cardGrad)" stroke="#ef4444" stroke-width="2" filter="url(#shadow)"/>
      <rect width="485" height="42" rx="12" fill="url(#redGrad)"/>
      <text x="242" y="27" font-family="sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">
        1. CRITERIOS SEGÚN RÉGIMEN
      </text>

      <g transform="translate(20, 60)" font-family="sans-serif">
        <rect width="445" height="150" rx="8" fill="#18263e" stroke="#334155" stroke-width="1"/>
        <text x="20" y="28" font-size="15" font-weight="800" fill="#38bdf8">Baja Velocidad (&lt; 80 KIAS):</text>
        <text x="20" y="52" font-size="13.5" font-weight="500" fill="#cbd5e1">• Abortar por cualquier fallo de sistemas,</text>
        <text x="20" y="74" font-size="13.5" font-weight="500" fill="#cbd5e1">indicación anormal, puerta abierta o tráfico.</text>
        <text x="20" y="98" font-size="13.5" font-weight="700" fill="#f59e0b">Excepciones donde NO se aborta:</text>
        <text x="20" y="120" font-size="13" font-weight="500" fill="#94a3b8">• "ENG TLA NOT TOGA" y "FUEL LO LEVEL"</text>
        <text x="20" y="138" font-size="12" font-weight="500" fill="#94a3b8">(avisos menores transitorios en despegue).</text>

        <g transform="translate(0, 165)">
          <rect width="445" height="195" rx="8" fill="rgba(220, 38, 38, 0.2)" stroke="#ef4444" stroke-width="1.5"/>
          <text x="20" y="28" font-size="15" font-weight="800" fill="#f87171">Alta Velocidad (&gt; 80 KIAS hasta V1):</text>
          <text x="20" y="52" font-size="13" font-weight="600" fill="#fecaca">ZONA DE MÁXIMA ENERGÍA CINÉTICA.</text>
          <text x="20" y="74" font-size="13.5" font-weight="700" fill="#ffffff">SOLO abortar por 5 causas tasadas:</text>
          <text x="20" y="98" font-size="13" font-weight="600" fill="#fecaca">1. Fuego de motor / Fuego en aeronave</text>
          <text x="20" y="118" font-size="13" font-weight="600" fill="#fecaca">2. Fallo de motor (Engine Failure)</text>
          <text x="20" y="138" font-size="13" font-weight="600" fill="#fecaca">3. Humo denso en cabina técnica/pasaje</text>
          <text x="20" y="158" font-size="13" font-weight="600" fill="#fecaca">4. Alerta de cizalladura (WSHEAR AHEAD)</text>
          <text x="20" y="178" font-size="13" font-weight="600" fill="#fecaca">5. Mensaje EICAS WARNING (Rojo con &gt;)</text>
        </g>
      </g>
    </g>

    <!-- Col 2: Protocolo de Incapacitacion a 80kt -->
    <g transform="translate(515, 0)">
      <rect width="485" height="575" rx="12" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
      <rect width="485" height="42" rx="12" fill="url(#goldGrad)"/>
      <text x="242" y="27" font-family="sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">
        2. INCAPACITACIÓN A 80 KT (PM ASUME)
      </text>

      <g transform="translate(20, 60)" font-family="sans-serif">
        <rect width="445" height="120" rx="8" fill="#18263e" stroke="#334155" stroke-width="1"/>
        <text x="20" y="28" font-size="15" font-weight="800" fill="#fbbf24">Two-Challenge Rule a 80 KT</text>
        <text x="20" y="52" font-size="13.5" font-weight="500" fill="#e2e8f0">• PM canta: <tspan font-weight="800" fill="#38bdf8">"80 KNOTS"</tspan>... sin respuesta.</text>
        <text x="20" y="74" font-size="13.5" font-weight="500" fill="#e2e8f0">• PM repite con firmeza: <tspan font-weight="800" fill="#fbbf24">"80 KNOTS"</tspan>... sin respuesta.</text>
        <text x="20" y="98" font-size="13.5" font-weight="700" fill="#f87171">• PM asume mandos: "I HAVE CONTROLS".</text>
        
        <g transform="translate(0, 135)">
          <rect width="445" height="150" rx="8" fill="#18263e" stroke="#10b981" stroke-width="1.5"/>
          <text x="20" y="28" font-size="15" font-weight="800" fill="#34d399">Acciones de Parada Inmediata</text>
          <text x="20" y="52" font-size="13.5" font-weight="700" fill="#ffffff">1. Palancas de empuje a ralentí (IDLE)</text>
          <text x="20" y="74" font-size="13.5" font-weight="700" fill="#ffffff">2. Desconectar A/T inmediatamente</text>
          <text x="20" y="96" font-size="13.5" font-weight="700" fill="#fbbf24">3. Máxima frenada manual con pedales / RTO</text>
          <text x="20" y="118" font-size="13.5" font-weight="700" fill="#38bdf8">4. Aplicar reversas simétricas a tope</text>
          <text x="20" y="140" font-size="13" font-weight="500" fill="#cbd5e1">5. Mantener rigurosamente el eje de pista.</text>
        </g>

        <g transform="translate(0, 300)">
          <rect width="445" height="85" rx="8" fill="#18263e" stroke="#334155" stroke-width="1"/>
          <text x="20" y="26" font-size="14.5" font-weight="800" fill="#38bdf8">Tras Detener el Avión en Pista</text>
          <text x="20" y="48" font-size="13.5" font-weight="700" fill="#f87171">• Poner freno de parking (PARK BRAKE ON).</text>
          <text x="20" y="70" font-size="13" font-weight="500" fill="#cbd5e1">• Iniciar coordinación de seguridad en cabina.</text>
        </g>
      </g>
    </g>

    <!-- Col 3: Coordinacion Cabina y Pasaje -->
    <g transform="translate(1030, 0)">
      <rect width="490" height="575" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)"/>
      <rect width="490" height="42" rx="12" fill="url(#blueGrad)"/>
      <text x="245" y="27" font-family="sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">
        3. ACCIONES POST-RTO &amp; CABINA
      </text>

      <g transform="translate(20, 60)" font-family="sans-serif">
        <rect width="450" height="110" rx="8" fill="rgba(245, 158, 11, 0.2)" stroke="#f59e0b" stroke-width="1.5"/>
        <text x="18" y="26" font-size="14.5" font-weight="800" fill="#fbbf24">AVISO INMEDIATO POR MEGAFONÍA (PA):</text>
        <text x="18" y="52" font-size="14" font-weight="900" fill="#ffffff">"TRIPULACIÓN DE CABINA, ESPEREN INSTRUCCIONES"</text>
        <text x="18" y="76" font-size="13" font-weight="500" fill="#fef08a">• Evita la apertura intempestiva de puertas por</text>
        <text x="18" y="96" font-size="13" font-weight="500" fill="#fef08a">pánico o evacuaciones descontroladas de pasaje.</text>

        <g transform="translate(0, 125)">
          <rect width="450" height="135" rx="8" fill="#18263e" stroke="#334155" stroke-width="1"/>
          <text x="18" y="26" font-size="14.5" font-weight="800" fill="#38bdf8">Comunicaciones &amp; Servicios de Pista</text>
          <text x="18" y="50" font-size="13.5" font-weight="700" fill="#fbbf24">• ATC: "PAN-PAN MEDICAL &amp; FIRE SERVICES"</text>
          <text x="18" y="72" font-size="13" font-weight="500" fill="#cbd5e1">Solicitar asistencia médica y bomberos a pista.</text>
          <text x="18" y="94" font-size="13.5" font-weight="700" fill="#34d399">• Comprobar página STATUS en MFD:</text>
          <text x="18" y="116" font-size="13" font-weight="500" fill="#cbd5e1">Evaluar temperatura de frenos (Brake Temp).</text>
        </g>

        <g transform="translate(0, 275)">
          <rect width="450" height="120" rx="8" fill="#18263e" stroke="#334155" stroke-width="1"/>
          <text x="18" y="26" font-size="14.5" font-weight="800" fill="#38bdf8">Parada de Motores &amp; Desalojo</text>
          <text x="18" y="50" font-size="13" font-weight="500" fill="#cbd5e1">• Arrancar APU para mantener eléctrica y aire.</text>
          <text x="18" y="72" font-size="13" font-weight="500" fill="#cbd5e1">• Parar motores mediante Shutdown Checklist.</text>
          <text x="18" y="94" font-size="13" font-weight="700" fill="#34d399">• Coordinar evacuación médica por puerta delantera.</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Bottom Bar -->
  <g transform="translate(40, 1020)">
    <rect width="1520" height="100" rx="12" fill="#132035" stroke="#253856" stroke-width="2" filter="url(#shadow)"/>
    <text x="30" y="36" font-family="sans-serif" font-size="16" font-weight="800" fill="#38bdf8">
      GESTIÓN DE TEMPERATURA DE FRENOS TRAS RTO:
    </text>
    <text x="30" y="65" font-family="sans-serif" font-size="14" font-weight="500" fill="#cbd5e1">
      • Tras un RTO en alta energía, los frenos alcanzan temperaturas extremas. No desalojar la pista hasta confirmar que no hay fuego de frenos o riesgo de reventón de neumáticos con los bomberos (RFFS).
    </text>
  </g>
</svg>
