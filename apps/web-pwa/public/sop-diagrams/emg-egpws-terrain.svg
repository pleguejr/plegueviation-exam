<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1150" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c16"/>
      <stop offset="50%" stop-color="#0c1626"/>
      <stop offset="100%" stop-color="#050810"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#152238"/>
      <stop offset="100%" stop-color="#0f192b"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1600" height="1150" fill="url(#bgGrad)"/>

  <!-- Header Banner -->
  <g transform="translate(40, 25)">
    <rect width="1520" height="85" rx="12" fill="#132035" stroke="#253856" stroke-width="2" filter="url(#shadow)"/>
    <rect width="12" height="85" fill="url(#redGrad)" rx="3"/>
    
    <text x="35" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#f8fafc" letter-spacing="0.5">
      EMERGENCIA: ESCAPE EGPWS / TERRAIN AWARENESS
    </text>
    <text x="35" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#38bdf8">
      Maniobra Inmediata de Escape de Proximidad al Terreno • Binter MOB 3.1.7 &amp; SOPM Sec 3 • QRH Rev 20
    </text>

    <rect x="1330" y="24" width="160" height="38" rx="8" fill="rgba(220, 38, 38, 0.2)" stroke="#ef4444" stroke-width="1.5"/>
    <text x="1410" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#f87171" text-anchor="middle">
      PULL UP ESCAPE
    </text>
  </g>

  <!-- Visual Mountain Terrain Obstacle Banner with Binter Aircraft -->
  <g transform="translate(40, 130)">
    <rect width="1520" height="175" rx="12" fill="url(#cardGrad)" stroke="#ef4444" stroke-width="1.5" filter="url(#shadow)"/>
    
    <!-- Mountain Silhouette -->
    <path d="M 280,160 Q 520,30 760,160" fill="rgba(239, 68, 68, 0.25)" stroke="#ef4444" stroke-width="2"/>
    <text x="520" y="125" font-family="sans-serif" font-size="14" font-weight="800" fill="#f87171" text-anchor="middle">OBSTÁCULO / OROGRAFÍA DEL TERRENO</text>

    <!-- Normal Descent Path -->
    <line x1="60" y1="140" x2="280" y2="140" stroke="#94a3b8" stroke-width="2"/>
    <text x="170" y="130" font-family="sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle">Trayectoria Previa</text>

    <!-- Escape Arc -->
    <path d="M 280,140 Q 420,135 560,40 L 900,15" fill="none" stroke="#22c55e" stroke-width="4" stroke-dasharray="6,3"/>

    <!-- Aircraft in Maximum Performance Climb at 15° Pitch towards PLI (Binter E195-E2) -->
    <g transform="translate(560, 55) rotate(-22) scale(0.65)">
      <path d="M -160,0 L 160,0 Q 200,0 180,5 L -140,5 Z" fill="#f8fafc" stroke="#94a3b8"/>
      <path d="M 0,0 L -50,-45 L -25,-45 L 30,0 Z" fill="#059669"/>
      <path d="M 0,0 L -50,45 L -25,45 L 30,0 Z" fill="#059669"/>
      <path d="M -120,0 L -160,-35 L -140,-35 L -100,0 Z" fill="#0284c7"/>
    </g>
    <text x="640" y="35" font-family="sans-serif" font-size="14" font-weight="900" fill="#34d399">MÁXIMO ASCENSO HACIA PLI</text>

    <!-- Critical Warning Box -->
    <rect x="1080" y="20" width="400" height="135" rx="8" fill="rgba(220, 38, 38, 0.25)" stroke="#ef4444" stroke-width="1.5"/>
    <text x="1100" y="45" font-family="sans-serif" font-size="14.5" font-weight="900" fill="#f87171">DISPARADORES SONOROS (AURAL):</text>
    <text x="1100" y="68" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff">• "PULL UP" • "TERRAIN, TERRAIN, PULL UP"</text>
    <text x="1100" y="88" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff">• "OBSTACLE, OBSTACLE, PULL UP"</text>
    <text x="1100" y="110" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff">• "TERRAIN AHEAD, PULL UP"</text>
    <text x="1100" y="132" font-family="sans-serif" font-size="12" font-weight="600" fill="#fbbf24">➔ Respuesta inmediata de memoria requerida.</text>
  </g>

  <!-- 3 Main Columns: PF, PM, Reglas/Configuracion -->
  <g transform="translate(40, 325)">
    
    <!-- Col 1: Acciones PF -->
    <g transform="translate(0, 0)">
      <rect width="485" height="560" rx="12" fill="url(#cardGrad)" stroke="#ef4444" stroke-width="2" filter="url(#shadow)"/>
      <rect width="485" height="42" rx="12" fill="url(#redGrad)"/>
      <text x="242" y="27" font-family="sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">
        1. PILOT FLYING (PF) — INMEDIATO
      </text>

      <g transform="translate(20, 60)" font-family="sans-serif">
        <rect width="445" height="125" rx="8" fill="#18263e" stroke="#334155" stroke-width="1"/>
        <text x="20" y="28" font-size="15" font-weight="800" fill="#f87171">1. Desconexión de AP &amp; Autothrottle</text>
        <text x="20" y="52" font-size="14" font-weight="800" fill="#38bdf8">PF CALLOUT: "MY CONTROLS"</text>
        <text x="20" y="74" font-size="13.5" font-weight="500" fill="#cbd5e1">• Desconectar AP y A/T en el yoke / palancas.</text>
        <text x="20" y="96" font-size="13.5" font-weight="700" fill="#fbbf24">• Palancas al tope máximo: MAX DETENT.</text>
        <text x="20" y="116" font-size="12" font-weight="500" fill="#94a3b8">FADEC entrega automáticamente empuje de reserva (RSV).</text>

        <g transform="translate(0, 140)">
          <rect width="445" height="135" rx="8" fill="#18263e" stroke="#10b981" stroke-width="1.5"/>
          <text x="20" y="28" font-size="15" font-weight="800" fill="#34d399">2. Alas Niveladas &amp; Cabeceo a 15°</text>
          <text x="20" y="52" font-size="13.5" font-weight="500" fill="#e2e8f0">• <tspan font-weight="800" fill="#34d399">Wings Level:</tspan> Nivelar planos inmediatamente.</text>
          <text x="20" y="74" font-size="13.5" font-weight="500" fill="#e2e8f0">• Tirar con decisión hasta <tspan font-weight="800" fill="#facc15">15° cabeceo arriba</tspan></text>
          <text x="20" y="96" font-size="13.5" font-weight="500" fill="#e2e8f0">hacia el Pitch Limit Indicator (PLI).</text>
          <text x="20" y="118" font-size="13" font-weight="700" fill="#fbbf24">• Verificar Speedbrakes RETRACTADOS.</text>
        </g>

        <g transform="translate(0, 290)">
          <rect width="445" height="110" rx="8" fill="#18263e" stroke="#334155" stroke-width="1"/>
          <text x="20" y="28" font-size="15" font-weight="800" fill="#38bdf8">Callout Estándar del PF</text>
          <text x="20" y="54" font-size="15" font-weight="900" fill="#fbbf24">"PULL UP, CLIMBING"</text>
          <text x="20" y="78" font-size="13" font-weight="500" fill="#cbd5e1">Mantener régimen de máximo ascenso hasta</text>
          <text x="20" y="98" font-size="13" font-weight="500" fill="#cbd5e1">alcanzar altitud segura (MSA / MORA).</text>
        </g>
      </g>
    </g>

    <!-- Col 2: Acciones PM -->
    <g transform="translate(515, 0)">
      <rect width="485" height="560" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)"/>
      <rect width="485" height="42" rx="12" fill="url(#blueGrad)"/>
      <text x="242" y="27" font-family="sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">
        2. PILOT MONITORING (PM)
      </text>

      <g transform="translate(20, 60)" font-family="sans-serif">
        <rect width="445" height="125" rx="8" fill="#18263e" stroke="#334155" stroke-width="1"/>
        <text x="20" y="28" font-size="15" font-weight="800" fill="#38bdf8">1. Verificación de Potencia &amp; Cinturones</text>
        <text x="20" y="52" font-size="13.5" font-weight="500" fill="#cbd5e1">• Verificar empuje MAX y Speedbrakes dentro.</text>
        <text x="20" y="74" font-size="13.5" font-weight="700" fill="#fbbf24">• Encender señal de cinturones (FSN BELTS ON).</text>
        <text x="20" y="96" font-size="13.5" font-weight="500" fill="#cbd5e1">• Escanear visualmente referencias fuera.</text>
        <text x="20" y="116" font-size="12" font-weight="500" fill="#94a3b8">• Monitorear pantalla de terreno MFD.</text>

        <g transform="translate(0, 140)">
          <rect width="445" height="135" rx="8" fill="#18263e" stroke="#0284c7" stroke-width="1.5"/>
          <text x="20" y="28" font-size="15" font-weight="800" fill="#38bdf8">2. Cantadas de Instrumentos Activas</text>
          <text x="20" y="52" font-size="13.5" font-weight="500" fill="#e2e8f0">• Cantar activamente <tspan font-weight="700" fill="#34d399">indicaciones de radioaltímetro (RA)</tspan>.</text>
          <text x="20" y="74" font-size="13.5" font-weight="500" fill="#e2e8f0">• Cantar tendencia y tasa de variómetro de ascenso.</text>
          <text x="20" y="96" font-size="13.5" font-weight="700" fill="#fbbf24">• Alertar si la altitud no aumenta con rapidez.</text>
        </g>

        <g transform="translate(0, 290)">
          <rect width="445" height="110" rx="8" fill="#18263e" stroke="#334155" stroke-width="1"/>
          <text x="20" y="28" font-size="15" font-weight="800" fill="#38bdf8">3. Notificación a ATC</text>
          <text x="20" y="52" font-size="13.5" font-weight="900" fill="#facc15">"[Callsign] TERRAIN PULL UP"</text>
          <text x="20" y="74" font-size="13.5" font-weight="900" fill="#facc15">"CLIMBING TO [MSA]"</text>
          <text x="20" y="96" font-size="12" font-weight="500" fill="#cbd5e1">Informa a control de la maniobra de emergencia.</text>
        </g>
      </g>
    </g>

    <!-- Col 3: Reglas de Oro & Configuracion -->
    <g transform="translate(1030, 0)">
      <rect width="490" height="560" rx="12" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
      <rect width="490" height="42" rx="12" fill="url(#goldGrad)"/>
      <text x="245" y="27" font-family="sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">
        3. CONFIGURACIÓN &amp; RECUPERACIÓN
      </text>

      <g transform="translate(20, 60)" font-family="sans-serif">
        <rect width="450" height="145" rx="8" fill="rgba(220, 38, 38, 0.2)" stroke="#ef4444" stroke-width="1.5"/>
        <text x="18" y="26" font-size="14.5" font-weight="900" fill="#f87171">¡PROHIBICIÓN TOTAL DE CAMBIO CONFIG.!</text>
        <text x="18" y="50" font-size="13" font-weight="700" fill="#ffffff">• NO RETRAER NI MOVER FLAPS</text>
        <text x="18" y="70" font-size="13" font-weight="700" fill="#ffffff">• NO SUBIR NI MOVER EL TREN DE ATERRIZAJE</text>
        <text x="18" y="94" font-size="12.5" font-weight="500" fill="#fecaca">Razón aerodinámica: El ciclo de retracción de compuertas</text>
        <text x="18" y="114" font-size="12.5" font-weight="500" fill="#fecaca">aumenta transitoriamente la resistencia y reduce sustentación.</text>
        <text x="18" y="134" font-size="12.5" font-weight="600" fill="#fbbf24">Mantener configuración hasta librar terreno a MSA.</text>

        <g transform="translate(0, 160)">
          <rect width="450" height="120" rx="8" fill="#18263e" stroke="#10b981" stroke-width="1.5"/>
          <text x="18" y="26" font-size="14.5" font-weight="800" fill="#34d399">Restablecimiento Seguro a MSA</text>
          <text x="18" y="50" font-size="13" font-weight="500" fill="#cbd5e1">• Al alcanzar la MSA o altitud segura fuera de peligro:</text>
          <text x="18" y="72" font-size="13" font-weight="500" fill="#cbd5e1">• Reducir cabeceo con suavidad y nivelar.</text>
          <text x="18" y="92" font-size="13" font-weight="500" fill="#cbd5e1">• Ajustar potencia de ascenso o crucero normal.</text>
          <text x="18" y="112" font-size="13" font-weight="700" fill="#38bdf8">• Conectar Piloto Automático.</text>
        </g>

        <g transform="translate(0, 295)">
          <rect width="450" height="95" rx="8" fill="#18263e" stroke="#334155" stroke-width="1"/>
          <text x="18" y="26" font-size="14" font-weight="800" fill="#fbbf24">Acciones Posteriores (MOA 11)</text>
          <text x="18" y="48" font-size="13" font-weight="500" fill="#cbd5e1">• Notificar a ATC que se retoman autorizaciones.</text>
          <text x="18" y="70" font-size="13" font-weight="500" fill="#cbd5e1">• Cumplimentar ASR / Reporte EGPWS obligatorio.</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Bottom Bar -->
  <g transform="translate(40, 1010)">
    <rect width="1520" height="110" rx="12" fill="#132035" stroke="#253856" stroke-width="2" filter="url(#shadow)"/>
    <text x="30" y="36" font-family="sans-serif" font-size="16" font-weight="800" fill="#38bdf8">
      SISTEMA EGPWS / TAWS EN EL EMBRAER 195-E2:
    </text>
    <text x="30" y="65" font-family="sans-serif" font-size="14" font-weight="500" fill="#cbd5e1">
      • En caso de aviso visual ámbar "TERRAIN AHEAD" o "CAUTION TERRAIN" en vuelo VMC de día con terreno a la vista, se puede ajustar la trayectoria visualmente.
    </text>
    <text x="30" y="90" font-family="sans-serif" font-size="14" font-weight="500" fill="#cbd5e1">
      • En vuelo IMC o de noche, ante CUALQUIER alarma acústica "PULL UP", la maniobra de escape de máxima potencia es OBLIGATORIA e inmediata.
    </text>
  </g>
</svg>
