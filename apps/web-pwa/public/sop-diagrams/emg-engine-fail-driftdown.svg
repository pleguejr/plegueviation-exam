<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradEfato" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1a" />
      <stop offset="100%" stop-color="#121b2d" />
    </linearGradient>
    <linearGradient id="cardGradE" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#182338" />
      <stop offset="100%" stop-color="#0e1726" />
    </linearGradient>
    <linearGradient id="amberGradE" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGradEfato)" />

  <!-- Grid -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="365" x2="1200" y2="365" />
    <line x1="300" y1="0" x2="300" y2="675" />
    <line x1="600" y1="0" x2="600" y2="675" />
    <line x1="900" y1="0" x2="900" y2="675" />
  </g>

  <!-- Header Banner -->
  <rect x="30" y="16" width="1140" height="64" rx="10" fill="#111c2e" stroke="#ef4444" stroke-opacity="0.4" stroke-width="1.5" />
  
  <!-- Embraer 195-E2 Silhouette -->
  <g transform="translate(48, 26) scale(0.6)">
    <path d="M 0 25 Q 35 15 70 18 L 85 5 L 92 6 L 82 19 L 140 22 L 185 0 L 195 2 L 165 24 L 205 25 Q 215 25 220 28 L 200 31 L 165 31 L 145 42 L 138 41 L 148 31 L 80 30 L 70 42 L 62 41 L 68 29 Q 30 30 0 25 Z" fill="#ef4444" fill-opacity="0.9" />
    <rect x="90" y="27" width="28" height="10" rx="4" fill="#b91c1c" />
    <polygon points="185,2 193,3 175,20 168,20" fill="#10b981" />
  </g>

  <text x="185" y="44" fill="#f87171" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" letter-spacing="1">FALLO DE MOTOR EN DESPEGUE (EFATO) &amp; DRIFTDOWN EN RUTA</text>
  <text x="185" y="66" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Manuales Binter MOB 3.1.2, 3.1.6 &amp; QRH Rev19 · Flota Embraer 195-E2</text>
  
  <rect x="980" y="26" width="175" height="42" rx="6" fill="#450a0a" fill-opacity="0.4" stroke="#ef4444" stroke-width="1" />
  <text x="1067" y="52" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">SOP MONOMOTOR (OEI)</text>

  <!-- SECTION 1 (UPPER): FALLO DE MOTOR EN DESPEGUE (EFATO >= V1) -->
  <g transform="translate(30, 95)">
    <rect width="1140" height="260" rx="12" fill="url(#cardGradE)" stroke="#ef4444" stroke-width="1.2" />
    <text x="24" y="26" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="14" font-weight="800">1. FALLO DE MOTOR EN DESPEGUE (EFATO A V1 O SUPERIOR)</text>

    <!-- Flight trajectory profile drawing -->
    <path d="M 60 210 L 220 210 Q 280 210 360 140 L 650 95 L 1080 70" fill="none" stroke="#ef4444" stroke-width="3" stroke-dasharray="6 3" />
    
    <!-- Runway -->
    <rect x="50" y="212" width="220" height="14" rx="2" fill="#334155" stroke="#64748b" stroke-width="1" />
    <line x1="60" y1="219" x2="260" y2="219" stroke="#f8fafc" stroke-width="2" stroke-dasharray="8 6" />

    <!-- Node 1: V1 / Engine Fail -->
    <circle cx="180" cy="210" r="8" fill="#ef4444" />
    <text x="180" y="196" fill="#f87171" font-size="11" font-weight="900" text-anchor="middle">V1 / FALLO</text>
    <text x="180" y="240" fill="#cbd5e1" font-size="9.5" text-anchor="middle">Continuar despegue,</text>
    <text x="180" y="252" fill="#cbd5e1" font-size="9.5" text-anchor="middle">guiñada con pedales.</text>

    <!-- Node 2: Vr & Pitch 10° -->
    <circle cx="270" cy="205" r="8" fill="#f59e0b" />
    <text x="270" y="185" fill="#fbbf24" font-size="11" font-weight="800" text-anchor="middle">VR: ROTACIÓN</text>
    <text x="270" y="240" fill="#cbd5e1" font-size="9.5" text-anchor="middle">Rotar suave a 10°</text>
    <text x="270" y="252" fill="#cbd5e1" font-size="9.5" text-anchor="middle">hacia barra del FD.</text>

    <!-- Node 3: Positive Rate - Gear Up -->
    <circle cx="360" cy="140" r="8" fill="#38bdf8" />
    <text x="360" y="120" fill="#38bdf8" font-size="11" font-weight="800" text-anchor="middle">POSITIVE RATE</text>
    <text x="360" y="132" fill="#bae6fd" font-size="10" font-weight="700" text-anchor="middle">PF: "GEAR UP"</text>

    <!-- Rule 400ft Banner -->
    <rect x="420" y="150" width="220" height="42" rx="6" fill="#450a0a" fill-opacity="0.4" stroke="#ef4444" stroke-width="1" />
    <text x="430" y="167" fill="#fca5a5" font-size="10" font-weight="800">CERO ACCIONES &lt; 400 FT AGL</text>
    <text x="430" y="181" fill="#cbd5e1" font-size="9">Excepto tren arriba y silenciar avisos.</text>

    <!-- Node 4: 400 ft to ACC ALT -->
    <circle cx="650" cy="95" r="8" fill="#8b5cf6" />
    <text x="650" y="75" fill="#c4b5fd" font-size="11" font-weight="800" text-anchor="middle">400 FT AGL ➔ HDG / LNAV</text>
    <text x="650" y="115" fill="#cbd5e1" font-size="9.5" text-anchor="middle">EOSID &amp; Low Bank.</text>
    <text x="650" y="127" fill="#cbd5e1" font-size="9.5" text-anchor="middle">PF: "SELECT HDG, AP ON"</text>

    <!-- Node 5: ACC ALT (Flaps 0 & Continuous) -->
    <circle cx="890" cy="78" r="8" fill="#10b981" />
    <text x="890" y="58" fill="#34d399" font-size="11" font-weight="800" text-anchor="middle">ACC ALT (Min 400/1000 ft)</text>
    <text x="890" y="100" fill="#cbd5e1" font-size="9.5" text-anchor="middle">FLCH a VFS / Green Dot - 10.</text>
    <text x="890" y="112" fill="#cbd5e1" font-size="9.5" text-anchor="middle">Retracción de Flaps a FLAP 0.</text>
    <text x="890" y="126" fill="#a7f3d0" font-size="10" font-weight="800" text-anchor="middle">PF: "CONTINUOUS"</text>

    <!-- E195-E2 Climbing Silhouette -->
    <g transform="translate(1000, 40) rotate(-8) scale(0.5)">
      <path d="M 0 25 Q 35 15 70 18 L 85 5 L 92 6 L 82 19 L 140 22 L 185 0 L 195 2 L 165 24 L 205 25 Q 215 25 220 28 L 200 31 L 165 31 L 145 42 L 138 41 L 148 31 L 80 30 L 70 42 L 62 41 L 68 29 Q 30 30 0 25 Z" fill="#ffffff" />
      <rect x="90" y="27" width="28" height="10" rx="4" fill="#10b981" />
    </g>
  </g>

  <!-- SECTION 2 (LOWER): DRIFTDOWN EN CRUCERO -->
  <g transform="translate(30, 370)">
    <rect width="1140" height="280" rx="12" fill="url(#cardGradE)" stroke="#38bdf8" stroke-width="1.2" />
    <text x="24" y="26" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="14" font-weight="800">2. DRIFTDOWN EN CRUCERO (FALLO DE MOTOR EN RUTA OEI)</text>

    <!-- Driftdown Trajectory -->
    <path d="M 60 70 L 250 70 Q 380 70 520 150 L 850 190 L 1080 190" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6 3" />

    <!-- Initial Level FL370 -->
    <line x1="50" y1="70" x2="260" y2="70" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="2 2" />
    <text x="60" y="55" fill="#94a3b8" font-size="11" font-weight="700">CRUCERO INICIAL: FL370 / FL390</text>

    <!-- Node 1: Engine Fail en crucero -->
    <circle cx="260" cy="70" r="8" fill="#ef4444" />
    <text x="260" y="48" fill="#f87171" font-size="11" font-weight="800" text-anchor="middle">FALLO OEI EN RUTA</text>
    
    <!-- 4 Structured Steps Boxes -->
    <rect x="30" y="90" width="255" height="165" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="40" y="112" fill="#38bdf8" font-size="11" font-weight="800">1° POTENCIA DE EMPUJE</text>
    <text x="40" y="130" fill="#cbd5e1" font-size="10">• Desconectar Autothrottle (A/T).</text>
    <text x="40" y="146" fill="#cbd5e1" font-size="10">• Avanzar palanca operativa</text>
    <text x="40" y="160" fill="#cbd5e1" font-size="10">  a TOGA y pulsar botón CON.</text>
    <text x="40" y="176" fill="#38bdf8" font-size="10.5" font-weight="700">➔ CONTINUOUS THRUST (MCT)</text>
    <text x="40" y="196" fill="#94a3b8" font-size="9.5">Confirmar EO prompt en FMS.</text>

    <rect x="295" y="90" width="260" height="165" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1" />
    <text x="305" y="112" fill="#fbbf24" font-size="11" font-weight="800">2° VELOCIDAD DE DRIFTDOWN</text>
    <text x="305" y="130" fill="#cbd5e1" font-size="10">• Seleccionar en FGS la velocidad</text>
    <text x="315" y="148" fill="#34d399" font-size="13" font-weight="900">GREEN DOT / VFS</text>
    <text x="305" y="170" fill="#cbd5e1" font-size="10">• Proporciona el máximo alcance</text>
    <text x="305" y="184" fill="#cbd5e1" font-size="10">  de planeo y mejor tasa L/D.</text>
    <text x="305" y="202" fill="#fde68a" font-size="10" font-weight="700">PF: "GREEN DOT SET"</text>

    <rect x="565" y="90" width="265" height="165" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
    <text x="575" y="112" fill="#38bdf8" font-size="11" font-weight="800">3° PERFIL DE DESCENSO</text>
    <text x="575" y="130" fill="#cbd5e1" font-size="10">• Comprobar techo monomotor en FMS:</text>
    <text x="585" y="148" fill="#7dd3fc" font-size="12" font-weight="800">EO MAX ALT (ej. FL210 - FL240)</text>
    <text x="575" y="168" fill="#cbd5e1" font-size="10">• Activar modo FLCH en FGS.</text>
    <text x="575" y="184" fill="#cbd5e1" font-size="10">• Virar para abandonar aerovía.</text>
    <text x="575" y="202" fill="#bae6fd" font-size="10" font-weight="700">PF: "EO MAX ALT SET, FLCH"</text>

    <rect x="840" y="90" width="275" height="165" rx="6" fill="#064e3b" fill-opacity="0.4" stroke="#10b981" stroke-width="1" />
    <text x="850" y="112" fill="#34d399" font-size="11" font-weight="800">4° NIVELACIÓN &amp; DESVÍO</text>
    <text x="850" y="130" fill="#cbd5e1" font-size="10">• Nivelar en EO MAX ALT.</text>
    <text x="850" y="144" fill="#a7f3d0" font-size="10" font-weight="700">Márgenes de franqueamiento:</text>
    <text x="860" y="160" fill="#ffffff" font-size="10.5" font-weight="700">2.000 ft Obstáculos / 1.000 ft NET</text>
    <text x="850" y="180" fill="#cbd5e1" font-size="10">• ATC: Mayday/Pan-Pan ➔ Desvío.</text>
    <text x="850" y="196" fill="#cbd5e1" font-size="10">• Ejecutar MEANA / QRH OEI.</text>
    <text x="850" y="212" fill="#cbd5e1" font-size="10">• ePerf InFlight Landing en destino.</text>
  </g>
</svg>
