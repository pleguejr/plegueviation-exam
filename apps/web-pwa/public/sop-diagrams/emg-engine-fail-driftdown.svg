<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1150" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c16"/>
      <stop offset="50%" stop-color="#0c1626"/>
      <stop offset="100%" stop-color="#050810"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#152238"/>
      <stop offset="100%" stop-color="#0f192b"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="1150" fill="url(#bgGrad)"/>

  <!-- Header Banner -->
  <g transform="translate(40, 25)">
    <rect width="1520" height="85" rx="12" fill="#132035" stroke="#253856" stroke-width="2" filter="url(#shadow)"/>
    <rect width="12" height="85" fill="url(#redGrad)" rx="3"/>
    
    <text x="35" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#f8fafc" letter-spacing="0.5">
      FALLO DE MOTOR EN DESPEGUE (EFATO) &amp; DRIFTDOWN EN RUTA
    </text>
    <text x="35" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#38bdf8">
      Secuencia OEI • Binter MOB 3.1.2, 3.1.6 &amp; QRH Rev 20 • Embraer 195-E2
    </text>

    <rect x="1330" y="24" width="160" height="38" rx="8" fill="rgba(220, 38, 38, 0.2)" stroke="#ef4444" stroke-width="1.5"/>
    <text x="1410" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#f87171" text-anchor="middle">
      PROCEDIMIENTO OEI
    </text>
  </g>

  <!-- Top Graphic: Visual Profile EFATO Climb & Driftdown with Binter Aircraft -->
  <g transform="translate(40, 130)">
    <rect width="1520" height="175" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
    
    <!-- Left Section: EFATO Profile -->
    <g transform="translate(30, 20)">
      <text x="0" y="20" font-family="sans-serif" font-size="15" font-weight="800" fill="#38bdf8">TRAYECTORIA DE DESPEGUE MONOMOTOR (EFATO):</text>
      <!-- Runway line -->
      <line x1="0" y1="120" x2="200" y2="120" stroke="#64748b" stroke-width="2"/>
      <line x1="200" y1="120" x2="450" y2="45" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="5,3"/>
      <line x1="450" y1="45" x2="700" y2="45" stroke="#38bdf8" stroke-width="2.5"/>

      <!-- Milestones -->
      <circle cx="150" cy="120" r="4" fill="#ef4444"/>
      <text x="150" y="140" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#f87171" text-anchor="middle">V1 / VR</text>

      <circle cx="280" cy="95" r="4" fill="#38bdf8"/>
      <text x="280" y="115" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#cbd5e1" text-anchor="middle">Gear Up (Pos. Climb)</text>

      <circle cx="450" cy="45" r="5" fill="#f59e0b"/>
      <text x="450" y="30" font-family="sans-serif" font-size="12" font-weight="800" fill="#fbbf24" text-anchor="middle">ACC ALT (FLAP ZERO)</text>

      <circle cx="650" cy="45" r="5" fill="#10b981"/>
      <text x="650" y="30" font-family="sans-serif" font-size="12" font-weight="800" fill="#34d399" text-anchor="middle">CONTINUOUS (CON)</text>
    </g>

    <!-- Right Section: Driftdown Profile -->
    <g transform="translate(800, 20)">
      <text x="0" y="20" font-family="sans-serif" font-size="15" font-weight="800" fill="#fbbf24">PERFIL DE DRIFTDOWN EN CRUCERO (OEI EN RUTA):</text>
      
      <!-- Cruise Level to EO Ceiling -->
      <line x1="50" y1="40" x2="250" y2="40" stroke="#94a3b8" stroke-width="2"/>
      <text x="50" y="30" font-family="sans-serif" font-size="12" font-weight="700" fill="#cbd5e1">FL370 (CRUISE)</text>

      <!-- Descent line -->
      <path d="M 250,40 Q 400,45 550,110 L 680,110" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="6,3"/>
      
      <circle cx="260" cy="40" r="5" fill="#ef4444"/>
      <text x="260" y="60" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#f87171">Fallo Motor: TOGA/CON</text>

      <circle cx="420" cy="70" r="5" fill="#34d399"/>
      <text x="430" y="65" font-family="sans-serif" font-size="12" font-weight="800" fill="#34d399">GREEN DOT SPEED</text>

      <circle cx="600" cy="110" r="5" fill="#38bdf8"/>
      <text x="600" y="135" font-family="sans-serif" font-size="12" font-weight="800" fill="#38bdf8" text-anchor="middle">EO MAX ALT (NIVELACIÓN)</text>
    </g>
  </g>

  <!-- 3 Main Columns -->
  <g transform="translate(40, 325)">
    
    <!-- Col 1: EFATO Secuencia de Despegue -->
    <g transform="translate(0, 0)">
      <rect width="485" height="560" rx="12" fill="url(#cardGrad)" stroke="#ef4444" stroke-width="2" filter="url(#shadow)"/>
      <rect width="485" height="42" rx="12" fill="url(#redGrad)"/>
      <text x="242" y="27" font-family="sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">
        1. FALLO DE MOTOR EN DESPEGUE (≥ V1)
      </text>

      <g transform="translate(20, 60)" font-family="sans-serif">
        <rect width="445" height="110" rx="8" fill="#18263e" stroke="#334155" stroke-width="1"/>
        <text x="20" y="28" font-size="15" font-weight="800" fill="#f87171">V1 alcanzada ➔ ¡CONTINUAR DESPEGUE!</text>
        <text x="20" y="52" font-size="13.5" font-weight="500" fill="#e2e8f0">• Mantener eje de pista con timón de dirección (Rudder).</text>
        <text x="20" y="74" font-size="13.5" font-weight="500" fill="#cbd5e1">• A VR: Rotar inicialmente a <tspan font-weight="700" fill="#ffffff">10° cabeceo hacia el FD</tspan>.</text>
        <text x="20" y="96" font-size="13.5" font-weight="500" fill="#cbd5e1">• PM canta: <tspan font-weight="700" fill="#38bdf8">"POSITIVE RATE"</tspan> ➔ PF: <tspan font-weight="700" fill="#38bdf8">"GEAR UP"</tspan>.</text>

        <g transform="translate(0, 125)">
          <rect width="445" height="120" rx="8" fill="rgba(220, 38, 38, 0.2)" stroke="#ef4444" stroke-width="1.5"/>
          <text x="20" y="28" font-size="15" font-weight="800" fill="#f87171">¡CERO ACCIONES POR DEBAJO DE 400 FT!</text>
          <text x="20" y="52" font-size="13.5" font-weight="500" fill="#fecaca">• Prohibido tocar interruptores o checklists &lt; 400 ft AGL.</text>
          <text x="20" y="74" font-size="13.5" font-weight="500" fill="#fecaca">• De 400 ft a ACC ALT: Comprobar EOSID / HDG.</text>
          <text x="20" y="96" font-size="13.5" font-weight="700" fill="#ffffff">Pedir: "SELECT HDG", "SELECT AUTOPILOT".</text>
        </g>

        <g transform="translate(0, 260)">
          <rect width="445" height="135" rx="8" fill="#18263e" stroke="#334155" stroke-width="1"/>
          <text x="20" y="28" font-size="15" font-weight="800" fill="#38bdf8">Alcanzada la ACC ALT (Aceleración)</text>
          <text x="20" y="52" font-size="13.5" font-weight="500" fill="#e2e8f0">• Seleccionar FLCH (manual) a <tspan font-weight="800" fill="#34d399">VFS / Green Dot</tspan>.</text>
          <text x="20" y="74" font-size="13.5" font-weight="500" fill="#cbd5e1">• Retraer flaps secuencialmente hasta <tspan font-weight="700" fill="#ffffff">FLAP ZERO</tspan>.</text>
          <text x="20" y="96" font-size="13.5" font-weight="700" fill="#fbbf24">• Con Flap Zero ➔ PF: "CONTINUOUS" (Empuje CON).</text>
          <text x="20" y="118" font-size="13.5" font-weight="500" fill="#94a3b8">• Iniciar lectura de listas QRH / MEANA.</text>
        </g>
      </g>
    </g>

    <!-- Col 2: Driftdown en Crucero -->
    <g transform="translate(515, 0)">
      <rect width="485" height="560" rx="12" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
      <rect width="485" height="42" rx="12" fill="url(#goldGrad)"/>
      <text x="242" y="27" font-family="sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">
        2. TÉCNICA DE DRIFTDOWN EN RUTA
      </text>

      <g transform="translate(20, 60)" font-family="sans-serif">
        <rect width="445" height="120" rx="8" fill="#18263e" stroke="#334155" stroke-width="1"/>
        <text x="20" y="28" font-size="15" font-weight="800" fill="#fbbf24">Paso 1: Ajuste de Empuje Monomotor</text>
        <text x="20" y="52" font-size="13.5" font-weight="500" fill="#e2e8f0">• En automático: Confirmar prompt EO en el FMS.</text>
        <text x="20" y="74" font-size="13.5" font-weight="500" fill="#cbd5e1">• En manual: Desconectar A/T, palanca operativa a</text>
        <text x="20" y="96" font-size="13.5" font-weight="700" fill="#38bdf8">TOGA y seleccionar CONTINUOUS (CON).</text>
        
        <g transform="translate(0, 135)">
          <rect width="445" height="120" rx="8" fill="#18263e" stroke="#10b981" stroke-width="1.5"/>
          <text x="20" y="28" font-size="15" font-weight="800" fill="#34d399">Paso 2: Velocidad GREEN DOT</text>
          <text x="20" y="52" font-size="13.5" font-weight="500" fill="#e2e8f0">• PF: <tspan font-weight="800" fill="#34d399">"GREEN DOT SET"</tspan> en el Flight Guidance.</text>
          <text x="20" y="74" font-size="13.5" font-weight="500" fill="#cbd5e1">• Proporciona el máximo régimen de planeo (L/D max)</text>
          <text x="20" y="96" font-size="13.5" font-weight="500" fill="#cbd5e1">y óptimo franqueamiento de obstáculos.</text>
        </g>

        <g transform="translate(0, 270)">
          <rect width="445" height="135" rx="8" fill="#18263e" stroke="#334155" stroke-width="1"/>
          <text x="20" y="28" font-size="15" font-weight="800" fill="#38bdf8">Paso 3: Descenso y Nivelación</text>
          <text x="20" y="52" font-size="13.5" font-weight="500" fill="#e2e8f0">• Comprobar techo monomotor <tspan font-weight="700" fill="#fbbf24">EO MAX ALT</tspan> en FMS.</text>
          <text x="20" y="74" font-size="13.5" font-weight="500" fill="#cbd5e1">• Ajustar altitud en FGS y activar modo <tspan font-weight="700" fill="#38bdf8">FLCH</tspan>.</text>
          <text x="20" y="96" font-size="13.5" font-weight="500" fill="#cbd5e1">• Nivelar en EO MAX ALT (márgenes: 2.000 ft ruta).</text>
          <text x="20" y="118" font-size="13.5" font-weight="700" fill="#34d399">• Comunicar desvío a ATC: "I HAVE ATC".</text>
        </g>
      </g>
    </g>

    <!-- Col 3: Memory Items vs QRH -->
    <g transform="translate(1030, 0)">
      <rect width="490" height="560" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)"/>
      <rect width="490" height="42" rx="12" fill="url(#blueGrad)"/>
      <text x="245" y="27" font-family="sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">
        3. MEMORY ITEMS vs CHECKLIST QRH
      </text>

      <g transform="translate(20, 60)" font-family="sans-serif">
        <!-- Severe damage box -->
        <rect width="450" height="195" rx="8" fill="rgba(220, 38, 38, 0.2)" stroke="#ef4444" stroke-width="1.5"/>
        <text x="18" y="26" font-size="14.5" font-weight="800" fill="#f87171">SEVERE DAMAGE / FIRE (MEMORY ITEMS):</text>
        <text x="18" y="48" font-size="12.5" font-weight="600" fill="#fecaca">Ruido, vibración severa, fuego o guiones ámbar:</text>
        <text x="18" y="72" font-size="13" font-weight="700" fill="#ffffff">1. AUTOTHROTTLE DISCONNECT</text>
        <text x="18" y="94" font-size="13" font-weight="700" fill="#ffffff">2. OPERATIVE ENGINE PF: Min 5% above N1 IDLE</text>
        <text x="18" y="116" font-size="13" font-weight="700" fill="#fbbf24">3. PF: "THRUST LEVER IDLE, CONFIRM" ➔ PM: "CONFIRM"</text>
        <text x="18" y="138" font-size="13" font-weight="700" fill="#fbbf24">4. PF: "ENG START/STOP STOP, CONFIRM" ➔ PM: "CONFIRM"</text>
        <text x="18" y="160" font-size="13" font-weight="700" fill="#f87171">5. PF: "FIRE HANDLE PULL, CONFIRM" ➔ PM: "CONFIRM"</text>

        <!-- Flameout box -->
        <g transform="translate(0, 210)">
          <rect width="450" height="150" rx="8" fill="#18263e" stroke="#334155" stroke-width="1"/>
          <text x="18" y="26" font-size="14.5" font-weight="800" fill="#38bdf8">ENGINE FAILURE SIMPLE (MOLINETE):</text>
          <text x="18" y="50" font-size="13" font-weight="500" fill="#cbd5e1">• Pérdida de empuje sin daños estructurales ni fuego.</text>
          <text x="18" y="72" font-size="13" font-weight="700" fill="#34d399">• ¡NO APLICAR MEMORY ITEMS!</text>
          <text x="18" y="94" font-size="13" font-weight="500" fill="#cbd5e1">• Se gestiona directamente mediante la lista de</text>
          <text x="18" y="114" font-size="13" font-weight="500" fill="#cbd5e1">anormalidades del QRH (Engine Failure Checklist).</text>
          <text x="18" y="134" font-size="12.5" font-weight="600" fill="#fbbf24">Valorar intento de reencendido si N2 &gt; 0.</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Bottom Bar -->
  <g transform="translate(40, 1010)">
    <rect width="1520" height="110" rx="12" fill="#132035" stroke="#253856" stroke-width="2" filter="url(#shadow)"/>
    <text x="30" y="36" font-family="sans-serif" font-size="16" font-weight="800" fill="#38bdf8">
      CONFIRMACIÓN CRUZADA OBLIGATORIA (CALLOUTS PF / PM):
    </text>
    <text x="30" y="65" font-family="sans-serif" font-size="14" font-weight="500" fill="#cbd5e1">
      • Nunca mover palancas de empuje, selectores de arranque o manerales de fuego sin confirmación visual y verbal expresa del PM.
    </text>
    <text x="30" y="90" font-family="sans-serif" font-size="14" font-weight="500" fill="#cbd5e1">
      • En aproximación monomotor final: Flap 5 (o Flap 4 según QRH) con VAP monomotor ajustada en el MCDU.
    </text>
  </g>
</svg>
